name: Environment Building planar-role hard-normal authority rebind evidence

on:
  push:
    branches: [studio/environment-weather-variant-object-convergence-001]
    paths:
      - "contracts/environment_building_planar_role_hard_normal_authority_rebind.json"
      - "tools/environment_building_planar_role_hard_normal_authority_rebind.py"
      - "docs/ENVIRONMENT_BUILDING_PLANAR_ROLE_HARD_NORMAL_AUTHORITY_REBIND_001.md"
      - ".github/workflows/environment-building-planar-role-hard-normal-authority-rebind.yml"
  pull_request:
    paths:
      - "contracts/environment_building_planar_role_hard_normal_authority_rebind.json"
      - "tools/environment_building_planar_role_hard_normal_authority_rebind.py"
      - "docs/ENVIRONMENT_BUILDING_PLANAR_ROLE_HARD_NORMAL_AUTHORITY_REBIND_001.md"
      - ".github/workflows/environment-building-planar-role-hard-normal-authority-rebind.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  rebind-current-world-consumer-to-source-hard-normal-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PRIOR_ENVIRONMENT_HEAD: 9c1fb7b1a53f06a6a8c3c72ce3d1c3e5e1354d3f
      PRIOR_ENVIRONMENT_RUN: "35200887763"
      PRIOR_ENVIRONMENT_ARTIFACT_NAME: environment-building-planar-role-quotient-receiving-rebind-001-9c1fb7b1a53f06a6a8c3c72ce3d1c3e5e1354d3f
      HARD_SURFACE_HEAD: 7b86b1a9da1ef8dc670ca01cf4918728e68ece92
      HARD_SURFACE_POLICY_BLOB: 826cc61a2e9fc172db5025f5b3ace6f566d5125a
      HARD_SURFACE_POLICY_CANON: 607cd4a26d4a53da41d350bce056b2d6cb57fd5f05b750c200ade45cd4a9a9c9
    steps:
      - name: Checkout exact Environment head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bind exact Environment gate
        run: |
          set -euo pipefail
          git rev-parse HEAD > exact-head.txt
          python -m py_compile tools/environment_building_planar_role_hard_normal_authority_rebind.py

      - name: Download exact prior multi-asset Environment evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PRIOR_ENVIRONMENT_ARTIFACT_NAME }}
          path: evidence/environment_building_planar_role_hard_normal_authority_rebind_001/prior
          github-token: ${{ github.token }}
          run-id: ${{ env.PRIOR_ENVIRONMENT_RUN }}

      - name: Verify prior Environment evidence identity
        run: |
          set -euo pipefail
          out=evidence/environment_building_planar_role_hard_normal_authority_rebind_001/prior
          test "$(tr -d '\n\r' < "$out/exact-head.txt")" = "$PRIOR_ENVIRONMENT_HEAD"
          test -f "$out/environment-report.json"
          test -f "$out/runtime-report.json"
          test -f "$out/current/runtime.json"
          test "$(find "$out/current/rendered" -maxdepth 1 -type f -name 'atmosphere-width-*.png' | wc -l | tr -d ' ')" = "68"

      - name: Checkout exact Building Hard-Surface authority donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-building-design
          ref: ${{ env.HARD_SURFACE_HEAD }}
          path: .building-hard-surface
          fetch-depth: 1

      - name: Verify exact Hard-Surface policy identity
        run: |
          set -euo pipefail
          test "$(git -C .building-hard-surface rev-parse HEAD)" = "$HARD_SURFACE_HEAD"
          test "$(git -C .building-hard-surface rev-parse HEAD:assets/service_pavilion_001_planar_role_hard_normal_authority_policy.json)" = "$HARD_SURFACE_POLICY_BLOB"
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=Path('.building-hard-surface/assets/service_pavilion_001_planar_role_hard_normal_authority_policy.json')
          d=json.loads(p.read_text())
          canon=hashlib.sha256(json.dumps(d,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()
          assert canon=='607cd4a26d4a53da41d350bce056b2d6cb57fd5f05b750c200ade45cd4a9a9c9', canon
          assert d['consumer_policy']['automatic_receiver_adoption'] is False
          assert d['observed_identity_boundary']['dropped_attribute']=='EXACT_CARDINAL_HARD_NORMAL'
          PY

      - name: Gate source-owner authority against exact current-world consumer evidence
        run: |
          set -euo pipefail
          root=evidence/environment_building_planar_role_hard_normal_authority_rebind_001
          prior="$root/prior"
          cp .building-hard-surface/assets/service_pavilion_001_planar_role_hard_normal_authority_policy.json "$root/hard-surface-authority-policy.json"
          cp contracts/environment_building_planar_role_hard_normal_authority_rebind.json "$root/receiving-contract.json"
          python tools/environment_building_planar_role_hard_normal_authority_rebind.py \
            --contract contracts/environment_building_planar_role_hard_normal_authority_rebind.json \
            --consumer-identity contracts/environment_building_planar_role_consumer_identity.json \
            --quotient-contract contracts/environment_building_planar_role_quotient_receiving.json \
            --hard-surface-policy .building-hard-surface/assets/service_pavilion_001_planar_role_hard_normal_authority_policy.json \
            --prior-environment-report "$prior/environment-report.json" \
            --runtime "$prior/current/runtime.json" \
            --runtime-report "$prior/runtime-report.json" \
            --frames-root "$prior/current/rendered" \
            --exact-head "$(cat exact-head.txt)" \
            --output "$root/environment-report.json"
          cp exact-head.txt "$root/exact-head.txt"
          python - <<'PY'
          import json
          p=json.load(open('evidence/environment_building_planar_role_hard_normal_authority_rebind_001/environment-report.json'))
          assert p['state']=='PASS_CURRENT_WORLD_BUILDING_312_CONSUMER_REBOUND_TO_SOURCE_HARD_NORMAL_AUTHORITY'
          assert p['source_authority']['source_intent_render_classes']==604
          assert p['source_authority']['derived_role_position_groups']==312
          assert p['source_authority']['dropped_source_attributes']==['EXACT_CARDINAL_HARD_NORMAL']
          assert p['consumer_declaration']['source_hard_normal_identity_preserved'] is False
          assert p['multi_asset_current_world']['retained_real_godot_frames']==68
          assert p['environment_adoption'] is False
          PY

      - name: Deliberate fail-closed dropped-source-boundary mutation
        run: |
          set -euo pipefail
          root=evidence/environment_building_planar_role_hard_normal_authority_rebind_001
          prior="$root/prior"
          cp contracts/environment_building_planar_role_hard_normal_authority_rebind.json "$root/mutated-contract.json"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('evidence/environment_building_planar_role_hard_normal_authority_rebind_001/mutated-contract.json')
          d=json.loads(p.read_text())
          d['source_authority_boundary']['dropped_source_attributes']=[]
          d['consumer_declaration']['source_hard_normal_identity_preserved']=True
          p.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
          if python tools/environment_building_planar_role_hard_normal_authority_rebind.py \
            --contract "$root/mutated-contract.json" \
            --consumer-identity contracts/environment_building_planar_role_consumer_identity.json \
            --quotient-contract contracts/environment_building_planar_role_quotient_receiving.json \
            --hard-surface-policy .building-hard-surface/assets/service_pavilion_001_planar_role_hard_normal_authority_policy.json \
            --prior-environment-report "$prior/environment-report.json" \
            --runtime "$prior/current/runtime.json" \
            --runtime-report "$prior/runtime-report.json" \
            --frames-root "$prior/current/rendered" \
            --exact-head "$(cat exact-head.txt)" \
            --output "$root/mutated-report.json"; then
            echo "mutated contract unexpectedly passed" >&2
            exit 1
          fi

      - name: Upload exact Environment authority-rebind evidence
        uses: actions/upload-artifact@v4
        with:
          name: environment-building-planar-role-hard-normal-authority-rebind-001-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            evidence/environment_building_planar_role_hard_normal_authority_rebind_001/exact-head.txt
            evidence/environment_building_planar_role_hard_normal_authority_rebind_001/receiving-contract.json
            evidence/environment_building_planar_role_hard_normal_authority_rebind_001/hard-surface-authority-policy.json
            evidence/environment_building_planar_role_hard_normal_authority_rebind_001/environment-report.json
            evidence/environment_building_planar_role_hard_normal_authority_rebind_001/prior/environment-report.json
            evidence/environment_building_planar_role_hard_normal_authority_rebind_001/prior/runtime-report.json
            evidence/environment_building_planar_role_hard_normal_authority_rebind_001/prior/current/runtime.json
            evidence/environment_building_planar_role_hard_normal_authority_rebind_001/prior/current/rendered/*.png
          if-no-files-found: error
          retention-days: 30
