name: Environment current-world Object readability dressing evidence

on:
  push:
    branches: [studio/environment-weather-variant-object-convergence-001]
    paths:
      - "tools/environment_object_readability_dressing_current_world.py"
      - "environment-proof/atmosphere_current_world_object_readability_dressing_observe.gd"
      - "docs/ENVIRONMENT_OBJECT_READABILITY_DRESSING_CURRENT_WORLD_001.md"
      - ".github/workflows/environment-object-readability-dressing-current-world.yml"
  pull_request:
    paths:
      - "tools/environment_object_readability_dressing_current_world.py"
      - "environment-proof/atmosphere_current_world_object_readability_dressing_observe.gd"
      - "docs/ENVIRONMENT_OBJECT_READABILITY_DRESSING_CURRENT_WORLD_001.md"
      - ".github/workflows/environment-object-readability-dressing-current-world.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  exact-environment-object-readability-dressing:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact Environment lane head with ancestry
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bind exact current Environment parent ancestry
        run: |
          set -euo pipefail
          git rev-parse HEAD > exact-head.txt
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git cat-file -e 5b9b55ec67e31655f51d1acc67284816067e5be6^{commit}
          git merge-base --is-ancestor 5b9b55ec67e31655f51d1acc67284816067e5be6 HEAD
          python -m py_compile tools/environment_object_readability_dressing_current_world.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install image measurement dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy

      - name: Checkout exact inherited VFX source-width observer donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-map-design
          ref: 15a03b7c3ba3aaa7c0475ca1a3091c15581f559b
          path: .vfx-width-donor
          fetch-depth: 1

      - name: Download exact retained accepted Environment parent evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out=evidence/environment_object_readability_dressing_001
          mkdir -p "$out/parent"
          curl --fail --location --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/10454469590/zip" \
            --output "$out/parent.zip"
          echo "12d1a61e54913a47ca4f40383deac83c3be48dcbf66da1ea96aa76e0f19ad7ae  $out/parent.zip" | sha256sum --check --strict
          unzip -q "$out/parent.zip" -d "$out/parent"
          test "$(cat "$out/parent/exact-head.txt" | tr -d '\n\r')" = 5b9b55ec67e31655f51d1acc67284816067e5be6
          test -f "$out/parent/combined_current_world.json"
          test -f "$out/parent/target_host.json"
          test -d "$out/parent/rendered"

      - name: Verify exact retained parent acceptance surface
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('evidence/environment_object_readability_dressing_001/parent')
          p=json.loads((root/'combined_current_world.json').read_text())
          t=json.loads((root/'target_host.json').read_text())
          assert p['schema']=='axm.environment-current-world-building-infill-weather-width-composition/v0.1',p
          assert p['status']=='PASS_CURRENT_WORLD_BUILDING_INFILL_WEATHER_WIDTH_STRUCTURE' and all(p['checks'].values()),p
          assert p['receiving_head']=='5b9b55ec67e31655f51d1acc67284816067e5be6',p
          assert p['composition_digest']=='e6cea4098c4946dcfa80573d3e30d6d07a1e7c7b4c037b5962eeb3105ac8dfe1',p
          assert t['state']=='PASS_CURRENT_WORLD_BUILDING_INFILL_WEATHER_WIDTH_TARGET_HOST' and all(t['checks'].values()),t
          print('PASS_EXACT_ACCEPTED_ENVIRONMENT_PARENT')
          PY

      - name: Build exact Environment-owned Object receiver-footprint dressing
        run: |
          set -euo pipefail
          out=evidence/environment_object_readability_dressing_001
          mkdir -p environment-proof/generated
          python tools/environment_object_readability_dressing_current_world.py build \
            --environment "$out/parent/combined_current_world.json" \
            --receiving-head "$(cat exact-head.txt)" \
            --output "$out/combined_current_world.json"
          cp exact-head.txt "$out/exact-head.txt"
          cp "$out/combined_current_world.json" environment-proof/generated/current_world_object_readability_dressing.json
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('evidence/environment_object_readability_dressing_001')
          p=json.loads((root/'combined_current_world.json').read_text())
          assert p['status']=='PASS_CURRENT_WORLD_OBJECT_READABILITY_DRESSING_STRUCTURE' and all(p['checks'].values()),p
          assert p['receiving_head']==(root/'exact-head.txt').read_text().strip(),p
          assert len(p['states'])==17,p
          assert p['dressing']['source_object_transform_policy']=='UNCHANGED_NO_SCALE_NO_REPOSITION_NO_ROTATION_CHANGE',p
          assert p['measurements']['minimum_object_to_frame_clearance_m']>=0.06,p
          assert p['measurements']['minimum_readable_path_separation_m']>=1.0,p
          print(json.dumps({'status':p['status'],'composition_digest':p['composition_digest'],'measurements':p['measurements']},indent=2))
          PY

      - name: Exercise fail-closed Object receiver controls
        run: |
          python - <<'PY'
          import copy,json
          from pathlib import Path
          import tools.environment_object_readability_dressing_current_world as m
          parent=json.loads(Path('evidence/environment_object_readability_dressing_001/parent/combined_current_world.json').read_text())
          cases=[]
          bad=copy.deepcopy(parent); bad['receiving_head']='drifted'; cases.append(('parent head drift',bad))
          bad=copy.deepcopy(parent); bad['states'][0]['scene']['environment_object_replacement']['reserved_proxy_footprint_m'][0]-=0.1; cases.append(('reserved footprint drift',bad))
          bad=copy.deepcopy(parent); bad['states'][0]['scene']['additional_source_meshes']=[r for r in bad['states'][0]['scene']['additional_source_meshes'] if r.get('asset_id')!=m.OBJECT_ASSET]; cases.append(('missing Object source',bad))
          bad=copy.deepcopy(parent); bad['states'][0]['scene']['readable_path']['x_min']=-3.0; cases.append(('path clearance intrusion',bad))
          for label,p in cases:
              try:
                  m.build(p,'NEGATIVE')
              except ValueError:
                  print('PASS_NEGATIVE_CONTROL',label)
              else:
                  raise AssertionError(label)
          PY

      - name: Install exact inherited VFX observer into proof host
        run: |
          set -euo pipefail
          test "$(git -C .vfx-width-donor rev-parse HEAD)" = 15a03b7c3ba3aaa7c0475ca1a3091c15581f559b
          cp .vfx-width-donor/environment-proof/atmosphere_current_world_weather_width_observe.gd environment-proof/atmosphere_current_world_weather_width_observe.gd
          test -f environment-proof/atmosphere_current_world_building_infill_weather_width_observe.gd
          test -f environment-proof/atmosphere_current_world_object_readability_dressing_observe.gd

      - name: Download pinned Godot 4.7.2
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum --check --strict
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Install virtual display when needed
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Observe exact readability dressing in real Godot target host
        run: |
          set -euo pipefail
          out=evidence/environment_object_readability_dressing_001
          rm -f environment-proof/atmosphere-width-*.png environment-proof/atmosphere-current-world-weather-width-runtime.json
          set +e
          xvfb-run --auto-servernum --server-args="-screen 0 1200x800x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --path environment-proof \
            --script atmosphere_current_world_object_readability_dressing_observe.gd \
            2>&1 | tee "$out/godot.log"
          status=${PIPESTATUS[0]}
          set -e
          cp environment-proof/atmosphere-current-world-weather-width-runtime.json "$out/runtime.json" 2>/dev/null || true
          exit "$status"

      - name: Verify all-state localized target-host visual evidence
        run: |
          set -euo pipefail
          out=evidence/environment_object_readability_dressing_001
          python tools/environment_object_readability_dressing_current_world.py verify \
            --payload "$out/combined_current_world.json" \
            --receipt "$out/runtime.json" \
            --image-root environment-proof \
            --parent-frame-root "$out/parent/rendered" \
            --output "$out/target_host.json"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('evidence/environment_object_readability_dressing_001')
          t=json.loads((root/'target_host.json').read_text())
          assert t['state']=='PASS_CURRENT_WORLD_OBJECT_READABILITY_DRESSING_TARGET_HOST' and all(t['checks'].values()),t
          assert t['measured_width_count']==1224,t
          assert t['pair_counts']=={'elevated_oblique':34,'path_eye':34},t
          print(json.dumps({
              'state':t['state'],
              'maximum_projected_width_residual_px':t['maximum_projected_width_residual_px'],
              'pair_counts':t['pair_counts'],
              'changed_pixel_counts':t['changed_pixel_counts'],
              'runtime_counter_sets':t['runtime_counter_sets'],
          },indent=2))
          PY

      - name: Retain exact candidate frames
        if: always()
        run: |
          out=evidence/environment_object_readability_dressing_001
          mkdir -p "$out/rendered"
          cp environment-proof/atmosphere-width-*.png "$out/rendered/" 2>/dev/null || true
          rm -rf "$out/parent" "$out/parent.zip"

      - name: Upload retained Environment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: environment-object-readability-dressing-001-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/environment_object_readability_dressing_001
          if-no-files-found: error
          retention-days: 30
