name: Environment Building header segmentation bounded continuity review

on:
  push:
    branches: [studio/environment-weather-variant-object-convergence-001]
    paths:
      - "tools/review_environment_building_header_segmentation_continuity.py"
      - ".github/workflows/environment-building-header-segmentation-continuity-review.yml"
  pull_request:
    paths:
      - "tools/review_environment_building_header_segmentation_continuity.py"
      - ".github/workflows/environment-building-header-segmentation-continuity-review.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  exact-bounded-continuity-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout review head with exact implementation ancestry
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bind immutable implementation and review identities
        run: |
          set -euo pipefail
          git rev-parse HEAD > review-head.txt
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git cat-file -e dfd4e1d662ab7d6d9f1a5c8dd35b571418154f6e^{commit}
          git merge-base --is-ancestor dfd4e1d662ab7d6d9f1a5c8dd35b571418154f6e HEAD
          python -m py_compile tools/review_environment_building_header_segmentation_continuity.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install exact image-analysis dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy

      - name: Checkout exact Materials continuity precedent
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-building-design
          ref: 09a534d9d6d4cdaa1bab70cc2d01345b48d8fcc8
          path: .materials-donor
          fetch-depth: 1

      - name: Verify exact one-percent continuity precedent
        run: |
          set -euo pipefail
          test "$(git -C .materials-donor rev-parse HEAD)" = 09a534d9d6d4cdaa1bab70cc2d01345b48d8fcc8
          grep -F 'const MAX_CONTINUITY_CHANGED_FRACTION := 0.01' .materials-donor/lookdev-header-segmentation-proof/observe.gd
          grep -F 'PASS_TARGET_HOST_BUILDING_HEADER_SEGMENTATION_MATERIAL_CONTINUITY' .materials-donor/lookdev-header-segmentation-proof/observe.gd
          echo PASS_EXACT_MATERIALS_CONTINUITY_PRECEDENT

      - name: Download exact failed strict-gate artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out=evidence/environment_building_header_segmentation_continuity_review_001
          mkdir -p "$out/candidate"
          curl --fail --location --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/10460871165/zip" \
            --output "$out/candidate.zip"
          echo "add8d72e9dee4398ef844892138308022261d2d5a4f22a652f4dda9dbdb26d70  $out/candidate.zip" | sha256sum --check --strict
          unzip -q "$out/candidate.zip" -d "$out/candidate"
          test "$(cat "$out/candidate/exact-head.txt" | tr -d '\n\r')" = dfd4e1d662ab7d6d9f1a5c8dd35b571418154f6e
          test -f "$out/candidate/combined_current_world.json"
          test -f "$out/candidate/runtime.json"
          test -d "$out/candidate/rendered"

      - name: Download exact Object-dressed Environment parent artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out=evidence/environment_building_header_segmentation_continuity_review_001
          mkdir -p "$out/parent"
          curl --fail --location --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/10458660039/zip" \
            --output "$out/parent.zip"
          echo "af49a1c6a3ce319826be5dc02c6b42d4c3b131a8a76f98c19a4939299e44372e  $out/parent.zip" | sha256sum --check --strict
          unzip -q "$out/parent.zip" -d "$out/parent"
          test "$(cat "$out/parent/exact-head.txt" | tr -d '\n\r')" = a29aa1e3d2260e8eb5ab2ac78a95d35ce131214c
          test -f "$out/parent/combined_current_world.json"
          test -f "$out/parent/target_host.json"
          test -d "$out/parent/rendered"

      - name: Review exact retained real-scene frames without rewriting strict failure
        run: |
          set -euo pipefail
          out=evidence/environment_building_header_segmentation_continuity_review_001
          python tools/review_environment_building_header_segmentation_continuity.py \
            --candidate-root "$out/candidate" \
            --parent-root "$out/parent" \
            --review-head "$(cat review-head.txt)" \
            --output "$out/bounded_continuity_review.json" \
            --montage "$out/review_montage.png"
          cp review-head.txt "$out/review-head.txt"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('evidence/environment_building_header_segmentation_continuity_review_001')
          report=json.loads((root/'bounded_continuity_review.json').read_text())
          assert report['state']=='PASS_CURRENT_WORLD_BUILDING_HEADER_SEGMENTATION_BOUNDED_CONTINUITY',report
          assert all(report['checks'].values()),report
          assert report['exact_implementation_head']=='dfd4e1d662ab7d6d9f1a5c8dd35b571418154f6e',report
          assert report['strict_gate_history']['result']=='FAIL_STRICT_NO_RGB_DELTA_ABOVE_ONE_LSB',report
          assert report['visual_delta']['path_eye']['changed_fraction_gt_1_lsb_max'] < 0.01,report
          assert report['visual_delta']['elevated_oblique']['changed_fraction_gt_1_lsb_max'] < 0.01,report
          print(json.dumps({
              'state':report['state'],
              'visual_delta':report['visual_delta'],
              'maximum_projected_weather_width_residual_px':report['maximum_projected_weather_width_residual_px'],
              'runtime_counter_delta_vs_parent':report['runtime_counter_delta_vs_parent'],
          },indent=2,sort_keys=True))
          PY

      - name: Retain bounded review evidence only
        if: always()
        run: |
          out=evidence/environment_building_header_segmentation_continuity_review_001
          rm -rf "$out/candidate" "$out/parent" "$out/candidate.zip" "$out/parent.zip"

      - name: Upload retained bounded continuity review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: environment-building-header-segmentation-continuity-review-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/environment_building_header_segmentation_continuity_review_001
          if-no-files-found: error
          retention-days: 30
