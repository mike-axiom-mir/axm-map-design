name: Environment Building infill + Weather source-width composition evidence

on:
  push:
    branches: [studio/environment-weather-variant-object-convergence-001]
    paths:
      - "tools/environment_building_infill_weather_width_current_world.py"
      - "environment-proof/atmosphere_current_world_building_infill_weather_width_observe.gd"
      - "docs/ENVIRONMENT_BUILDING_INFILL_WEATHER_SOURCE_WIDTH_COMPOSITION_001.md"
      - ".github/workflows/environment-building-infill-weather-width-composition.yml"
  pull_request:
    paths:
      - "tools/environment_building_infill_weather_width_current_world.py"
      - "environment-proof/atmosphere_current_world_building_infill_weather_width_observe.gd"
      - "docs/ENVIRONMENT_BUILDING_INFILL_WEATHER_SOURCE_WIDTH_COMPOSITION_001.md"
      - ".github/workflows/environment-building-infill-weather-width-composition.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  exact-environment-building-infill-weather-width:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact Environment lane head with ancestry
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bind exact Environment parent ancestry
        run: |
          set -euo pipefail
          git rev-parse HEAD > exact-head.txt
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git cat-file -e 0d8b2279ecbba47b9696a951db9513883fbef6c5^{commit}
          git merge-base --is-ancestor 0d8b2279ecbba47b9696a951db9513883fbef6c5 HEAD
          python -m py_compile tools/environment_building_infill_weather_width_current_world.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install image measurement dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy

      - name: Checkout exact VFX source-width observer donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-map-design
          ref: 15a03b7c3ba3aaa7c0475ca1a3091c15581f559b
          path: .vfx-width-donor
          fetch-depth: 1

      - name: Checkout exact Building Materials candidate donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-building-design
          ref: 225cf82a61ec1512553fda2785ca101a54a6bd30
          path: .building-material-donor
          fetch-depth: 1

      - name: Verify exact source files and profile identity
        run: |
          set -euo pipefail
          test "$(git -C .vfx-width-donor rev-parse HEAD)" = 15a03b7c3ba3aaa7c0475ca1a3091c15581f559b
          test "$(git -C .building-material-donor rev-parse HEAD)" = 225cf82a61ec1512553fda2785ca101a54a6bd30
          test -f .vfx-width-donor/environment-proof/atmosphere_current_world_weather_width_observe.gd
          echo "0c4834bf0fc9c0b7aa1a053f35f307b64596e13f305287ca3018b6182b2f6fe9  .building-material-donor/lookdev/building_material_profile_001.json" | sha256sum --check --strict
          python - <<'PY'
          import json
          p=json.load(open('.building-material-donor/lookdev/building_material_profile_001.json'))
          assert p['candidate']['infill_coating']=={'albedo':'#59666DFF','metallic':0.16,'roughness':0.68},p['candidate']['infill_coating']
          assert p['provenance']['predecessor_material_profile_sha256']=='e8dd0c33b9b2aea108194af57a8fe8de39c7e67bb86109af6dbf3895f22c010b',p
          print('PASS_EXACT_BUILDING_INFILL_PROFILE_IDENTITY')
          PY

      - name: Download exact retained Environment parent evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out=evidence/environment_building_infill_weather_width_001
          mkdir -p "$out/environment-parent"
          curl --fail --location --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/10452505109/zip" \
            --output "$out/environment-parent.zip"
          echo "4ffc52fc421d38a92829d3bf663ab5a48dfc144d16f31028f742ce19855512f4  $out/environment-parent.zip" | sha256sum --check --strict
          unzip -q "$out/environment-parent.zip" -d "$out/environment-parent"
          test "$(cat "$out/environment-parent/exact-head.txt" | tr -d '\n\r')" = 0d8b2279ecbba47b9696a951db9513883fbef6c5
          test -f "$out/environment-parent/combined_current_world.json"
          test -f "$out/environment-parent/target_host.json"
          test -d "$out/environment-parent/rendered"

      - name: Download exact retained Building Materials donor evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out=evidence/environment_building_infill_weather_width_001
          mkdir -p "$out/material-donor"
          curl --fail --location --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/mike-axiom-mir/axm-building-design/actions/artifacts/10451955371/zip" \
            --output "$out/material-donor.zip"
          echo "a45ca2e0359d8b06a4a70ca82616d88fa779fe7df7fe9a56d9ba24f2eb9adda1  $out/material-donor.zip" | sha256sum --check --strict
          unzip -q "$out/material-donor.zip" -d "$out/material-donor"
          test "$(cat "$out/material-donor/exact-head.txt" | tr -d '\n\r')" = 225cf82a61ec1512553fda2785ca101a54a6bd30
          test -f "$out/material-donor/evidence/building_current_world_infill_repair_001/candidate_current_world.json"
          test -f "$out/material-donor/evidence/building_current_world_infill_repair_001/target_host.json"

      - name: Verify retained parents are exact PASS evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('evidence/environment_building_infill_weather_width_001')
          env=json.loads((root/'environment-parent/combined_current_world.json').read_text())
          env_target=json.loads((root/'environment-parent/target_host.json').read_text())
          mat=json.loads((root/'material-donor/evidence/building_current_world_infill_repair_001/candidate_current_world.json').read_text())
          mat_target=json.loads((root/'material-donor/evidence/building_current_world_infill_repair_001/target_host.json').read_text())
          assert env['schema']=='axm.environment-current-world-building-successor-weather-width-composition/v0.1',env
          assert env['status']=='PASS_CURRENT_WORLD_BUILDING_SUCCESSOR_WEATHER_WIDTH_STRUCTURE' and all(env['checks'].values()),env
          assert env['receiving_head']=='0d8b2279ecbba47b9696a951db9513883fbef6c5',env
          assert env['composition_digest']=='132e877c8016d833f43d7a4cfe303ad2595913c757b85dd212192eafafed1973',env
          assert env_target['state']=='PASS_CURRENT_WORLD_BUILDING_SUCCESSOR_WEATHER_WIDTH_TARGET_HOST' and all(env_target['checks'].values()),env_target
          assert mat['schema']=='axm.building-material-current-world-infill-repair/v0.1',mat
          assert mat['status']=='PASS_BUILDING_CURRENT_WORLD_INFILL_REPAIR_STRUCTURE' and all(mat['checks'].values()),mat
          assert mat['receiving_head']=='225cf82a61ec1512553fda2785ca101a54a6bd30',mat
          assert mat['material_profile_sha256']=='0c4834bf0fc9c0b7aa1a053f35f307b64596e13f305287ca3018b6182b2f6fe9',mat
          assert mat_target['status']=='PASS_BUILDING_CURRENT_WORLD_INFILL_REPAIR_TARGET_HOST_DIAGNOSTICS' and all(mat_target['checks'].values()),mat_target
          print('PASS_EXACT_RETAINED_PARENTS')
          PY

      - name: Compose exact Building infill successor over exact Weather-width current world
        run: |
          set -euo pipefail
          out=evidence/environment_building_infill_weather_width_001
          mkdir -p environment-proof/generated
          python tools/environment_building_infill_weather_width_current_world.py build \
            --environment "$out/environment-parent/combined_current_world.json" \
            --material "$out/material-donor/evidence/building_current_world_infill_repair_001/candidate_current_world.json" \
            --receiving-head "$(cat exact-head.txt)" \
            --output "$out/combined_current_world.json"
          cp exact-head.txt "$out/exact-head.txt"
          cp "$out/combined_current_world.json" environment-proof/generated/current_world_building_infill_weather_width.json
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('evidence/environment_building_infill_weather_width_001')
          p=json.loads((root/'combined_current_world.json').read_text())
          assert p['status']=='PASS_CURRENT_WORLD_BUILDING_INFILL_WEATHER_WIDTH_STRUCTURE' and all(p['checks'].values()),p
          assert p['receiving_head']==(root/'exact-head.txt').read_text().strip(),p
          assert len(p['states'])==17 and p['source_width_summary']['count']==36,p
          print(json.dumps({'status':p['status'],'composition_digest':p['composition_digest'],'checks':p['checks']},indent=2))
          PY

      - name: Exercise fail-closed cross-parent controls
        run: |
          python - <<'PY'
          import copy, json
          from pathlib import Path
          import tools.environment_building_infill_weather_width_current_world as m
          root=Path('evidence/environment_building_infill_weather_width_001')
          env=json.loads((root/'environment-parent/combined_current_world.json').read_text())
          mat=json.loads((root/'material-donor/evidence/building_current_world_infill_repair_001/candidate_current_world.json').read_text())
          cases=[]
          bad=copy.deepcopy(env); bad['receiving_head']='drifted'; cases.append(('environment head drift',bad,mat))
          bad=copy.deepcopy(env); bad['states'][0]['scene']['weather_lines'][0]['source_width_px']+=0.1; bad['states'][0]['scene']['scene_digest']=m.scene_digest(bad['states'][0]['scene']); cases.append(('weather width drift',bad,mat))
          bad=copy.deepcopy(mat); bad['receiving_head']='drifted'; cases.append(('material head drift',env,bad))
          bad=copy.deepcopy(mat); bad['candidate_infill']['roughness']=0.5; cases.append(('material candidate drift',env,bad))
          for label,e,mv in cases:
              try:
                  m.build(e,mv,'NEGATIVE')
              except ValueError:
                  print('PASS_NEGATIVE_CONTROL',label)
              else:
                  raise AssertionError(label)
          PY

      - name: Install exact VFX observer implementation into receiving proof host
        run: |
          set -euo pipefail
          cp .vfx-width-donor/environment-proof/atmosphere_current_world_weather_width_observe.gd environment-proof/atmosphere_current_world_weather_width_observe.gd
          test -f environment-proof/atmosphere_current_world_building_infill_weather_width_observe.gd

      - name: Download pinned Godot 4.7.2
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum --check --strict
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Install virtual display when needed
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Observe exact combined successor in real Godot target host
        run: |
          set -euo pipefail
          out=evidence/environment_building_infill_weather_width_001
          rm -f environment-proof/atmosphere-width-*.png environment-proof/atmosphere-current-world-weather-width-runtime.json
          set +e
          xvfb-run --auto-servernum --server-args="-screen 0 1200x800x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --path environment-proof \
            --script atmosphere_current_world_building_infill_weather_width_observe.gd \
            2>&1 | tee "$out/godot.log"
          status=${PIPESTATUS[0]}
          set -e
          cp environment-proof/atmosphere-current-world-weather-width-runtime.json "$out/runtime.json" 2>/dev/null || true
          exit "$status"

      - name: Verify exact combined target-host evidence and predecessor attribution
        run: |
          set -euo pipefail
          out=evidence/environment_building_infill_weather_width_001
          python tools/environment_building_infill_weather_width_current_world.py verify \
            --payload "$out/combined_current_world.json" \
            --receipt "$out/runtime.json" \
            --image-root environment-proof \
            --parent-frame-root "$out/environment-parent/rendered" \
            --output "$out/target_host.json"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('evidence/environment_building_infill_weather_width_001')
          t=json.loads((root/'target_host.json').read_text())
          assert t['state']=='PASS_CURRENT_WORLD_BUILDING_INFILL_WEATHER_WIDTH_TARGET_HOST' and all(t['checks'].values()),t
          print(json.dumps({
              'state':t['state'],
              'maximum_projected_width_residual_px':t['maximum_projected_width_residual_px'],
              'measured_width_count':t['measured_width_count'],
              'material_delta_pair_counts':t['material_delta_pair_counts'],
              'material_changed_pixel_counts':t['material_changed_pixel_counts'],
              'material_bbox_unique':t['material_bbox_unique'],
              'material_luma_diagnostics':t['material_luma_diagnostics'],
              'runtime_counter_sets':t['runtime_counter_sets'],
          },indent=2))
          PY

      - name: Retain exact combined frames
        if: always()
        run: |
          out=evidence/environment_building_infill_weather_width_001
          mkdir -p "$out/rendered"
          cp environment-proof/atmosphere-width-*.png "$out/rendered/" 2>/dev/null || true
          cp environment-proof/atmosphere-current-world-weather-width-runtime.json "$out/runtime.json" 2>/dev/null || true

      - name: Upload exact Environment combined evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: environment-building-infill-weather-width-001-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            evidence/environment_building_infill_weather_width_001/exact-head.txt
            evidence/environment_building_infill_weather_width_001/environment-parent.zip
            evidence/environment_building_infill_weather_width_001/material-donor.zip
            evidence/environment_building_infill_weather_width_001/combined_current_world.json
            evidence/environment_building_infill_weather_width_001/godot.log
            evidence/environment_building_infill_weather_width_001/runtime.json
            evidence/environment_building_infill_weather_width_001/target_host.json
            evidence/environment_building_infill_weather_width_001/rendered/*.png
          if-no-files-found: warn
          retention-days: 30
