name: Runtime footprint indexed-surface budget evidence

on:
  push:
    branches: [studio/runtime-footprint-index-budget-001]
    paths:
      - "environment-proof/atmosphere_current_world_footprint_index_budget_observe.gd"
      - "tools/runtime_footprint_index_budget.py"
      - "docs/RUNTIME_FOOTPRINT_INDEX_BUDGET_001.md"
      - ".github/workflows/runtime-footprint-index-budget.yml"
  pull_request:
    paths:
      - "environment-proof/atmosphere_current_world_footprint_index_budget_observe.gd"
      - "tools/runtime_footprint_index_budget.py"
      - "docs/RUNTIME_FOOTPRINT_INDEX_BUDGET_001.md"
      - ".github/workflows/runtime-footprint-index-budget.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  exact-footprint-index-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact Runtime lane head with ancestry
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bind exact current Environment parent
        run: |
          set -euo pipefail
          git rev-parse HEAD > exact-head.txt
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git cat-file -e b9d9ed28e9a826c4698014db5f91c59aba9dddfc^{commit}
          git merge-base --is-ancestor b9d9ed28e9a826c4698014db5f91c59aba9dddfc HEAD
          python -m py_compile tools/runtime_footprint_index_budget.py
          grep -F 'st.index()' environment-proof/atmosphere_current_world_footprint_index_budget_observe.gd

      - name: Install exact image-analysis dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Download exact indexed-Object visible-cue Environment evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out=evidence/runtime_footprint_index_budget_001
          mkdir -p "$out/environment-parent"
          curl --fail --location --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/10470116628/zip" \
            --output "$out/environment-parent.zip"
          echo "89e8accc714c8dc5900eaa835aeb3fd5b3b528dbd3f28e241c9c4b96832d714c  $out/environment-parent.zip" | sha256sum --check --strict
          unzip -q "$out/environment-parent.zip" -d "$out/environment-parent"
          test "$(cat "$out/environment-parent/exact-head.txt" | tr -d '\n\r')" = b9d9ed28e9a826c4698014db5f91c59aba9dddfc
          test -f "$out/environment-parent/report.json"
          python - <<'PY'
          import json
          p=json.load(open('evidence/runtime_footprint_index_budget_001/environment-parent/report.json'))
          assert p['state']=='PASS_CURRENT_WORLD_INDEXED_OBJECT_WITH_FOOTPRINT_COMPOSITION',p
          assert all(p['checks'].values()),p
          assert p['byte_identical_frames']==68,p
          print('PASS_EXACT_INDEXED_OBJECT_VISIBLE_CUE_PARENT')
          PY

      - name: Download exact Object-material world payload authority
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out=evidence/runtime_footprint_index_budget_001
          mkdir -p "$out/material-world" environment-proof/generated
          curl --fail --location --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/10466065113/zip" \
            --output "$out/material-world.zip"
          echo "87dd366302e94b5a6f8241e110e9629c2d81a0d7321197b14a52b860642fd519  $out/material-world.zip" | sha256sum --check --strict
          unzip -q "$out/material-world.zip" -d "$out/material-world"
          test "$(cat "$out/material-world/exact-head.txt" | tr -d '\n\r')" = 6575cc38db9f0f62b14a82b352d8582edf89856d
          test -f "$out/material-world/combined_current_world.json"
          cp "$out/material-world/combined_current_world.json" environment-proof/generated/current_world_object_material_family.json

      - name: Install exact inherited Weather-width observer into proof host
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-map-design
          ref: 15a03b7c3ba3aaa7c0475ca1a3091c15581f559b
          path: .vfx-width-donor
          fetch-depth: 1

      - name: Verify inherited current-world chain
        run: |
          set -euo pipefail
          test "$(git -C .vfx-width-donor rev-parse HEAD)" = 15a03b7c3ba3aaa7c0475ca1a3091c15581f559b
          cp .vfx-width-donor/environment-proof/atmosphere_current_world_weather_width_observe.gd environment-proof/atmosphere_current_world_weather_width_observe.gd
          test -f environment-proof/atmosphere_current_world_building_header_segmentation_observe.gd
          test -f environment-proof/atmosphere_current_world_nature_material_family_observe.gd
          test -f environment-proof/atmosphere_current_world_object_material_family_observe.gd
          test -f environment-proof/atmosphere_current_world_object_footprint_material_review.gd
          test -f environment-proof/atmosphere_current_world_object_indexed_footprint_observe.gd
          test -f environment-proof/atmosphere_current_world_footprint_index_budget_observe.gd

      - name: Download pinned Godot 4.7.2
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum --check --strict
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Install virtual display when needed
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y xvfb; fi

      - name: Observe exact unindexed footprint control
        env:
          AXM_OBJECT_FOOTPRINT_REVIEW_MODE: CANDIDATE_VISIBLE
          AXM_RUNTIME_FOOTPRINT_INDEX_MODE: UNINDEXED_FOOTPRINT_CONTROL
        run: |
          set -euo pipefail
          out=evidence/runtime_footprint_index_budget_001/control
          mkdir -p "$out/rendered"
          rm -f environment-proof/atmosphere-width-*.png environment-proof/atmosphere-current-world-weather-width-runtime.json
          set +e
          xvfb-run --auto-servernum --server-args="-screen 0 1200x800x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 --rendering-method gl_compatibility \
            --path environment-proof --script atmosphere_current_world_footprint_index_budget_observe.gd \
            2>&1 | tee "$out/godot.log"
          status=${PIPESTATUS[0]}; set -e
          cp environment-proof/atmosphere-current-world-weather-width-runtime.json "$out/runtime.json" 2>/dev/null || true
          cp environment-proof/atmosphere-width-*.png "$out/rendered/" 2>/dev/null || true
          exit "$status"

      - name: Observe exact indexed footprint candidate
        env:
          AXM_OBJECT_FOOTPRINT_REVIEW_MODE: CANDIDATE_VISIBLE
          AXM_RUNTIME_FOOTPRINT_INDEX_MODE: INDEXED_FOOTPRINT_CANDIDATE
        run: |
          set -euo pipefail
          out=evidence/runtime_footprint_index_budget_001/candidate
          mkdir -p "$out/rendered"
          rm -f environment-proof/atmosphere-width-*.png environment-proof/atmosphere-current-world-weather-width-runtime.json
          set +e
          xvfb-run --auto-servernum --server-args="-screen 0 1200x800x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 --rendering-method gl_compatibility \
            --path environment-proof --script atmosphere_current_world_footprint_index_budget_observe.gd \
            2>&1 | tee "$out/godot.log"
          status=${PIPESTATUS[0]}; set -e
          cp environment-proof/atmosphere-current-world-weather-width-runtime.json "$out/runtime.json" 2>/dev/null || true
          cp environment-proof/atmosphere-width-*.png "$out/rendered/" 2>/dev/null || true
          exit "$status"

      - name: Verify exact footprint representation A/B
        run: |
          set -euo pipefail
          out=evidence/runtime_footprint_index_budget_001
          python tools/runtime_footprint_index_budget.py \
            --control-receipt "$out/control/runtime.json" \
            --candidate-receipt "$out/candidate/runtime.json" \
            --control-root "$out/control/rendered" \
            --candidate-root "$out/candidate/rendered" \
            --output "$out/report.json"
          cp exact-head.txt "$out/exact-head.txt"
          python - <<'PY'
          import json
          p=json.load(open('evidence/runtime_footprint_index_budget_001/report.json'))
          assert p['state']=='PASS_FOOTPRINT_POST_NORMAL_INDEXED_PAYLOAD_REDUCTION_WITH_BOUNDED_ONE_LSB_EDGE_DELTA',p
          assert p['visual_delta']['maximum_changed_pixels_per_frame'] <= 1,p
          assert p['visual_delta']['maximum_channel_delta_lsb'] <= 1,p
          assert p['visual_delta']['all_changed_pixels_within_projected_cue_bounds'],p
          print(json.dumps({
              'state':p['state'],
              'control_vertices':p['control_mesh']['total_vertices'],
              'candidate_vertices':p['candidate_mesh']['total_vertices'],
              'candidate_indices':p['candidate_mesh']['total_indices'],
              'modeled_payload_bytes_saved':p['modeled_payload_bytes_saved'],
              'runtime_counter_deltas':p['runtime_counter_deltas'],
              'visual_delta':{
                  'byte_identical_frames':p['visual_delta']['byte_identical_frames'],
                  'frames_with_any_rgb_delta':p['visual_delta']['frames_with_any_rgb_delta'],
                  'maximum_changed_pixels_per_frame':p['visual_delta']['maximum_changed_pixels_per_frame'],
                  'maximum_channel_delta_lsb':p['visual_delta']['maximum_channel_delta_lsb'],
                  'unique_changed_coordinates':p['visual_delta']['unique_changed_coordinates'],
              },
              'visual_tradeoff':p['visual_tradeoff'],
          },indent=2,sort_keys=True))
          PY

      - name: Exercise fail-closed footprint reduction control
        run: |
          set -euo pipefail
          out=evidence/runtime_footprint_index_budget_001
          cp "$out/candidate/runtime.json" "$out/candidate/runtime-mutated.json"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('evidence/runtime_footprint_index_budget_001/candidate/runtime-mutated.json')
          data=json.loads(p.read_text())
          row=next(x for x in data['static_source_meshes'] if x.get('asset_id')=='environment:dressing:west-object-service-footprint-frame-001')
          d=row['runtime_footprint_surface_indexing']
          d['after']['total_vertices']=d['before']['total_vertices']
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
          if python tools/runtime_footprint_index_budget.py \
            --control-receipt "$out/control/runtime.json" \
            --candidate-receipt "$out/candidate/runtime-mutated.json" \
            --control-root "$out/control/rendered" \
            --candidate-root "$out/candidate/rendered" \
            --output "$out/should-not-pass.json"; then
            echo 'negative control unexpectedly passed' >&2
            exit 1
          fi
          echo PASS_FAIL_CLOSED_FOOTPRINT_REDUCTION_CONTROL
          rm -f "$out/should-not-pass.json"

      - name: Remove downloaded evidence duplicates before upload
        if: always()
        run: |
          rm -rf evidence/runtime_footprint_index_budget_001/environment-parent
          rm -f evidence/runtime_footprint_index_budget_001/environment-parent.zip
          rm -rf evidence/runtime_footprint_index_budget_001/material-world
          rm -f evidence/runtime_footprint_index_budget_001/material-world.zip

      - name: Upload retained Runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-footprint-index-budget-001-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/runtime_footprint_index_budget_001
          if-no-files-found: error
          retention-days: 30
