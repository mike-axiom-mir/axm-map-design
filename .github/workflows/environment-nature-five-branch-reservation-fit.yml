name: Environment Nature five-branch reservation fit

on:
  push:
    branches: [studio/environment-nature-five-branch-reservation-fit-001]
    paths:
      - "tools/environment_nature_five_branch_reservation_fit.py"
      - "contracts/environment_nature_five_branch_reservation_fit.json"
      - "docs/ENVIRONMENT_NATURE_FIVE_BRANCH_RESERVATION_FIT_001.md"
      - ".github/workflows/environment-nature-five-branch-reservation-fit.yml"
  pull_request:
    paths:
      - "tools/environment_nature_five_branch_reservation_fit.py"
      - "contracts/environment_nature_five_branch_reservation_fit.json"
      - "docs/ENVIRONMENT_NATURE_FIVE_BRANCH_RESERVATION_FIT_001.md"
      - ".github/workflows/environment-nature-five-branch-reservation-fit.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  reservation-fit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact Environment head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate bounded Environment sources
        run: |
          set -euo pipefail
          git rev-parse HEAD > exact-head.txt
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git cat-file -e 4826db5d3a595bbeefdfd58d5541b2d78247e290^{commit}
          git merge-base --is-ancestor 4826db5d3a595bbeefdfd58d5541b2d78247e290 HEAD
          python -m pip install --disable-pip-version-check --no-input numpy trimesh
          python -m py_compile tools/environment_nature_five_branch_reservation_fit.py
          python -m json.tool contracts/environment_nature_five_branch_reservation_fit.json >/dev/null

      - name: Download exact current-world and Technical Art evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root=evidence/environment_nature_five_branch_reservation_fit_001
          mkdir -p "$root/world" "$root/parent" "$root/ta"

          curl --fail --location --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/mike-axiom-mir/axm-map-design/actions/artifacts/10509037278/zip" -o "$root/world.zip"
          echo "8f2f8aa4bb11e2f868a6ce36dd381933ba1ea6c59be7b82ed00d1dfe5402ee97  $root/world.zip" | sha256sum --check --strict
          unzip -q "$root/world.zip" -d "$root/world"

          curl --fail --location --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/mike-axiom-mir/axm-map-design/actions/artifacts/10532604901/zip" -o "$root/parent.zip"
          echo "18d80b8783e71a9588cf86bb383eaf8ec8e803f35002a363557c2fda8fb427f3  $root/parent.zip" | sha256sum --check --strict
          unzip -q "$root/parent.zip" -d "$root/parent"
          test "$(cat "$root/parent/exact-head.txt")" = "4826db5d3a595bbeefdfd58d5541b2d78247e290"

          curl --fail --location --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/mike-axiom-mir/axm-nature-design/actions/artifacts/10534795193/zip" -o "$root/ta.zip"
          echo "1206a7d92cacab1eb77de14728e09785010069898bcb01766f64faac0fae21cc  $root/ta.zip" | sha256sum --check --strict
          unzip -q "$root/ta.zip" -d "$root/ta"
          test "$(cat "$root/ta/exact-technical-art-head.txt")" = "b83c7d71759213d96c57874282e60705402540f5"
          test "$(cat "$root/ta/exact-animation-head.txt")" = "b0771b3319b783103c8e4677d062c00419df7559"
          test "$(cat "$root/ta/exact-rigging-head.txt")" = "898529f602893c8f6be179bd3e9b6821fc099904"
          test "$(cat "$root/ta/exact-uc-head.txt")" = "5c772b65eeba75abd0eb7a6c9c471b2d9975019d"

      - name: Verify all exact owner samples fit current Environment reservation
        run: |
          set -euo pipefail
          root=evidence/environment_nature_five_branch_reservation_fit_001
          python tools/environment_nature_five_branch_reservation_fit.py \
            --contract contracts/environment_nature_five_branch_reservation_fit.json \
            --combined-world "$root/world/combined_current_world.json" \
            --ta-root "$root/ta" \
            --parent-rebind-report "$root/parent/evidence/environment_building_utility_panel_production_successor_current_world_rebind_001/rebind-report.json" \
            --output "$root/report.json" | tee "$root/verify.log"

      - name: Fail closed when the Environment reservation is actually too small
        run: |
          set -euo pipefail
          root=evidence/environment_nature_five_branch_reservation_fit_001
          if python tools/environment_nature_five_branch_reservation_fit.py \
            --contract contracts/environment_nature_five_branch_reservation_fit.json \
            --combined-world "$root/world/combined_current_world.json" \
            --ta-root "$root/ta" \
            --parent-rebind-report "$root/parent/evidence/environment_building_utility_panel_production_successor_current_world_rebind_001/rebind-report.json" \
            --reservation-rear-contraction-m 0.20 \
            --output "$root/negative-report.json" >"$root/negative.log" 2>&1; then
              echo "negative control unexpectedly passed" >&2
              exit 1
          fi
          grep -q "escapes current east-rear Environment reservation" "$root/negative.log"

      - name: Retain Environment reservation-fit evidence
        uses: actions/upload-artifact@v4
        with:
          name: environment-nature-five-branch-reservation-fit-${{ github.sha }}
          path: |
            exact-head.txt
            contracts/environment_nature_five_branch_reservation_fit.json
            docs/ENVIRONMENT_NATURE_FIVE_BRANCH_RESERVATION_FIT_001.md
            evidence/environment_nature_five_branch_reservation_fit_001/report.json
            evidence/environment_nature_five_branch_reservation_fit_001/verify.log
            evidence/environment_nature_five_branch_reservation_fit_001/negative.log
          if-no-files-found: error
          retention-days: 90
