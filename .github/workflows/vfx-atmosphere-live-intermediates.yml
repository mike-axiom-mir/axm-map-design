name: VFX dense synchronized atmosphere live evidence

on:
  push:
    branches: [studio/vfx-atmosphere-live-intermediates-001]
    paths:
      - "tools/environment_atmosphere_live_intermediates.py"
      - "environment-proof/atmosphere_live_intermediates_observe.gd"
      - "docs/ENVIRONMENT_ATMOSPHERE_LIVE_INTERMEDIATES_001.md"
      - ".github/workflows/vfx-atmosphere-live-intermediates.yml"
  pull_request:
    paths:
      - "tools/environment_atmosphere_live_intermediates.py"
      - "environment-proof/atmosphere_live_intermediates_observe.gd"
      - "docs/ENVIRONMENT_ATMOSPHERE_LIVE_INTERMEDIATES_001.md"
      - ".github/workflows/vfx-atmosphere-live-intermediates.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-dense-atmosphere-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact VFX head with ancestry
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pin exact Runtime and synchronized VFX ancestry
        run: |
          set -euo pipefail
          git rev-parse HEAD > exact-head.txt
          git cat-file -e f0c72b9dd4688bdb01ac40aa33f469afffd7ec0a^{commit}
          git merge-base --is-ancestor f0c72b9dd4688bdb01ac40aa33f469afffd7ec0a HEAD || {
            echo "Dense VFX proof must remain stacked on exact Runtime head f0c72b9dd4688bdb01ac40aa33f469afffd7ec0a." >&2
            exit 1
          }
          git cat-file -e d476cf7c11de74c53397cb21e6f40f90a51c0356^{commit}
          git merge-base --is-ancestor d476cf7c11de74c53397cb21e6f40f90a51c0356 HEAD || {
            echo "Dense VFX proof must retain exact synchronized VFX ancestry d476cf7c11de74c53397cb21e6f40f90a51c0356." >&2
            exit 1
          }

      - name: Checkout exact accepted Nature visual response
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-nature-design
          ref: cee14f5b3feea78b0adcd044bad2ea3c97657fc6
          path: .nature

      - name: Checkout exact Weather source
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-weather-design
          ref: ca2eaba519e8449835b0ea6ef944b7080c3caa6a
          path: .weather

      - name: Verify dependency heads and Python contract
        run: |
          set -euo pipefail
          test "$(git -C .nature rev-parse HEAD)" = "cee14f5b3feea78b0adcd044bad2ea3c97657fc6"
          test "$(git -C .weather rev-parse HEAD)" = "ca2eaba519e8449835b0ea6ef944b7080c3caa6a"
          python -m py_compile \
            tools/environment_atmosphere_sync.py \
            tools/environment_atmosphere_live_intermediates.py

      - name: Build exact 17-state dense source sequence
        env:
          AXM_RECEIVING_HEAD: d476cf7c11de74c53397cb21e6f40f90a51c0356
        run: |
          set -euo pipefail
          out=evidence/environment_atmosphere_live_intermediates_001
          mkdir -p "$out"
          python tools/environment_atmosphere_live_intermediates.py build \
            --nature-root .nature \
            --weather-root .weather \
            --output "$out/atmosphere_live_intermediates.json"
          HEAD_SHA="$(cat exact-head.txt)" python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('evidence/environment_atmosphere_live_intermediates_001/atmosphere_live_intermediates.json')
          data=json.loads(p.read_text())
          assert data['status']=='PASS_DENSE_INTERMEDIATE_SOURCE_SEQUENCE', data
          assert data['stacked_on_runtime_head']=='f0c72b9dd4688bdb01ac40aa33f469afffd7ec0a', data
          assert data['stacked_on_sync_head']=='d476cf7c11de74c53397cb21e6f40f90a51c0356', data
          assert len(data['states'])==17 and data['measurements']['new_half_step_count']==8, data
          assert all(data['checks'].values()), data
          # The source generator deliberately rebuilds the exact PR #12 prerequisite under
          # its historical tested identity. Bind only the outer evidence receipt to the
          # current exact head after the source sequence has passed; no source state/digest changes.
          data['receiving_head']=os.environ['HEAD_SHA']
          p.write_text(json.dumps(data, indent=2, sort_keys=True)+'\n')
          print(json.dumps({'status':data['status'],'receiving_head':data['receiving_head'],'sequence_digest':data['sequence_digest'],'measurements':data['measurements']}, indent=2))
          PY
          mkdir -p environment-proof/generated
          cp "$out/atmosphere_live_intermediates.json" environment-proof/generated/atmosphere_live_intermediates.json

      - name: Download pinned Godot 4.7.2
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum --check --strict
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Install virtual display when needed
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Run all 17 dense states in one proof-host process
        run: |
          set -euo pipefail
          xvfb-run --auto-servernum --server-args="-screen 0 1200x800x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --path environment-proof \
            --script atmosphere_live_intermediates_observe.gd

      - name: Verify exact live target-host path
        run: |
          set -euo pipefail
          out=evidence/environment_atmosphere_live_intermediates_001
          cp environment-proof/atmosphere-live-intermediates-runtime.json "$out/runtime.json"
          python tools/environment_atmosphere_live_intermediates.py verify \
            --payload "$out/atmosphere_live_intermediates.json" \
            --receipt "$out/runtime.json" \
            --image-root environment-proof \
            --vfx-head "$(cat exact-head.txt)" \
            --output "$out/target_host.json"
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('evidence/environment_atmosphere_live_intermediates_001/target_host.json').read_text())
          assert data['state']=='PASS_DENSE_INTERMEDIATE_LIVE_UPDATE_PROOF_HOST', data
          assert all(data['checks'].values()), data
          print(json.dumps({'state':data['state'],'runtime_counter_sets':data['runtime_counter_sets']}, indent=2))
          PY

      - name: Retain exact dense VFX frames
        if: always()
        run: |
          mkdir -p evidence/environment_atmosphere_live_intermediates_001/rendered
          cp environment-proof/atmosphere-live-*.png evidence/environment_atmosphere_live_intermediates_001/rendered/ 2>/dev/null || true

      - name: Upload exact dense atmosphere VFX evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: environment-atmosphere-live-intermediates-001-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            exact-head.txt
            evidence/environment_atmosphere_live_intermediates_001/atmosphere_live_intermediates.json
            evidence/environment_atmosphere_live_intermediates_001/runtime.json
            evidence/environment_atmosphere_live_intermediates_001/target_host.json
            evidence/environment_atmosphere_live_intermediates_001/rendered/*.png
          if-no-files-found: warn
          retention-days: 30
