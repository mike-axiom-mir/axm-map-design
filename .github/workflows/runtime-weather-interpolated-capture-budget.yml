name: Runtime Weather interpolation capture budget evidence

on:
  push:
    branches: [studio/runtime-weather-interpolation-capture-budget-001]
    paths:
      - "tools/environment_weather_width_current_world.py"
      - "tools/environment_weather_width_interpolated.py"
      - "tools/runtime_weather_interpolated_capture_budget.py"
      - "environment-proof/atmosphere_current_world_weather_width_observe.gd"
      - "environment-proof/atmosphere_current_world_weather_width_interpolated_observe.gd"
      - "environment-proof/atmosphere_current_world_weather_width_interpolated_deferred_capture_observe.gd"
      - ".github/workflows/runtime-weather-interpolated-capture-budget.yml"
  pull_request:
    paths:
      - "tools/runtime_weather_interpolated_capture_budget.py"
      - "environment-proof/atmosphere_current_world_weather_width_interpolated_deferred_capture_observe.gd"
      - ".github/workflows/runtime-weather-interpolated-capture-budget.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  interpolation-capture-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact Runtime head with ancestry
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bind exact Runtime head to VFX interpolation parent
        run: |
          set -euo pipefail
          git rev-parse HEAD > exact-head.txt
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git cat-file -e 03beb813a852d3c019cc10c41cabe161ac5f50b5^{commit}
          git merge-base --is-ancestor 03beb813a852d3c019cc10c41cabe161ac5f50b5 HEAD

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile exact receiving and Runtime tooling
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/environment_weather_width_current_world.py \
            tools/environment_weather_width_interpolated.py \
            tools/runtime_weather_interpolated_capture_budget.py

      - name: Download exact retained PR22 Weather-variant evidence
        uses: actions/download-artifact@v4
        with:
          name: environment-weather-variant-current-world-001-e482d003853e52fc835f1797ddfb6506a50083ef
          path: .parent-evidence
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: mike-axiom-mir/axm-map-design
          run-id: 35086299949

      - name: Verify retained parent identity
        run: |
          set -euo pipefail
          test "$(cat .parent-evidence/exact-head.txt | tr -d '\n\r')" = "e482d003853e52fc835f1797ddfb6506a50083ef"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.parent-evidence')
          parent=json.loads((root/'current_world_weather_variant.json').read_text())
          target=json.loads((root/'target_host.json').read_text())
          assert parent['status']=='PASS_CURRENT_WORLD_WEATHER_VARIANT_REBIND_STRUCTURE', parent
          assert all(parent['checks'].values()), parent
          assert target['state']=='PASS_CURRENT_WORLD_WEATHER_VARIANT_LIVE_TARGET_HOST', target
          assert all(target['checks'].values()), target
          PY

      - name: Checkout exact Weather variation family
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-weather-design
          ref: 05b26c4e82bbe0a4de0ee7bee34179efc58b9719
          path: .weather-variant
          fetch-depth: 1

      - name: Build exact source-width payload for this Runtime head
        env:
          AXM_RECEIVING_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          out=evidence/runtime_weather_interpolated_capture_budget_001
          mkdir -p "$out" environment-proof/generated
          cp .parent-evidence/current_world_weather_variant.json "$out/parent_variant.json"
          python tools/environment_weather_width_current_world.py build \
            --parent "$out/parent_variant.json" \
            --weather-variant-root .weather-variant \
            --output "$out/current_world_weather_width.json"
          cp exact-head.txt "$out/exact-head.txt"
          cp "$out/current_world_weather_width.json" environment-proof/generated/current_world_weather_width.json
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('evidence/runtime_weather_interpolated_capture_budget_001')
          data=json.loads((root/'current_world_weather_width.json').read_text())
          assert data['status']=='PASS_CURRENT_WORLD_WEATHER_SOURCE_WIDTH_STRUCTURE', data
          assert all(data['checks'].values()), data
          assert data['receiving_head']==(root/'exact-head.txt').read_text().strip(), data
          assert [row['time_s'] for row in data['states']]==[i*0.03125 for i in range(17)], data
          PY

      - name: Download pinned Godot 4.7.2
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum --check --strict
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Install virtual display when needed
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Run inline-PNG interpolation control
        run: |
          set -euo pipefail
          out=evidence/runtime_weather_interpolated_capture_budget_001
          rm -rf environment-proof/interpolated-frames
          mkdir -p environment-proof/interpolated-frames "$out/control-image-root"
          xvfb-run --auto-servernum --server-args="-screen 0 1200x800x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --path environment-proof \
            --script atmosphere_current_world_weather_width_interpolated_observe.gd \
            2>&1 | tee "$out/control-godot.log"
          cp environment-proof/atmosphere-current-world-weather-width-interpolated-runtime.json "$out/control-runtime.json"
          cp -R environment-proof/interpolated-frames "$out/control-image-root/interpolated-frames"
          python tools/environment_weather_width_interpolated.py \
            --payload "$out/current_world_weather_width.json" \
            --receipt "$out/control-runtime.json" \
            --image-root environment-proof \
            --output "$out/control-target-host.json"

      - name: Run deferred-PNG interpolation candidate
        run: |
          set -euo pipefail
          out=evidence/runtime_weather_interpolated_capture_budget_001
          rm -rf environment-proof/interpolated-frames
          mkdir -p environment-proof/interpolated-frames "$out/candidate-image-root"
          xvfb-run --auto-servernum --server-args="-screen 0 1200x800x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --path environment-proof \
            --script atmosphere_current_world_weather_width_interpolated_deferred_capture_observe.gd \
            2>&1 | tee "$out/candidate-godot.log"
          cp environment-proof/atmosphere-current-world-weather-width-interpolated-runtime.json "$out/candidate-runtime.json"
          cp -R environment-proof/interpolated-frames "$out/candidate-image-root/interpolated-frames"

      - name: Verify capture perturbation A/B
        run: |
          set -euo pipefail
          out=evidence/runtime_weather_interpolated_capture_budget_001
          python tools/runtime_weather_interpolated_capture_budget.py \
            --payload "$out/current_world_weather_width.json" \
            --control-receipt "$out/control-runtime.json" \
            --control-report "$out/control-target-host.json" \
            --candidate-receipt "$out/candidate-runtime.json" \
            --control-image-root "$out/control-image-root" \
            --candidate-image-root "$out/candidate-image-root" \
            --output "$out/target_host.json"
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('evidence/runtime_weather_interpolated_capture_budget_001/target_host.json').read_text())
          assert report['state']=='PASS_DEFERRED_CAPTURE_REDUCES_INTERPOLATION_OBSERVER_PERTURBATION', report
          assert all(report['checks'].values()), report
          print(json.dumps({
              'state':report['state'],
              'decision':report['decision'],
              'context_metrics':report['context_metrics'],
              'tradeoff':report['tradeoff'],
          },indent=2))
          PY

      - name: Exercise deliberate capture-policy drift control
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import tools.runtime_weather_interpolated_capture_budget as runtime
          root=Path('evidence/runtime_weather_interpolated_capture_budget_001')
          report=runtime.exercise_capture_policy_negative_control(
              json.loads((root/'current_world_weather_width.json').read_text()),
              json.loads((root/'control-runtime.json').read_text()),
              json.loads((root/'control-target-host.json').read_text()),
              json.loads((root/'candidate-runtime.json').read_text()),
              root/'control-image-root',
              root/'candidate-image-root',
          )
          assert report['state']=='FAIL', report
          assert report['checks']['candidate_context_contract_valid'] is False, report
          print('PASS_FAIL_CLOSED_CAPTURE_POLICY_DRIFT')
          PY

      - name: Upload exact Runtime interpolation capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-weather-interpolated-capture-budget-001-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            evidence/runtime_weather_interpolated_capture_budget_001/exact-head.txt
            evidence/runtime_weather_interpolated_capture_budget_001/parent_variant.json
            evidence/runtime_weather_interpolated_capture_budget_001/current_world_weather_width.json
            evidence/runtime_weather_interpolated_capture_budget_001/control-godot.log
            evidence/runtime_weather_interpolated_capture_budget_001/control-runtime.json
            evidence/runtime_weather_interpolated_capture_budget_001/control-target-host.json
            evidence/runtime_weather_interpolated_capture_budget_001/control-image-root/interpolated-frames/*.png
            evidence/runtime_weather_interpolated_capture_budget_001/candidate-godot.log
            evidence/runtime_weather_interpolated_capture_budget_001/candidate-runtime.json
            evidence/runtime_weather_interpolated_capture_budget_001/candidate-image-root/interpolated-frames/*.png
            evidence/runtime_weather_interpolated_capture_budget_001/target_host.json
          if-no-files-found: warn
          retention-days: 30
