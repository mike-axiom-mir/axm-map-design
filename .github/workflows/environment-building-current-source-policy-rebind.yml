name: Environment Building current-source policy rebind evidence

on:
  push:
    branches: [studio/environment-weather-variant-object-convergence-001]
    paths:
      - "tools/environment_building_current_source_policy_rebind.py"
      - "environment-proof/atmosphere_current_world_building_current_policy_observe.gd"
      - "docs/ENVIRONMENT_BUILDING_CURRENT_SOURCE_POLICY_REBIND_001.md"
      - ".github/workflows/environment-building-current-source-policy-rebind.yml"
  pull_request:
    paths:
      - "tools/environment_building_current_source_policy_rebind.py"
      - "environment-proof/atmosphere_current_world_building_current_policy_observe.gd"
      - "docs/ENVIRONMENT_BUILDING_CURRENT_SOURCE_POLICY_REBIND_001.md"
      - ".github/workflows/environment-building-current-source-policy-rebind.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  exact-current-world-building-policy-rebind:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact Environment head with ancestry
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bind exact Environment predecessor and verifier
        run: |
          set -euo pipefail
          git rev-parse HEAD > exact-head.txt
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git cat-file -e dc9911714365393d3f33038ef8bfda9e057a37e5^{commit}
          git merge-base --is-ancestor dc9911714365393d3f33038ef8bfda9e057a37e5 HEAD
          python -m py_compile tools/environment_building_current_source_policy_rebind.py
          grep -F 'BUILDING_CURRENT_POLICY_HEAD := "a976af429b0ea90e0f0cc72d4a8bd4eb8fef22d3"' environment-proof/atmosphere_current_world_building_current_policy_observe.gd

      - name: Checkout exact Building current-source policy owner
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-building-design
          ref: a976af429b0ea90e0f0cc72d4a8bd4eb8fef22d3
          path: .building-policy
          fetch-depth: 1

      - name: Rebuild and bind exact Building current-source policy evidence
        run: |
          set -euo pipefail
          test "$(git -C .building-policy rev-parse HEAD)" = a976af429b0ea90e0f0cc72d4a8bd4eb8fef22d3
          out=evidence/environment_building_current_source_policy_rebind_001
          mkdir -p "$out/building-policy"
          python .building-policy/tools/service_pavilion_current_emission_policy.py \
            --exact-head a976af429b0ea90e0f0cc72d4a8bd4eb8fef22d3 \
            --output-dir "$out/building-policy"
          python - <<'PY'
          import json
          p=json.load(open('evidence/environment_building_current_source_policy_rebind_001/building-policy/receipt.json'))
          assert p['result']=='PASS_SEGMENTED_BUILDING_PROMOTED_TO_CURRENT_SOURCE_POLICY_WITH_LEGACY_COMPATIBILITY',p
          assert p['schema']=='axm.building-current-emission-policy/v0.1',p
          assert p['current_source_variant_id']=='header-segmented-23',p
          assert p['legacy_compatibility_variant_id']=='base-closed-outward-19',p
          assert p['current_source']['emitted_box_count']==23,p
          assert p['current_source']['vertex_count']==184,p
          assert p['current_source']['triangle_count']==276,p
          assert p['current_source']['positive_volume_intersection_count']==0,p
          assert p['downstream_policy']=='CURRENT_SOURCE_PROMOTED__NO_CONSUMER_AUTO_MIGRATION__EXACT_REBIND_AND_RETEST_REQUIRED',p
          print('PASS_EXACT_BUILDING_CURRENT_SOURCE_POLICY_OWNER')
          PY

      - name: Download exact Nature-migrated current-world parent evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out=evidence/environment_building_current_source_policy_rebind_001
          mkdir -p "$out/parent"
          curl --fail --location --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/10472785088/zip" \
            --output "$out/parent.zip"
          echo "6d54248209b7e5dbfc06b63bdf4867032984941cd2fcb3f63f3f0a16df7b8d4c  $out/parent.zip" | sha256sum --check --strict
          unzip -q "$out/parent.zip" -d "$out/parent"
          test "$(cat "$out/parent/exact-head.txt" | tr -d '\n\r')" = dc9911714365393d3f33038ef8bfda9e057a37e5
          test -f "$out/parent/combined_current_world.json"
          test -f "$out/parent/candidate/runtime.json"
          test -d "$out/parent/candidate/rendered"

      - name: Build explicit current-source policy receiving payload
        run: |
          set -euo pipefail
          out=evidence/environment_building_current_source_policy_rebind_001
          mkdir -p environment-proof/generated
          python tools/environment_building_current_source_policy_rebind.py build \
            --parent "$out/parent/combined_current_world.json" \
            --policy .building-policy/assets/service_pavilion_001_current_emission_policy.json \
            --environment-head "$(cat exact-head.txt)" \
            --output environment-proof/generated/current_world_nature_winding_migration.json
          cp environment-proof/generated/current_world_nature_winding_migration.json "$out/combined_current_world.json"
          python - <<'PY'
          import json
          p=json.load(open('environment-proof/generated/current_world_nature_winding_migration.json'))
          assert p['building_current_source_policy_rebind_result']=='PASS_CURRENT_WORLD_BUILDING_CURRENT_SOURCE_POLICY_REBIND_STRUCTURE',p
          assert p['building_current_source_policy_head']=='a976af429b0ea90e0f0cc72d4a8bd4eb8fef22d3',p
          assert p['building_current_source_variant_id']=='header-segmented-23',p
          assert all(p['checks'].values()),p
          print('PASS_EXACT_BUILDING_CURRENT_SOURCE_POLICY_REBIND_STRUCTURE')
          PY

      - name: Install exact inherited Weather-width observer into proof host
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-map-design
          ref: 15a03b7c3ba3aaa7c0475ca1a3091c15581f559b
          path: .vfx-width-donor
          fetch-depth: 1

      - name: Verify inherited current-world observer chain
        run: |
          set -euo pipefail
          test "$(git -C .vfx-width-donor rev-parse HEAD)" = 15a03b7c3ba3aaa7c0475ca1a3091c15581f559b
          cp .vfx-width-donor/environment-proof/atmosphere_current_world_weather_width_observe.gd environment-proof/atmosphere_current_world_weather_width_observe.gd
          test -f environment-proof/atmosphere_current_world_building_header_segmentation_observe.gd
          test -f environment-proof/atmosphere_current_world_nature_material_family_observe.gd
          test -f environment-proof/atmosphere_current_world_object_material_family_observe.gd
          test -f environment-proof/atmosphere_current_world_object_footprint_material_review.gd
          test -f environment-proof/atmosphere_current_world_object_indexed_footprint_observe.gd
          test -f environment-proof/atmosphere_current_world_nature_winding_migration_observe.gd
          test -f environment-proof/atmosphere_current_world_building_current_policy_observe.gd

      - name: Download pinned Godot 4.7.2
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum --check --strict
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Install proof dependencies and virtual display
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y xvfb; fi

      - name: Observe exact current world after policy-only rebind
        env:
          AXM_OBJECT_FOOTPRINT_REVIEW_MODE: CANDIDATE_VISIBLE
        run: |
          set -euo pipefail
          out=evidence/environment_building_current_source_policy_rebind_001/candidate
          mkdir -p "$out/rendered"
          rm -f environment-proof/atmosphere-width-*.png environment-proof/atmosphere-current-world-weather-width-runtime.json
          set +e
          xvfb-run --auto-servernum --server-args="-screen 0 1200x800x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 --rendering-method gl_compatibility \
            --path environment-proof --script atmosphere_current_world_building_current_policy_observe.gd \
            2>&1 | tee "$out/godot.log"
          status=${PIPESTATUS[0]}; set -e
          cp environment-proof/atmosphere-current-world-weather-width-runtime.json "$out/runtime.json" 2>/dev/null || true
          cp environment-proof/atmosphere-width-*.png "$out/rendered/" 2>/dev/null || true
          exit "$status"

      - name: Verify exact multi-asset policy-only receiving result
        run: |
          set -euo pipefail
          out=evidence/environment_building_current_source_policy_rebind_001
          python tools/environment_building_current_source_policy_rebind.py verify \
            --payload "$out/combined_current_world.json" \
            --parent-root "$out/parent/candidate" \
            --candidate-root "$out/candidate" \
            --environment-head "$(cat exact-head.txt)" \
            --output "$out/report.json"
          cp exact-head.txt "$out/exact-head.txt"
          python - <<'PY'
          import json
          p=json.load(open('evidence/environment_building_current_source_policy_rebind_001/report.json'))
          assert p['state']=='PASS_CURRENT_WORLD_BUILDING_CURRENT_SOURCE_POLICY_REBIND_TARGET_HOST_REACHED',p
          assert p['matched_frames']==68 and p['byte_identical_frames']==68,p
          assert p['weather_width_measurements']==1224,p
          assert p['maximum_weather_width_residual_px'] <= 0.05,p
          assert all(v==0 for v in p['runtime_counter_deltas'].values()),p
          assert all(p['checks'].values()),p
          print(json.dumps(p,indent=2))
          PY

      - name: Remove downloaded parent before upload
        if: always()
        run: |
          rm -rf evidence/environment_building_current_source_policy_rebind_001/parent
          rm -f evidence/environment_building_current_source_policy_rebind_001/parent.zip

      - name: Upload retained Environment Building-policy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: environment-building-current-source-policy-rebind-001-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/environment_building_current_source_policy_rebind_001
          if-no-files-found: error
          retention-days: 30
