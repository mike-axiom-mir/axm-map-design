name: VFX Weather source-width wall-clock presentation evidence

on:
  push:
    branches: [studio/vfx-weather-source-width-current-world-001]
    paths:
      - "tools/environment_weather_width_current_world.py"
      - "tools/environment_weather_width_playback.py"
      - "environment-proof/atmosphere_current_world_weather_width_observe.gd"
      - "environment-proof/atmosphere_current_world_weather_width_playback_observe.gd"
      - ".github/workflows/vfx-weather-source-width-wall-clock.yml"
      - "docs/ENVIRONMENT_WEATHER_SOURCE_WIDTH_CURRENT_WORLD_001.md"
  pull_request:
    paths:
      - "tools/environment_weather_width_current_world.py"
      - "tools/environment_weather_width_playback.py"
      - "environment-proof/atmosphere_current_world_weather_width_observe.gd"
      - "environment-proof/atmosphere_current_world_weather_width_playback_observe.gd"
      - ".github/workflows/vfx-weather-source-width-wall-clock.yml"
      - "docs/ENVIRONMENT_WEATHER_SOURCE_WIDTH_CURRENT_WORLD_001.md"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  exact-weather-source-width-wall-clock:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact VFX receiving head with ancestry
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bind exact receiving and parent identity
        run: |
          set -euo pipefail
          git rev-parse HEAD > exact-head.txt
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git cat-file -e e482d003853e52fc835f1797ddfb6506a50083ef^{commit}
          git merge-base --is-ancestor e482d003853e52fc835f1797ddfb6506a50083ef HEAD

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile exact receiving tooling
        run: |
          set -euo pipefail
          python -m py_compile tools/environment_weather_width_current_world.py tools/environment_weather_width_playback.py

      - name: Download exact retained PR22 Weather-variant evidence
        uses: actions/download-artifact@v4
        with:
          name: environment-weather-variant-current-world-001-e482d003853e52fc835f1797ddfb6506a50083ef
          path: .parent-evidence
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: mike-axiom-mir/axm-map-design
          run-id: 35086299949

      - name: Verify retained parent identity
        run: |
          set -euo pipefail
          test "$(cat .parent-evidence/exact-head.txt | tr -d '\n\r')" = "e482d003853e52fc835f1797ddfb6506a50083ef"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.parent-evidence')
          parent=json.loads((root/'current_world_weather_variant.json').read_text())
          target=json.loads((root/'target_host.json').read_text())
          assert parent['status']=='PASS_CURRENT_WORLD_WEATHER_VARIANT_REBIND_STRUCTURE', parent
          assert all(parent['checks'].values()), parent
          assert parent['receiving_head']=='e482d003853e52fc835f1797ddfb6506a50083ef', parent
          assert target['state']=='PASS_CURRENT_WORLD_WEATHER_VARIANT_LIVE_TARGET_HOST', target
          assert all(target['checks'].values()), target
          PY

      - name: Checkout exact Weather variation family
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-weather-design
          ref: 05b26c4e82bbe0a4de0ee7bee34179efc58b9719
          path: .weather-variant
          fetch-depth: 1

      - name: Build exact source-width payload for this receiving head
        env:
          AXM_RECEIVING_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          out=evidence/environment_weather_source_width_wall_clock_001
          mkdir -p "$out" environment-proof/generated
          cp .parent-evidence/current_world_weather_variant.json "$out/parent_variant.json"
          python tools/environment_weather_width_current_world.py build \
            --parent "$out/parent_variant.json" \
            --weather-variant-root .weather-variant \
            --output "$out/current_world_weather_width.json"
          cp exact-head.txt "$out/exact-head.txt"
          cp "$out/current_world_weather_width.json" environment-proof/generated/current_world_weather_width.json
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('evidence/environment_weather_source_width_wall_clock_001')
          data=json.loads((root/'current_world_weather_width.json').read_text())
          assert data['status']=='PASS_CURRENT_WORLD_WEATHER_SOURCE_WIDTH_STRUCTURE', data
          assert all(data['checks'].values()), data
          assert data['receiving_head']==(root/'exact-head.txt').read_text().strip(), data
          assert [row['time_s'] for row in data['states']]==[i*0.03125 for i in range(17)], data
          PY

      - name: Download pinned Godot 4.7.2
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum --check --strict
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Install virtual display when needed
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Present exact 17 source states on the real Godot wall clock in both fixed cameras
        run: |
          set -euo pipefail
          out=evidence/environment_weather_source_width_wall_clock_001
          set +e
          xvfb-run --auto-servernum --server-args="-screen 0 1200x800x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --path environment-proof \
            --script atmosphere_current_world_weather_width_playback_observe.gd \
            2>&1 | tee "$out/godot.log"
          status=${PIPESTATUS[0]}
          set -e
          cp environment-proof/atmosphere-current-world-weather-width-playback-runtime.json "$out/runtime.json" 2>/dev/null || true
          exit "$status"

      - name: Verify bounded wall-clock presentation
        run: |
          set -euo pipefail
          out=evidence/environment_weather_source_width_wall_clock_001
          python tools/environment_weather_width_playback.py \
            --payload "$out/current_world_weather_width.json" \
            --receipt "$out/runtime.json" \
            --output "$out/target_host.json"
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('evidence/environment_weather_source_width_wall_clock_001/target_host.json').read_text())
          assert report['state']=='PASS_CURRENT_WORLD_WEATHER_SOURCE_WIDTH_BOUNDED_WALL_CLOCK_PRESENTATION', report
          assert all(report['checks'].values()), report
          print(json.dumps({
              'state':report['state'],
              'context_metrics':report['context_metrics'],
              'maximum_projected_width_residual_px':report['maximum_projected_width_residual_px'],
              'near_clip_totals':report['near_clip_totals'],
          },indent=2))
          PY

      - name: Exercise deliberate wall-clock deadline drift control
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy, json
          from pathlib import Path
          import tools.environment_weather_width_playback as playback
          payload=json.loads(Path('evidence/environment_weather_source_width_wall_clock_001/current_world_weather_width.json').read_text())
          receipt=json.loads(Path('evidence/environment_weather_source_width_wall_clock_001/runtime.json').read_text())
          drift=copy.deepcopy(receipt)
          row=drift['contexts']['path_eye']['samples'][8]
          row['draw_time_s']=row['scheduled_time_s']+0.100
          row['draw_lateness_ms']=100.0
          report=playback.verify_playback(payload,drift)
          assert report['state']=='FAIL', report
          assert report['checks']['all_post_draw_observations_within_one_source_interval'] is False, report
          print('PASS_FAIL_CLOSED_WALL_CLOCK_DEADLINE_DRIFT')
          PY

      - name: Upload exact wall-clock presentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: environment-weather-source-width-wall-clock-001-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            evidence/environment_weather_source_width_wall_clock_001/exact-head.txt
            evidence/environment_weather_source_width_wall_clock_001/parent_variant.json
            evidence/environment_weather_source_width_wall_clock_001/current_world_weather_width.json
            evidence/environment_weather_source_width_wall_clock_001/godot.log
            evidence/environment_weather_source_width_wall_clock_001/runtime.json
            evidence/environment_weather_source_width_wall_clock_001/target_host.json
          if-no-files-found: warn
          retention-days: 30
