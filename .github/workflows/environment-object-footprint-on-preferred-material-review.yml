name: Environment Object footprint on preferred material review

on:
  push:
    branches: [studio/environment-weather-variant-object-convergence-001]
    paths:
      - "environment-proof/atmosphere_current_world_object_footprint_material_review.gd"
      - "tools/review_environment_object_footprint_on_preferred_material.py"
      - "docs/ENVIRONMENT_OBJECT_FOOTPRINT_ON_PREFERRED_MATERIAL_REVIEW_001.md"
      - ".github/workflows/environment-object-footprint-on-preferred-material-review.yml"
  pull_request:
    paths:
      - "environment-proof/atmosphere_current_world_object_footprint_material_review.gd"
      - "tools/review_environment_object_footprint_on_preferred_material.py"
      - "docs/ENVIRONMENT_OBJECT_FOOTPRINT_ON_PREFERRED_MATERIAL_REVIEW_001.md"
      - ".github/workflows/environment-object-footprint-on-preferred-material-review.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  exact-footprint-review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact Environment review head with ancestry
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bind exact reviewed world and review tooling
        run: |
          set -euo pipefail
          git rev-parse HEAD > review-head.txt
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git cat-file -e 6575cc38db9f0f62b14a82b352d8582edf89856d^{commit}
          git merge-base --is-ancestor 6575cc38db9f0f62b14a82b352d8582edf89856d HEAD
          python -m py_compile tools/review_environment_object_footprint_on_preferred_material.py
          grep -F 'REVIEW_ONLY_VISIBILITY_TOGGLE__SAME_DRESSING_MESH_RESIDENCY__NO_SOURCE_OR_COMPOSITION_REWRITE' environment-proof/atmosphere_current_world_object_footprint_material_review.gd

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install image-analysis dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy

      - name: Download exact current Object-material Environment evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out=evidence/environment_object_footprint_material_review_001
          mkdir -p "$out/current"
          curl --fail --location --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/10466065113/zip" \
            --output "$out/current.zip"
          echo "87dd366302e94b5a6f8241e110e9629c2d81a0d7321197b14a52b860642fd519  $out/current.zip" | sha256sum --check --strict
          unzip -q "$out/current.zip" -d "$out/current"
          test "$(cat "$out/current/exact-head.txt" | tr -d '\n\r')" = 6575cc38db9f0f62b14a82b352d8582edf89856d
          test -f "$out/current/combined_current_world.json"
          test -f "$out/current/runtime.json"
          test -f "$out/current/target_host.json"
          test -d "$out/current/rendered"
          cp "$out/current/combined_current_world.json" environment-proof/generated/current_world_object_material_family.json

      - name: Verify exact current visual authority boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('evidence/environment_object_footprint_material_review_001/current')
          p=json.loads((root/'combined_current_world.json').read_text())
          t=json.loads((root/'target_host.json').read_text())
          assert p['receiving_head']=='6575cc38db9f0f62b14a82b352d8582edf89856d',p
          assert p['composition_digest']=='677dfe17afe49bf3f6edc28359c40a8add3dc357cb918529f0015a99f71baf70',p
          assert p['status']=='PASS_CURRENT_WORLD_OBJECT_MATERIAL_FAMILY_STRUCTURE' and all(p['checks'].values()),p
          assert t['state']=='PASS_CURRENT_WORLD_OBJECT_MATERIAL_FAMILY_TARGET_HOST' and all(t['checks'].values()),t
          print('PASS_EXACT_CURRENT_OBJECT_MATERIAL_WORLD_BOUNDARY')
          PY

      - name: Install exact inherited Weather-width observer into proof host
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-map-design
          ref: 15a03b7c3ba3aaa7c0475ca1a3091c15581f559b
          path: .vfx-width-donor
          fetch-depth: 1

      - name: Verify proof-host inheritance chain
        run: |
          set -euo pipefail
          test "$(git -C .vfx-width-donor rev-parse HEAD)" = 15a03b7c3ba3aaa7c0475ca1a3091c15581f559b
          cp .vfx-width-donor/environment-proof/atmosphere_current_world_weather_width_observe.gd environment-proof/atmosphere_current_world_weather_width_observe.gd
          test -f environment-proof/atmosphere_current_world_building_infill_weather_width_observe.gd
          test -f environment-proof/atmosphere_current_world_object_readability_dressing_observe.gd
          test -f environment-proof/atmosphere_current_world_building_header_segmentation_observe.gd
          test -f environment-proof/atmosphere_current_world_nature_material_family_observe.gd
          test -f environment-proof/atmosphere_current_world_object_material_family_observe.gd
          test -f environment-proof/atmosphere_current_world_object_footprint_material_review.gd

      - name: Download pinned Godot 4.7.2
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum --check --strict
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Install virtual display when needed
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y xvfb; fi

      - name: Observe hidden-cue control on exact current world
        env:
          AXM_OBJECT_FOOTPRINT_REVIEW_MODE: CONTROL_HIDDEN
        run: |
          set -euo pipefail
          out=evidence/environment_object_footprint_material_review_001/control
          mkdir -p "$out/rendered"
          rm -f environment-proof/atmosphere-width-*.png environment-proof/atmosphere-current-world-weather-width-runtime.json
          set +e
          xvfb-run --auto-servernum --server-args="-screen 0 1200x800x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 --rendering-method gl_compatibility \
            --path environment-proof --script atmosphere_current_world_object_footprint_material_review.gd \
            2>&1 | tee "$out/godot.log"
          status=${PIPESTATUS[0]}; set -e
          cp environment-proof/atmosphere-current-world-weather-width-runtime.json "$out/runtime.json" 2>/dev/null || true
          cp environment-proof/atmosphere-width-*.png "$out/rendered/" 2>/dev/null || true
          exit "$status"

      - name: Observe visible-cue candidate on exact current world
        env:
          AXM_OBJECT_FOOTPRINT_REVIEW_MODE: CANDIDATE_VISIBLE
        run: |
          set -euo pipefail
          out=evidence/environment_object_footprint_material_review_001/candidate
          mkdir -p "$out/rendered"
          rm -f environment-proof/atmosphere-width-*.png environment-proof/atmosphere-current-world-weather-width-runtime.json
          set +e
          xvfb-run --auto-servernum --server-args="-screen 0 1200x800x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 --rendering-method gl_compatibility \
            --path environment-proof --script atmosphere_current_world_object_footprint_material_review.gd \
            2>&1 | tee "$out/godot.log"
          status=${PIPESTATUS[0]}; set -e
          cp environment-proof/atmosphere-current-world-weather-width-runtime.json "$out/runtime.json" 2>/dev/null || true
          cp environment-proof/atmosphere-width-*.png "$out/rendered/" 2>/dev/null || true
          exit "$status"

      - name: Verify attribution-clean footprint review surface
        run: |
          set -euo pipefail
          out=evidence/environment_object_footprint_material_review_001
          python tools/review_environment_object_footprint_on_preferred_material.py \
            --current-root "$out/current" \
            --control-root "$out/control" \
            --candidate-root "$out/candidate" \
            --review-head "$(cat review-head.txt)" \
            --output "$out/review.json"
          cp review-head.txt "$out/review-head.txt"
          python - <<'PY'
          import json
          p=json.load(open('evidence/environment_object_footprint_material_review_001/review.json'))
          assert p['state']=='PASS_CURRENT_WORLD_OBJECT_FOOTPRINT_ON_PREFERRED_MATERIAL_REVIEW_READY',p
          assert all(p['checks'].values()),p
          print(json.dumps({
              'state':p['state'],
              'visual_delta':p['visual_delta'],
              'weather_width':p['weather_width'],
              'runtime_visibility_delta':p['review_visibility_runtime_deltas'],
          },indent=2))
          PY

      - name: Remove downloaded current artifact duplicate before upload
        if: always()
        run: |
          rm -rf evidence/environment_object_footprint_material_review_001/current
          rm -f evidence/environment_object_footprint_material_review_001/current.zip

      - name: Upload retained Environment footprint review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: environment-object-footprint-material-review-001-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/environment_object_footprint_material_review_001
          if-no-files-found: error
          retention-days: 30
