name: Environment neutral-peak scene motion evidence

on:
  push:
    branches: [studio/environment-real-nature-weather-001]
    paths:
      - "tools/environment_motion_scene.py"
      - "tests/test_environment_motion_scene.py"
      - ".github/workflows/environment-motion-scene.yml"
      - "environment-proof/observe.gd"
      - "environment-proof/project.godot"
      - "tools/environment_eye_level.py"
      - "tools/environment_real_slice.py"
      - "examples/environment_real_slice_001.json"
  pull_request:
    paths:
      - "tools/environment_motion_scene.py"
      - "tests/test_environment_motion_scene.py"
      - ".github/workflows/environment-motion-scene.yml"
      - "environment-proof/observe.gd"
      - "environment-proof/project.godot"
      - "tools/environment_eye_level.py"
      - "tools/environment_real_slice.py"
      - "examples/environment_real_slice_001.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-motion-scene-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Environment lane
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Checkout exact accepted Nature response
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-nature-design
          ref: cee14f5b3feea78b0adcd044bad2ea3c97657fc6
          path: .nature

      - name: Checkout exact Weather source
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-weather-design
          ref: ca2eaba519e8449835b0ea6ef944b7080c3caa6a
          path: .weather

      - name: Verify dependency heads
        run: |
          test "$(git -C .nature rev-parse HEAD)" = "cee14f5b3feea78b0adcd044bad2ea3c97657fc6"
          test "$(git -C .weather rev-parse HEAD)" = "ca2eaba519e8449835b0ea6ef944b7080c3caa6a"

      - name: Compile and test bounded motion-scene contract
        run: |
          python -m compileall -q tools tests
          python -m unittest tests.test_environment_motion_scene -v

      - name: Rebuild exact source integration and motion-scene payload
        env:
          AXM_RECEIVING_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python tools/environment_real_slice.py --nature-root .nature --weather-root .weather --output evidence/environment_real_slice_001
          python tools/environment_motion_scene.py \
            --nature-root .nature \
            --weather-root .weather \
            --nature-response-head cee14f5b3feea78b0adcd044bad2ea3c97657fc6 \
            --output evidence/environment_motion_scene_001

      - name: Validate scene-motion evidence and emit render payloads
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('evidence/environment_motion_scene_001')
          evidence=json.loads((root/'motion_scene_evidence.json').read_text())
          motion=json.loads((root/'motion_scene_runtime.json').read_text())
          assert evidence['status']=='PASS',evidence
          assert all(evidence['checks'].values()),evidence
          assert evidence['nature_response']['head']=='cee14f5b3feea78b0adcd044bad2ea3c97657fc6'
          assert evidence['composition_measurements']['peak_path_unblocked'] is True
          assert evidence['composition_measurements']['peak_spacing_conflicts']==[]
          def digest(v):
              return hashlib.sha256(json.dumps(v,sort_keys=True,separators=(',',':'),ensure_ascii=True).encode()).hexdigest()
          for state_name in ('neutral','peak'):
              state=motion['sapling']['states'][state_name]
              scene={
                  'schema':'axm.environment-eye-level-proof/v0.1',
                  'study_id':'environment-motion-scene-001-'+state_name,
                  'receiving_head':motion['receiving_head'],
                  'source_integration':motion['source_integration'],
                  'scene_size_m':motion['scene_size_m'],
                  'readable_path':motion['readable_path'],
                  'items':motion['items'],
                  'sapling':{
                      'asset_id':motion['sapling']['asset_id'],
                      'truth_state':motion['sapling']['truth_state'],
                      'vertices_source_xyz_m':state['vertices_source_xyz_m'],
                      'triangles':state['triangles'],
                      'proof_render_culling':motion['sapling']['proof_render_culling'],
                  },
                  'weather_lines':motion['weather_lines'],
                  'weather_presentation':motion['weather_presentation'],
                  'cameras':motion['cameras'],
                  'truth_boundary':motion['truth_boundary'],
              }
              scene['scene_digest']=digest(scene)
              (root/f'{state_name}_render_scene.json').write_text(json.dumps(scene,indent=2,sort_keys=True)+'\n')
          print(json.dumps(evidence,indent=2))
          PY

      - name: Download pinned Godot 4.7.2
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum --check --strict
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64

      - name: Install virtual display when needed
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Render exact neutral and peak states from unchanged cameras
        run: |
          set -euo pipefail
          mkdir -p environment-proof/generated
          for state in neutral peak; do
            cp "evidence/environment_motion_scene_001/${state}_render_scene.json" environment-proof/generated/scene_runtime.json
            rm -f environment-proof/environment-eye-level-runtime-receipt.json environment-proof/path_eye.png environment-proof/elevated_oblique.png
            xvfb-run --auto-servernum --server-args="-screen 0 1200x800x24" \
              .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
              --display-driver x11 \
              --rendering-method gl_compatibility \
              --path environment-proof \
              --script observe.gd
            mv environment-proof/environment-eye-level-runtime-receipt.json "environment-proof/${state}_runtime_receipt.json"
            mv environment-proof/path_eye.png "environment-proof/path_eye_${state}.png"
            mv environment-proof/elevated_oblique.png "environment-proof/elevated_oblique_${state}.png"
          done

      - name: Validate target-host captures and isolated visual delta
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          proof=Path('environment-proof')
          evidence=json.loads(Path('evidence/environment_motion_scene_001/motion_scene_evidence.json').read_text())
          for state in ('neutral','peak'):
              scene=json.loads(Path(f'evidence/environment_motion_scene_001/{state}_render_scene.json').read_text())
              receipt=json.loads((proof/f'{state}_runtime_receipt.json').read_text())
              assert receipt['state']=='PASS_TARGET_HOST_ENVIRONMENT_OBSERVATION_READY',receipt
              assert receipt['promotion_effect']=='NONE',receipt
              assert receipt['scene_digest']==scene['scene_digest'],(receipt,scene)
              assert receipt['receiving_head']==evidence['receiving_head'],(receipt,evidence)
              for context,row in receipt['contexts'].items():
                  assert row['state']=='PASS',(context,row)
                  assert row['capture']['bytes']>3000,(context,row)
                  assert row['sapling']['vertices']==390,(context,row)
                  assert row['sapling']['triangles']==570,(context,row)
                  assert row['weather']['streaks']==36,(context,row)
          hashes={}
          for context in ('path_eye','elevated_oblique'):
              for state in ('neutral','peak'):
                  p=proof/f'{context}_{state}.png'
                  hashes[f'{context}_{state}']=hashlib.sha256(p.read_bytes()).hexdigest()
              assert hashes[f'{context}_neutral']!=hashes[f'{context}_peak'],hashes
          Path('evidence/environment_motion_scene_001/render_hashes.json').write_text(json.dumps(hashes,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'evidence':evidence,'render_hashes':hashes},indent=2))
          PY

      - name: Upload exact Environment motion-scene evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: environment-motion-scene-001-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            evidence/environment_real_slice_001/evidence.json
            evidence/environment_motion_scene_001/motion_scene_runtime.json
            evidence/environment_motion_scene_001/motion_scene_evidence.json
            evidence/environment_motion_scene_001/neutral_render_scene.json
            evidence/environment_motion_scene_001/peak_render_scene.json
            evidence/environment_motion_scene_001/render_hashes.json
            environment-proof/neutral_runtime_receipt.json
            environment-proof/peak_runtime_receipt.json
            environment-proof/path_eye_neutral.png
            environment-proof/path_eye_peak.png
            environment-proof/elevated_oblique_neutral.png
            environment-proof/elevated_oblique_peak.png
          if-no-files-found: warn
          retention-days: 30
