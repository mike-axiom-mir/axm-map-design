name: VFX Nature leaf flutter clean-vs-ideal timing review

on:
  push:
    branches: [studio/vfx-nature-leaf-flutter-wall-clock-current-world-001]
    paths:
      - "tools/vfx_nature_leaf_flutter_clean_vs_ideal_review.py"
      - "docs/VFX_NATURE_LEAF_FLUTTER_CLEAN_VS_IDEAL_REVIEW_001.md"
      - ".github/workflows/vfx-nature-leaf-flutter-clean-vs-ideal-review-current-world.yml"
  pull_request:
    paths:
      - "tools/vfx_nature_leaf_flutter_clean_vs_ideal_review.py"
      - "docs/VFX_NATURE_LEAF_FLUTTER_CLEAN_VS_IDEAL_REVIEW_001.md"
      - ".github/workflows/vfx-nature-leaf-flutter-clean-vs-ideal-review-current-world.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  clean-vs-ideal-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact VFX head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bind exact reviewed lineage and compile builder
        run: |
          set -euo pipefail
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          printf '%s\n' "$EXPECTED" > exact-head.txt
          git cat-file -e 79fb8260c898171ce7c6357d1cbd4a5f69bc231a^{commit}
          git cat-file -e 05ca6fbc93e9aa8f130d3d7066975bcdf6940f86^{commit}
          git merge-base --is-ancestor 79fb8260c898171ce7c6357d1cbd4a5f69bc231a HEAD
          python -m py_compile tools/vfx_nature_leaf_flutter_clean_vs_ideal_review.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download exact retained telemetry-bound reconstruction
        uses: actions/download-artifact@v4
        with:
          name: vfx-nature-leaf-flutter-timing-reconstruction-001-05ca6fbc93e9aa8f130d3d7066975bcdf6940f86
          path: evidence/vfx_nature_leaf_flutter_clean_vs_ideal_review_001/reconstruction
          github-token: ${{ github.token }}
          repository: mike-axiom-mir/axm-map-design
          run-id: 35195889303

      - name: Verify retained artifact identity and build review package
        run: |
          set -euo pipefail
          root=evidence/vfx_nature_leaf_flutter_clean_vs_ideal_review_001
          recon="$root/reconstruction"
          out="$root/review"
          test -f "$recon/reconstruction-manifest.json"
          test -f "$recon/summary.json"
          python tools/vfx_nature_leaf_flutter_clean_vs_ideal_review.py \
            --artifact-root "$recon" \
            --output "$out" \
            | tee "$root/build.log"
          cp exact-head.txt "$out/exact-head.txt"

      - name: Install lossless review encoder when needed
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Build lossless raw clean, cadence-aligned clean, and ideal review media
        run: |
          set -euo pipefail
          out=evidence/vfx_nature_leaf_flutter_clean_vs_ideal_review_001/review
          for context in path_eye elevated_oblique; do
            for mode in raw-clean cadence-aligned-clean ideal; do
              ffmpeg -hide_banner -loglevel error -y \
                -f concat -safe 0 -i "$out/$mode-$context.ffconcat" \
                -fps_mode vfr -c:v ffv1 -level 3 -pix_fmt bgr0 \
                "$out/$mode-review-$context.mkv"
              test -s "$out/$mode-review-$context.mkv"
              ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 \
                "$out/$mode-review-$context.mkv" > "$out/$mode-review-$context-duration.txt"
            done
          done

      - name: Fail-closed validate final review package
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          out=Path('evidence/vfx_nature_leaf_flutter_clean_vs_ideal_review_001/review')
          report=json.loads((out/'comparison-manifest.json').read_text())
          assert report['state']=='PASS_TELEMETRY_BOUND_CLEAN_VS_IDEAL_REVIEW_SURFACE',report
          assert report['accepted_receiver_head']=='7713cbe5863c3bc38dabb6236eb4b393401224b6',report
          assert report['nature_vfx_effect_head']=='ecade64227ba1d3d1faf029ca7188ea63c2560ec',report
          assert report['clean_timing_head']=='795d9e8862e895e506c756b9ea01cd6228fa7ab7',report
          assert report['clean_presented_total']==92 and report['clean_scheduled_total']==96,report
          assert report['direct_live_capture_of_clean_stream'] is False,report
          assert report['interpolation_added'] is False,report
          assert report['source_retimed'] is False,report
          assert report['ideal_schedule_is_counterfactual_reference_not_observed_runtime'] is True,report
          assert report['browser_is_timing_authority'] is False,report
          assert report['final_perceptual_acceptance_claimed'] is False,report
          expected={'path_eye':([19],47),'elevated_oblique':([11,23,38],45)}
          for context,(skips,count) in expected.items():
              c=report['contexts'][context]
              assert c['clean_skipped_slots']==skips,c
              assert c['clean_presented_slots']==count,c
              assert len(c['raw_clean_events'])==count+2,c
              assert len(c['cadence_aligned_clean_events'])==count+1,c
              assert len(c['ideal_events'])==49,c
              assert abs(c['ideal_endpoint_ms']-1500.0)<1e-9,c
              assert c['first_presented_offset_ms']>0,c
              stats=c['clean_frame_post_draw_interval_stats']
              assert stats['minimum_ms']>0 and stats['maximum_ms']>=stats['minimum_ms'],stats
              for mode in ('raw-clean','cadence-aligned-clean','ideal'):
                  media=out/f'{mode}-review-{context}.mkv'
                  duration=float((out/f'{mode}-review-{context}-duration.txt').read_text().strip())
                  assert media.is_file() and media.stat().st_size>0,media
                  assert duration>1.5,duration
          images=list((out/'static-rendered').glob('*.png'))
          assert len(images)==34,len(images)
          assert (out/'review.html').is_file()
          print(json.dumps({
              'state':report['state'],
              'path_eye_interval_stats':report['contexts']['path_eye']['clean_frame_post_draw_interval_stats'],
              'elevated_oblique_interval_stats':report['contexts']['elevated_oblique']['clean_frame_post_draw_interval_stats'],
              'media_files':6,
              'static_pngs':len(images),
          },indent=2))
          PY

      - name: Upload exact clean-vs-ideal review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vfx-nature-leaf-flutter-clean-vs-ideal-review-001-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            evidence/vfx_nature_leaf_flutter_clean_vs_ideal_review_001/build.log
            evidence/vfx_nature_leaf_flutter_clean_vs_ideal_review_001/review/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 30
