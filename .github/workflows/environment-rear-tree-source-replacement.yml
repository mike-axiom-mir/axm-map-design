name: Environment rear Nature source replacement evidence

on:
  push:
    branches: [studio/environment-rear-tree-source-replacement-001]
    paths:
      - "examples/environment_rear_tree_source_replacement_001.json"
      - "tools/environment_rear_tree_source_replacement.py"
      - "tests/test_environment_rear_tree_source_replacement.py"
      - "docs/ENVIRONMENT_REAR_TREE_SOURCE_REPLACEMENT_001.md"
      - ".github/workflows/environment-rear-tree-source-replacement.yml"
      - "environment-proof/**"
  pull_request:
    paths:
      - "examples/environment_rear_tree_source_replacement_001.json"
      - "tools/environment_rear_tree_source_replacement.py"
      - "tests/test_environment_rear_tree_source_replacement.py"
      - "docs/ENVIRONMENT_REAR_TREE_SOURCE_REPLACEMENT_001.md"
      - ".github/workflows/environment-rear-tree-source-replacement.yml"
      - "environment-proof/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-rear-nature-source-replacement:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact Environment head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind exact receiving head
        run: |
          set -euo pipefail
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          OBSERVED="$(git rev-parse HEAD)"
          test "$OBSERVED" = "$EXPECTED"
          printf '%s\n' "$OBSERVED" > exact-head.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Checkout exact baseline Nature source
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-nature-design
          ref: fbc202449981f2bac153951c561ed0ed6120c936
          path: .nature-base

      - name: Checkout exact compact Nature source
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-nature-design
          ref: 64116d63fc76daa1623b5fd5046a4e6074100bda
          path: .nature-east

      - name: Checkout exact rear Nature source
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-nature-design
          ref: a4e5ee011e1d87f47866a7e6c6f4e66f57b6af12
          path: .nature-rear

      - name: Checkout exact Weather source
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-weather-design
          ref: ca2eaba519e8449835b0ea6ef944b7080c3caa6a
          path: .weather

      - name: Checkout exact Building source
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-building-design
          ref: 4faa769b406bf3ad0ba9489a77141c27f122ce51
          path: .building

      - name: Compile and test bounded rear Nature replacement
        env:
          AXM_BASE_NATURE_ROOT: ${{ github.workspace }}/.nature-base
          AXM_COMPACT_NATURE_ROOT: ${{ github.workspace }}/.nature-east
          AXM_REAR_NATURE_ROOT: ${{ github.workspace }}/.nature-rear
          AXM_WEATHER_ROOT: ${{ github.workspace }}/.weather
          AXM_BUILDING_ROOT: ${{ github.workspace }}/.building
          AXM_BUILDING_HEAD: 4faa769b406bf3ad0ba9489a77141c27f122ce51
          AXM_REAR_NATURE_HEAD: a4e5ee011e1d87f47866a7e6c6f4e66f57b6af12
        run: |
          python -m compileall -q tools tests
          python -m unittest tests.test_environment_rear_tree_source_replacement -v

      - name: Rebuild exact Building baseline and rear Nature candidate
        env:
          AXM_RECEIVING_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          AXM_BUILDING_HEAD: 4faa769b406bf3ad0ba9489a77141c27f122ce51
          AXM_REAR_NATURE_HEAD: a4e5ee011e1d87f47866a7e6c6f4e66f57b6af12
        run: |
          python tools/environment_rear_tree_source_replacement.py \
            --base-nature-root .nature-base \
            --compact-nature-root .nature-east \
            --weather-root .weather \
            --building-root .building \
            --rear-nature-root .nature-rear \
            --output evidence/environment_rear_tree_source_replacement_001
          cp exact-head.txt evidence/environment_rear_tree_source_replacement_001/exact-head.txt

      - name: Validate exact structural evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('evidence/environment_rear_tree_source_replacement_001')
          e=json.loads((root/'replacement_evidence.json').read_text())
          b=json.loads((root/'baseline_scene_runtime.json').read_text())
          c=json.loads((root/'candidate_scene_runtime.json').read_text())
          exact=(root/'exact-head.txt').read_text().strip()
          assert e['status']=='PASS_REAR_RIGHT_NATURE_SOURCE_REPLACEMENT_STRUCTURE',e
          assert all(e['checks'].values()),e
          assert e['receiving_head']==c['receiving_head']==exact,(e,c,exact)
          assert e['baseline_scene_digest']==b['scene_digest'],(e,b)
          assert e['candidate_scene_digest']==c['scene_digest'],(e,c)
          assert any(row['asset_id']=='proxy:nature-tree-east-a' for row in b['items']),b
          assert not any(row['asset_id']=='proxy:nature-tree-east-a' for row in c['items']),c
          assert len(b['additional_source_meshes'])==2,b
          assert len(c['additional_source_meshes'])==3,c
          assert c['additional_source_meshes'][:-1]==b['additional_source_meshes'],(b,c)
          rear=c['additional_source_meshes'][-1]
          assert rear['asset_id']=='source:nature:east-rear-tree-neutral-001',rear
          assert rear['source_digest']=='0adf2cde8cfc355ec21b6fb06c6759b753300164b5f72ba029dc1b8c6d2ef307',rear
          assert rear['mesh_digest']=='d7fc5deaa1c12d1d8c7d7b6dc95bf1e8544ce26140ee2e4a7d2c67a2c4133e48',rear
          assert len(rear['vertices_source_xyz_m'])==390,rear
          assert len(rear['triangles'])==570,rear
          assert any(row['asset_id']=='source:building:service-pavilion-001' for row in c['additional_source_meshes']),c
          assert any(row['asset_id']=='source:nature:compact-east-tree-neutral-001' for row in c['additional_source_meshes']),c
          print(json.dumps(e,indent=2))
          PY

      - name: Download pinned Godot 4.7.2
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum --check --strict
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Install virtual display when needed
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Render exact accepted Building baseline
        run: |
          set -euo pipefail
          rm -rf environment-proof/generated
          mkdir -p environment-proof/generated
          cp evidence/environment_rear_tree_source_replacement_001/baseline_scene_runtime.json environment-proof/generated/scene_runtime.json
          rm -f environment-proof/environment-eye-level-runtime-receipt.json environment-proof/path_eye.png environment-proof/elevated_oblique.png
          xvfb-run --auto-servernum --server-args="-screen 0 1200x800x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --path environment-proof \
            --script observe.gd
          cp environment-proof/environment-eye-level-runtime-receipt.json evidence/environment_rear_tree_source_replacement_001/baseline_runtime_receipt.json
          cp environment-proof/path_eye.png evidence/environment_rear_tree_source_replacement_001/baseline_path_eye.png
          cp environment-proof/elevated_oblique.png evidence/environment_rear_tree_source_replacement_001/baseline_elevated_oblique.png

      - name: Render exact rear Nature candidate
        run: |
          set -euo pipefail
          rm -rf environment-proof/generated
          mkdir -p environment-proof/generated
          cp evidence/environment_rear_tree_source_replacement_001/candidate_scene_runtime.json environment-proof/generated/scene_runtime.json
          rm -f environment-proof/environment-eye-level-runtime-receipt.json environment-proof/path_eye.png environment-proof/elevated_oblique.png
          xvfb-run --auto-servernum --server-args="-screen 0 1200x800x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --path environment-proof \
            --script observe.gd
          cp environment-proof/environment-eye-level-runtime-receipt.json evidence/environment_rear_tree_source_replacement_001/candidate_runtime_receipt.json
          cp environment-proof/path_eye.png evidence/environment_rear_tree_source_replacement_001/candidate_path_eye.png
          cp environment-proof/elevated_oblique.png evidence/environment_rear_tree_source_replacement_001/candidate_elevated_oblique.png

      - name: Validate target-host evidence and retain render relations
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root=Path('evidence/environment_rear_tree_source_replacement_001')
          e=json.loads((root/'replacement_evidence.json').read_text())
          b=json.loads((root/'baseline_runtime_receipt.json').read_text())
          c=json.loads((root/'candidate_runtime_receipt.json').read_text())
          assert b['state']=='PASS_TARGET_HOST_ENVIRONMENT_OBSERVATION_READY',b
          assert c['state']=='PASS_TARGET_HOST_ENVIRONMENT_OBSERVATION_READY',c
          assert b['scene_digest']==e['baseline_scene_digest'],(b,e)
          assert c['scene_digest']==e['candidate_scene_digest'],(c,e)
          for context in ('path_eye','elevated_oblique'):
              brow=b['contexts'][context]
              crow=c['contexts'][context]
              assert brow['state']=='PASS',(context,brow)
              assert crow['state']=='PASS',(context,crow)
              assert len(brow['additional_source_meshes'])==2,(context,brow)
              assert len(crow['additional_source_meshes'])==3,(context,crow)
              rear=[row for row in crow['additional_source_meshes'] if row['asset_id']=='source:nature:east-rear-tree-neutral-001']
              assert len(rear)==1,(context,crow)
              assert rear[0]['vertices']==390,(context,rear[0])
              assert rear[0]['triangles']==570,(context,rear[0])
          names=(
              'baseline_path_eye.png','candidate_path_eye.png',
              'baseline_elevated_oblique.png','candidate_elevated_oblique.png'
          )
          hashes={name:hashlib.sha256((root/name).read_bytes()).hexdigest() for name in names}
          relations={
              'path_eye':'BYTE_DIFFERENT' if hashes['baseline_path_eye.png']!=hashes['candidate_path_eye.png'] else 'BYTE_IDENTICAL',
              'elevated_oblique':'BYTE_DIFFERENT' if hashes['baseline_elevated_oblique.png']!=hashes['candidate_elevated_oblique.png'] else 'BYTE_IDENTICAL',
          }
          assert relations['elevated_oblique']=='BYTE_DIFFERENT',relations
          comparison={
              'schema':'axm.environment-rear-tree-render-comparison/v0.1',
              'relations':relations,
              'hashes':hashes,
              'truth_boundary':'Hash difference confirms that this exact rear proxy-to-source replacement reaches the retained target-host image. It is not aesthetic, topology, material, deformation, or runtime acceptance.'
          }
          (root/'render_hashes.json').write_text(json.dumps(comparison,indent=2,sort_keys=True)+'\n')
          print(json.dumps(comparison,indent=2))
          PY

      - name: Upload exact rear Nature replacement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: environment-rear-tree-source-replacement-001-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            evidence/environment_rear_tree_source_replacement_001/exact-head.txt
            evidence/environment_rear_tree_source_replacement_001/replacement_evidence.json
            evidence/environment_rear_tree_source_replacement_001/baseline_scene_runtime.json
            evidence/environment_rear_tree_source_replacement_001/candidate_scene_runtime.json
            evidence/environment_rear_tree_source_replacement_001/baseline_runtime_receipt.json
            evidence/environment_rear_tree_source_replacement_001/candidate_runtime_receipt.json
            evidence/environment_rear_tree_source_replacement_001/render_hashes.json
            evidence/environment_rear_tree_source_replacement_001/baseline_path_eye.png
            evidence/environment_rear_tree_source_replacement_001/candidate_path_eye.png
            evidence/environment_rear_tree_source_replacement_001/baseline_elevated_oblique.png
            evidence/environment_rear_tree_source_replacement_001/candidate_elevated_oblique.png
          if-no-files-found: warn
          retention-days: 30
