name: Runtime Building compact-v2 current-world budget evidence

on:
  push:
    branches: [studio/runtime-building-compact-v2-current-world-budget-001]
    paths:
      - "tools/runtime_building_compact_v2_current_world_budget.py"
      - "docs/RUNTIME_BUILDING_COMPACT_V2_CURRENT_WORLD_BUDGET_001.md"
      - ".github/workflows/runtime-building-compact-v2-current-world-budget.yml"
  pull_request:
    paths:
      - "tools/runtime_building_compact_v2_current_world_budget.py"
      - "docs/RUNTIME_BUILDING_COMPACT_V2_CURRENT_WORLD_BUDGET_001.md"
      - ".github/workflows/runtime-building-compact-v2-current-world-budget.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  exact-current-world-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_ENV_HEAD: ef2cb9cc84edc10ab66c2230daca625623e0b00d
      PARENT_RUN_ID: "35179857526"
      PARENT_ARTIFACT_ID: "10478624997"
      COMPACT_RUN_ID: "35179857530"
      COMPACT_ARTIFACT_ID: "10480305129"
    steps:
      - name: Checkout exact Runtime head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact Environment ancestry and script
        run: |
          set -euo pipefail
          git rev-parse HEAD > exact-head.txt
          git cat-file -e "$BASE_ENV_HEAD^{commit}"
          git merge-base --is-ancestor "$BASE_ENV_HEAD" HEAD
          python -m py_compile tools/runtime_building_compact_v2_current_world_budget.py

      - name: Download exact current-world parent artifact
        uses: actions/download-artifact@v4
        with:
          repository: mike-axiom-mir/axm-map-design
          run-id: ${{ env.PARENT_RUN_ID }}
          artifact-ids: ${{ env.PARENT_ARTIFACT_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: evidence/parent

      - name: Download exact compact-v2 Environment artifact
        uses: actions/download-artifact@v4
        with:
          repository: mike-axiom-mir/axm-map-design
          run-id: ${{ env.COMPACT_RUN_ID }}
          artifact-ids: ${{ env.COMPACT_ARTIFACT_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: evidence/compact

      - name: Install bounded visual comparison dependency
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Verify exact evidence identities
        run: |
          set -euo pipefail
          test -f evidence/parent/candidate/runtime.json
          test -f evidence/compact/candidate/runtime.json
          python - <<'PY'
          import json
          p=json.load(open('evidence/compact/candidate/runtime.json'))
          assert p['environment_building_compact_v2_representation_id']=='boundary-only-union-shell-conforming-compact-v2-001',p
          assert p['environment_building_compact_v2_geometry_head']=='16253e7dd2f8cd590667f9631e4b50fdfcc7280d',p
          assert p['environment_building_compact_v2_hard_surface_head']=='35d0ba62d7e534b3cd00ac69e99386843ffa3f2e',p
          assert p['environment_building_compact_v2_materials_head']=='4179aa1401f5a9114399e2f998c96809d4b8ed2e',p
          PY

      - name: Compare actual current-world receiver cost and visuals
        run: |
          set -euo pipefail
          rm -rf evidence/runtime-report
          python tools/runtime_building_compact_v2_current_world_budget.py \
            --parent-root evidence/parent \
            --compact-root evidence/compact \
            --out evidence/runtime-report
          grep -F 'HOLD_CURRENT_WORLD_BUILDING_COMPACT_V2__RUNTIME_AND_VISUAL_REGRESSION' evidence/runtime-report/report.json
          grep -F '106560' evidence/runtime-report/report.json
          grep -F '5328' evidence/runtime-report/report.json

      - name: Fail closed if one runtime observation loses the measured regression
        run: |
          set -euo pipefail
          cp -a evidence/compact evidence/mutated
          python - <<'PY'
          import json
          p='evidence/mutated/candidate/runtime.json'
          d=json.load(open(p))
          row=d['samples'][0]['contexts']['path_eye']['control']['runtime']
          row['buffer_mem_bytes']-=106560
          row['primitives_in_frame']-=5328
          json.dump(d,open(p,'w'),indent=2,sort_keys=True)
          PY
          if python tools/runtime_building_compact_v2_current_world_budget.py \
            --parent-root evidence/parent \
            --compact-root evidence/mutated \
            --out evidence/mutated-report; then
            echo 'ERROR: mutated evidence unexpectedly passed' >&2
            exit 1
          fi

      - name: Retain bounded Runtime report
        uses: actions/upload-artifact@v4
        with:
          name: runtime-building-compact-v2-current-world-budget-${{ github.sha }}
          path: |
            exact-head.txt
            evidence/runtime-report/report.json
            evidence/runtime-report/report.md
            evidence/parent/candidate/runtime.json
            evidence/compact/candidate/runtime.json
          if-no-files-found: error
