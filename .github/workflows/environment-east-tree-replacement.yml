name: Environment east-tree replacement evidence

on:
  push:
    branches: [studio/environment-real-nature-weather-001]
    paths:
      - "examples/environment_east_tree_replacement_001.json"
      - "tools/environment_east_tree_replacement.py"
      - "tests/test_environment_east_tree_replacement.py"
      - "environment-proof/**"
      - "docs/ENVIRONMENT_EAST_TREE_REPLACEMENT_001.md"
      - ".github/workflows/environment-east-tree-replacement.yml"
      - "tools/environment_eye_level.py"
      - "tools/environment_real_slice.py"
      - "examples/environment_real_slice_001.json"
  pull_request:
    paths:
      - "examples/environment_east_tree_replacement_001.json"
      - "tools/environment_east_tree_replacement.py"
      - "tests/test_environment_east_tree_replacement.py"
      - "environment-proof/**"
      - "docs/ENVIRONMENT_EAST_TREE_REPLACEMENT_001.md"
      - ".github/workflows/environment-east-tree-replacement.yml"
      - "tools/environment_eye_level.py"
      - "tools/environment_real_slice.py"
      - "examples/environment_real_slice_001.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-east-tree-replacement:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Environment lane
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Checkout exact baseline Nature source
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-nature-design
          ref: fbc202449981f2bac153951c561ed0ed6120c936
          path: .nature-base

      - name: Checkout exact compact Nature source
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-nature-design
          ref: 64116d63fc76daa1623b5fd5046a4e6074100bda
          path: .nature-east

      - name: Checkout exact Weather source
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-weather-design
          ref: ca2eaba519e8449835b0ea6ef944b7080c3caa6a
          path: .weather

      - name: Compile and test bounded replacement contract
        run: |
          python -m compileall -q tools tests
          python -m unittest tests.test_environment_east_tree_replacement -v

      - name: Rebuild exact baseline and candidate payloads
        env:
          AXM_RECEIVING_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python tools/environment_east_tree_replacement.py \
            --base-nature-root .nature-base \
            --compact-nature-root .nature-east \
            --weather-root .weather \
            --output evidence/environment_east_tree_replacement_001

      - name: Validate replacement evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('evidence/environment_east_tree_replacement_001')
          e=json.loads((root/'replacement_evidence.json').read_text())
          b=json.loads((root/'baseline_scene_runtime.json').read_text())
          c=json.loads((root/'candidate_scene_runtime.json').read_text())
          assert e['status']=='PASS_EAST_FOREGROUND_SOURCE_REPLACEMENT_STRUCTURE',e
          assert all(e['checks'].values()),e
          assert e['receiving_head']==c['receiving_head'],(e,c)
          assert e['baseline_scene_digest']==b['scene_digest'],(e,b)
          assert e['candidate_scene_digest']==c['scene_digest'],(e,c)
          assert len(c['additional_source_meshes'])==1,c
          source=c['additional_source_meshes'][0]
          assert len(source['vertices_source_xyz_m'])==390,source
          assert len(source['triangles'])==570,source
          assert source['source_digest']=='9c87cf26f02f7adee832908652942218ec779c9029a0611aae1fb66eb0f62f54',source
          assert source['mesh_digest']=='c7367ed5dcea6ebe39869c48fd653845b25c9a8725a2e637a1d6f2fbee1fa32f',source
          assert not any(row['asset_id']=='proxy:nature-tree-east-b' for row in c['items']),c
          assert any(row['asset_id']=='proxy:nature-tree-east-b' for row in b['items']),b
          print(json.dumps(e,indent=2))
          PY

      - name: Download pinned Godot 4.7.2
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum --check --strict
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Install virtual display when needed
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Render exact baseline
        run: |
          set -euo pipefail
          rm -rf environment-proof/generated
          mkdir -p environment-proof/generated
          cp evidence/environment_east_tree_replacement_001/baseline_scene_runtime.json environment-proof/generated/scene_runtime.json
          rm -f environment-proof/environment-eye-level-runtime-receipt.json environment-proof/path_eye.png environment-proof/elevated_oblique.png
          xvfb-run --auto-servernum --server-args="-screen 0 1200x800x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --path environment-proof \
            --script observe.gd
          cp environment-proof/environment-eye-level-runtime-receipt.json evidence/environment_east_tree_replacement_001/baseline_runtime_receipt.json
          cp environment-proof/path_eye.png evidence/environment_east_tree_replacement_001/baseline_path_eye.png
          cp environment-proof/elevated_oblique.png evidence/environment_east_tree_replacement_001/baseline_elevated_oblique.png

      - name: Render exact candidate
        run: |
          set -euo pipefail
          rm -rf environment-proof/generated
          mkdir -p environment-proof/generated
          cp evidence/environment_east_tree_replacement_001/candidate_scene_runtime.json environment-proof/generated/scene_runtime.json
          rm -f environment-proof/environment-eye-level-runtime-receipt.json environment-proof/path_eye.png environment-proof/elevated_oblique.png
          xvfb-run --auto-servernum --server-args="-screen 0 1200x800x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --path environment-proof \
            --script observe.gd
          cp environment-proof/environment-eye-level-runtime-receipt.json evidence/environment_east_tree_replacement_001/candidate_runtime_receipt.json
          cp environment-proof/path_eye.png evidence/environment_east_tree_replacement_001/candidate_path_eye.png
          cp environment-proof/elevated_oblique.png evidence/environment_east_tree_replacement_001/candidate_elevated_oblique.png

      - name: Validate target-host A/B evidence only
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root=Path('evidence/environment_east_tree_replacement_001')
          e=json.loads((root/'replacement_evidence.json').read_text())
          b=json.loads((root/'baseline_runtime_receipt.json').read_text())
          c=json.loads((root/'candidate_runtime_receipt.json').read_text())
          assert b['state']=='PASS_TARGET_HOST_ENVIRONMENT_OBSERVATION_READY',b
          assert c['state']=='PASS_TARGET_HOST_ENVIRONMENT_OBSERVATION_READY',c
          assert b['scene_digest']==e['baseline_scene_digest'],(b,e)
          assert c['scene_digest']==e['candidate_scene_digest'],(c,e)
          for context in ('path_eye','elevated_oblique'):
              brow=b['contexts'][context]
              crow=c['contexts'][context]
              assert brow['state']=='PASS',(context,brow)
              assert crow['state']=='PASS',(context,crow)
              assert brow['additional_source_meshes']==[],(context,brow)
              assert len(crow['additional_source_meshes'])==1,(context,crow)
              mesh=crow['additional_source_meshes'][0]
              assert mesh['vertices']==390,(context,mesh)
              assert mesh['triangles']==570,(context,mesh)
              bp=(root/f'baseline_{context}.png').read_bytes()
              cp=(root/f'candidate_{context}.png').read_bytes()
              assert hashlib.sha256(bp).hexdigest()!=hashlib.sha256(cp).hexdigest(),context
          hashes={
              name:hashlib.sha256((root/name).read_bytes()).hexdigest()
              for name in (
                  'baseline_path_eye.png','candidate_path_eye.png',
                  'baseline_elevated_oblique.png','candidate_elevated_oblique.png'
              )
          }
          (root/'render_hashes.json').write_text(json.dumps(hashes,indent=2,sort_keys=True)+'\n')
          print(json.dumps(hashes,indent=2))
          PY

      - name: Upload exact east-tree replacement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: environment-east-tree-replacement-001-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            evidence/environment_east_tree_replacement_001/replacement_evidence.json
            evidence/environment_east_tree_replacement_001/baseline_scene_runtime.json
            evidence/environment_east_tree_replacement_001/candidate_scene_runtime.json
            evidence/environment_east_tree_replacement_001/baseline_runtime_receipt.json
            evidence/environment_east_tree_replacement_001/candidate_runtime_receipt.json
            evidence/environment_east_tree_replacement_001/render_hashes.json
            evidence/environment_east_tree_replacement_001/baseline_path_eye.png
            evidence/environment_east_tree_replacement_001/candidate_path_eye.png
            evidence/environment_east_tree_replacement_001/baseline_elevated_oblique.png
            evidence/environment_east_tree_replacement_001/candidate_elevated_oblique.png
          if-no-files-found: warn
          retention-days: 30
