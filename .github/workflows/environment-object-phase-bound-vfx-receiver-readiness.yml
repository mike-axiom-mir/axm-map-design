name: Environment Object phase-bound VFX receiver readiness

on:
  push:
    branches: [studio/environment-weather-variant-object-convergence-001]
    paths:
      - "contracts/environment_object_phase_bound_vfx_receiver_readiness.json"
      - "tools/environment_object_phase_bound_vfx_receiver_readiness.py"
      - "docs/ENVIRONMENT_OBJECT_PHASE_BOUND_VFX_RECEIVER_READINESS_001.md"
      - ".github/workflows/environment-object-phase-bound-vfx-receiver-readiness.yml"
  pull_request:
    paths:
      - "contracts/environment_object_phase_bound_vfx_receiver_readiness.json"
      - "tools/environment_object_phase_bound_vfx_receiver_readiness.py"
      - "docs/ENVIRONMENT_OBJECT_PHASE_BOUND_VFX_RECEIVER_READINESS_001.md"
      - ".github/workflows/environment-object-phase-bound-vfx-receiver-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  exact-receiver-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact Environment head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bind exact Environment lineage and validate verifier
        run: |
          set -euo pipefail
          git rev-parse HEAD > exact-head.txt
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git cat-file -e d0461a787525d19004d83334c282adacaa06afed^{commit}
          git merge-base --is-ancestor d0461a787525d19004d83334c282adacaa06afed HEAD
          python -m py_compile tools/environment_object_phase_bound_vfx_receiver_readiness.py
          python -m json.tool contracts/environment_object_phase_bound_vfx_receiver_readiness.json >/dev/null

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download exact retained multi-asset current-world parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root=evidence/environment_object_phase_bound_vfx_receiver_readiness_001
          mkdir -p "$root/parent"
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/mike-axiom-mir/axm-map-design/actions/artifacts/10516853353/zip" \
            --output "$root/parent.zip"
          echo "f879277d1e4b3c37b9a7fc491d992e520345a8642f56d0ae17abfcd9957444c0  $root/parent.zip" | sha256sum --check --strict
          unzip -q "$root/parent.zip" -d "$root/parent"
          test -f "$root/parent/report.json"
          test -f "$root/parent/candidate/runtime.json"
          python - <<'PY'
          import json
          p=json.load(open('evidence/environment_object_phase_bound_vfx_receiver_readiness_001/parent/report.json'))
          assert p['environment_head']=='d0461a787525d19004d83334c282adacaa06afed',p
          assert p['state']=='PASS_CURRENT_WORLD_BUILDING_UTILITY_PANEL_CLEARANCE_REBIND_RECEIVER__VISUAL_OBSERVABILITY_CHARACTERIZED__ADOPTION_HELD',p
          assert p['real_world_scope']['matched_frames']==68,p
          assert p['runtime_continuity']['building_rebound_states']==17,p
          assert p['runtime_continuity']['object_roughness_exact_states']==17,p
          assert p['runtime_continuity']['compact_east_phase_indices']==list(range(17)),p
          assert p['runtime_continuity']['weather_width_measurements']==1224,p
          print('PASS_EXACT_RETAINED_MULTI_ASSET_PARENT')
          PY

      - name: Checkout exact Object VFX/Animation donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-object-design
          ref: 5f8b7bef1a8a0d1babeba7945962c83cd938529b
          path: .object-vfx
          fetch-depth: 1

      - name: Verify exact Object source, builder, VFX and Animation identities
        run: |
          set -euo pipefail
          test "$(git -C .object-vfx rev-parse HEAD)" = "5f8b7bef1a8a0d1babeba7945962c83cd938529b"
          test "$(git -C .object-vfx rev-parse HEAD:assets/modular-equipment-case-001/source.json)" = "018e36bb08539f212d2c65e6408566e3540fd983"
          test "$(git -C .object-vfx rev-parse HEAD:tools/build_modular_case.py)" = "55c03ceb38e337b2bdc31bb66795d25f5bfbac10"
          test "$(git -C .object-vfx rev-parse HEAD:assets/modular-equipment-case-001/lid-open-release-motes-001.json)" = "83c41db21e16847ac0a69215facd8697853eeb4f"
          test "$(git -C .object-vfx rev-parse HEAD:assets/modular-equipment-case-001/lid-latch-motion-sequence-001.json)" = "d79a4063944b98d66d3667220b58d60d99e489a1"
          python - <<'PY'
          import json
          root='.object-vfx/assets/modular-equipment-case-001'
          source=json.load(open(f'{root}/source.json'))
          effect=json.load(open(f'{root}/lid-open-release-motes-001.json'))
          sequence=json.load(open(f'{root}/lid-latch-motion-sequence-001.json'))
          expected='49b1f9ed9865893d6de6f1ec8f069576732df694853fde4e3fcff366de32644a'
          assert effect['source_sha256']==expected,effect
          assert sequence['host_source_sha256']==expected,sequence
          assert effect['animation_dependency']['trigger_time_s']==0.25,effect
          assert effect['visual_source']['seed']==41027,effect
          assert sequence['phases'][1]['id']=='play_exact_lid_clip' and sequence['phases'][1]['start_s']==0.25,sequence
          print('PASS_EXACT_OBJECT_VFX_ANIMATION_DONOR_IDENTITIES')
          PY

      - name: Verify current-world phase-bound VFX receiver readiness
        run: |
          set -euo pipefail
          root=evidence/environment_object_phase_bound_vfx_receiver_readiness_001
          python tools/environment_object_phase_bound_vfx_receiver_readiness.py verify \
            --contract contracts/environment_object_phase_bound_vfx_receiver_readiness.json \
            --parent-report "$root/parent/report.json" \
            --parent-runtime "$root/parent/candidate/runtime.json" \
            --object-root .object-vfx \
            --environment-head "$(cat exact-head.txt)" \
            --output "$root/report.json" \
            | tee "$root/verify.log"
          python - <<'PY'
          import json
          p=json.load(open('evidence/environment_object_phase_bound_vfx_receiver_readiness_001/report.json'))
          assert p['state']=='HOLD_CURRENT_WORLD_OBJECT_PHASE_BOUND_VFX_RECEIVER__STATIC_HOST_LACKS_ANIMATION_OWNED_COMPONENT_BOUNDARY',p
          assert p['parent_current_world']['matched_real_scene_frames']==68,p
          assert p['parent_current_world']['world_states']==17,p
          assert p['parent_current_world']['weather_width_measurements']==1224,p
          assert p['cross_repo_identity']['owner_seed']==41027,p
          assert p['cross_repo_identity']['trigger_time_s']==0.25,p
          assert p['current_world_object_receiver']['states_verified']==17,p
          assert p['current_world_object_receiver']['animation_owned_component_boundary_present'] is False,p
          assert p['current_world_object_receiver']['phase_bound_vfx_receiver_ready'] is False,p
          assert p['environment_adoption'] is False and p['vfx_adoption'] is False and p['animation_adoption'] is False,p
          assert all(p['checks'].values()),p
          print(p['state'])
          PY

      - name: Negative control rejects VFX source identity drift
        run: |
          set -euo pipefail
          root=evidence/environment_object_phase_bound_vfx_receiver_readiness_001
          effect=.object-vfx/assets/modular-equipment-case-001/lid-open-release-motes-001.json
          cp "$effect" "$root/effect.before-negative.json"
          python - <<'PY'
          import json
          p='.object-vfx/assets/modular-equipment-case-001/lid-open-release-motes-001.json'
          d=json.load(open(p))
          d['source_sha256']='0'*64
          open(p,'w').write(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
          set +e
          python tools/environment_object_phase_bound_vfx_receiver_readiness.py verify \
            --contract contracts/environment_object_phase_bound_vfx_receiver_readiness.json \
            --parent-report "$root/parent/report.json" \
            --parent-runtime "$root/parent/candidate/runtime.json" \
            --object-root .object-vfx \
            --environment-head "$(cat exact-head.txt)" \
            --output "$root/negative-report.json" \
            > "$root/negative.log" 2>&1
          code=$?
          set -e
          test "$code" -ne 0
          grep -q "VFX source identity drift" "$root/negative.log"
          cp "$root/effect.before-negative.json" "$effect"
          echo "PASS_REJECTED_MUTATED_VFX_SOURCE_IDENTITY"

      - name: Retain bounded receiver-readiness evidence
        if: always()
        run: |
          set -euo pipefail
          root=evidence/environment_object_phase_bound_vfx_receiver_readiness_001
          out="$root/retained"
          mkdir -p "$out/donor-receipts"
          cp exact-head.txt "$out/exact-head.txt" 2>/dev/null || true
          cp contracts/environment_object_phase_bound_vfx_receiver_readiness.json "$out/" 2>/dev/null || true
          cp docs/ENVIRONMENT_OBJECT_PHASE_BOUND_VFX_RECEIVER_READINESS_001.md "$out/" 2>/dev/null || true
          cp "$root/report.json" "$out/report.json" 2>/dev/null || true
          cp "$root/verify.log" "$out/verify.log" 2>/dev/null || true
          cp "$root/negative.log" "$out/negative-control.log" 2>/dev/null || true
          cp "$root/parent/report.json" "$out/donor-receipts/current-world-parent-report.json" 2>/dev/null || true
          cp .object-vfx/assets/modular-equipment-case-001/source.json "$out/donor-receipts/" 2>/dev/null || true
          cp .object-vfx/assets/modular-equipment-case-001/lid-open-release-motes-001.json "$out/donor-receipts/" 2>/dev/null || true
          cp .object-vfx/assets/modular-equipment-case-001/lid-latch-motion-sequence-001.json "$out/donor-receipts/" 2>/dev/null || true

      - name: Upload exact Environment Object phase-bound VFX receiver-readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: environment-object-phase-bound-vfx-receiver-readiness-001-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/environment_object_phase_bound_vfx_receiver_readiness_001/retained
          if-no-files-found: error
          retention-days: 30
