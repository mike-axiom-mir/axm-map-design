name: Environment current-world Building header segmentation evidence

on:
  push:
    branches: [studio/environment-weather-variant-object-convergence-001]
    paths:
      - "tools/environment_building_header_segmentation_current_world.py"
      - "environment-proof/atmosphere_current_world_building_header_segmentation_observe.gd"
      - "docs/ENVIRONMENT_BUILDING_HEADER_SEGMENTATION_CURRENT_WORLD_001.md"
      - ".github/workflows/environment-building-header-segmentation-current-world.yml"
  pull_request:
    paths:
      - "tools/environment_building_header_segmentation_current_world.py"
      - "environment-proof/atmosphere_current_world_building_header_segmentation_observe.gd"
      - "docs/ENVIRONMENT_BUILDING_HEADER_SEGMENTATION_CURRENT_WORLD_001.md"
      - ".github/workflows/environment-building-header-segmentation-current-world.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  exact-environment-building-header-segmentation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact Environment lane head with ancestry
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bind exact Environment parent ancestry
        run: |
          set -euo pipefail
          git rev-parse HEAD > exact-head.txt
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git cat-file -e a29aa1e3d2260e8eb5ab2ac78a95d35ce131214c^{commit}
          git merge-base --is-ancestor a29aa1e3d2260e8eb5ab2ac78a95d35ce131214c HEAD
          python -m py_compile tools/environment_building_header_segmentation_current_world.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install image measurement dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy

      - name: Checkout exact Building source authority
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-building-design
          ref: 34124101e616c423c5a3ed5e122ddf09b98a1650
          path: .building-donor
          fetch-depth: 1

      - name: Checkout exact Building Materials authority
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-building-design
          ref: 09a534d9d6d4cdaa1bab70cc2d01345b48d8fcc8
          path: .materials-donor
          fetch-depth: 1

      - name: Checkout exact inherited Weather-width observer donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-map-design
          ref: 15a03b7c3ba3aaa7c0475ca1a3091c15581f559b
          path: .vfx-width-donor
          fetch-depth: 1

      - name: Verify exact donor heads and source-owned segmentation
        run: |
          set -euo pipefail
          test "$(git -C .building-donor rev-parse HEAD)" = 34124101e616c423c5a3ed5e122ddf09b98a1650
          test "$(git -C .materials-donor rev-parse HEAD)" = 09a534d9d6d4cdaa1bab70cc2d01345b48d8fcc8
          test "$(git -C .vfx-width-donor rev-parse HEAD)" = 15a03b7c3ba3aaa7c0475ca1a3091c15581f559b
          out=evidence/environment_building_header_segmentation_001
          mkdir -p "$out/source-donor"
          python .building-donor/tools/build_service_pavilion_header_segmentation.py \
            --exact-head 34124101e616c423c5a3ed5e122ddf09b98a1650 \
            --output-dir "$out/source-donor"
          python - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path('evidence/environment_building_header_segmentation_001/source-donor/receipt.json').read_text())
          assert receipt['result']=='PASS_SOURCE_OWNED_INTERPENETRATION_FREE_HEADER_SEGMENTATION_OVERLAY',receipt
          assert receipt['exact_hard_surface_head']=='34124101e616c423c5a3ed5e122ddf09b98a1650',receipt
          assert receipt['source_positive_volume_intersection_count']==4,receipt
          assert receipt['source_positive_double_covered_volume_m3']==0.02592,receipt
          assert receipt['successor_positive_volume_intersection_count']==0,receipt
          assert receipt['occupied_union']['equivalent'] is True and receipt['occupied_union']['volume_residual_m3']==0.0,receipt
          assert receipt['topology']['object_count']==23 and receipt['topology']['vertex_count']==184 and receipt['topology']['triangle_count']==276,receipt
          print('PASS_EXACT_BUILDING_HEADER_SEGMENTATION_SOURCE_DONOR')
          PY

      - name: Download exact retained Object-dressed Environment parent evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out=evidence/environment_building_header_segmentation_001
          mkdir -p "$out/parent"
          curl --fail --location --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/10458660039/zip" \
            --output "$out/parent.zip"
          echo "af49a1c6a3ce319826be5dc02c6b42d4c3b131a8a76f98c19a4939299e44372e  $out/parent.zip" | sha256sum --check --strict
          unzip -q "$out/parent.zip" -d "$out/parent"
          test "$(cat "$out/parent/exact-head.txt" | tr -d '\n\r')" = a29aa1e3d2260e8eb5ab2ac78a95d35ce131214c
          test -f "$out/parent/combined_current_world.json"
          test -f "$out/parent/target_host.json"
          test -d "$out/parent/rendered"

      - name: Verify exact retained parent acceptance surface
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('evidence/environment_building_header_segmentation_001/parent')
          payload=json.loads((root/'combined_current_world.json').read_text())
          target=json.loads((root/'target_host.json').read_text())
          assert payload['schema']=='axm.environment-current-world-object-readability-dressing-composition/v0.1',payload
          assert payload['status']=='PASS_CURRENT_WORLD_OBJECT_READABILITY_DRESSING_STRUCTURE' and all(payload['checks'].values()),payload
          assert payload['receiving_head']=='a29aa1e3d2260e8eb5ab2ac78a95d35ce131214c',payload
          assert payload['composition_digest']=='8e22d33400effef66f5af79a19229cd5a4370d2a68563ecd1432f4ccb480b815',payload
          assert target['state']=='PASS_CURRENT_WORLD_OBJECT_READABILITY_DRESSING_TARGET_HOST' and all(target['checks'].values()),target
          assert target['receiving_head']=='a29aa1e3d2260e8eb5ab2ac78a95d35ce131214c',target
          print('PASS_EXACT_OBJECT_DRESSED_ENVIRONMENT_PARENT')
          PY

      - name: Build exact current-world Building header-segmentation successor
        run: |
          set -euo pipefail
          out=evidence/environment_building_header_segmentation_001
          mkdir -p environment-proof/generated
          python tools/environment_building_header_segmentation_current_world.py build \
            --environment "$out/parent/combined_current_world.json" \
            --building-source-root .building-donor \
            --material-profile .materials-donor/lookdev/building_material_profile_001.json \
            --source-head 34124101e616c423c5a3ed5e122ddf09b98a1650 \
            --material-head 09a534d9d6d4cdaa1bab70cc2d01345b48d8fcc8 \
            --receiving-head "$(cat exact-head.txt)" \
            --output "$out/combined_current_world.json"
          cp exact-head.txt "$out/exact-head.txt"
          cp "$out/combined_current_world.json" environment-proof/generated/current_world_building_header_segmentation.json
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('evidence/environment_building_header_segmentation_001')
          payload=json.loads((root/'combined_current_world.json').read_text())
          assert payload['status']=='PASS_CURRENT_WORLD_BUILDING_HEADER_SEGMENTATION_STRUCTURE' and all(payload['checks'].values()),payload
          assert payload['receiving_head']==(root/'exact-head.txt').read_text().strip(),payload
          assert len(payload['states'])==17,payload
          seg=payload['building_header_segmentation']
          assert seg['source_positive_volume_intersection_count']==4,seg
          assert seg['source_positive_double_covered_volume_m3']==0.02592,seg
          assert seg['successor_positive_volume_intersection_count']==0,seg
          assert seg['occupied_union']['equivalent'] is True and seg['occupied_union']['volume_residual_m3']==0.0,seg
          assert seg['topology']['object_count']==23 and seg['topology']['vertex_count']==184 and seg['topology']['triangle_count']==276,seg
          print(json.dumps({'status':payload['status'],'composition_digest':payload['composition_digest'],'role_box_counts':seg['role_box_counts']},indent=2))
          PY

      - name: Exercise fail-closed receiving controls
        run: |
          python - <<'PY'
          import copy,json
          from pathlib import Path
          import tools.environment_building_header_segmentation_current_world as m
          root=Path('evidence/environment_building_header_segmentation_001')
          parent=json.loads((root/'parent/combined_current_world.json').read_text())
          profile=json.loads(Path('.materials-donor/lookdev/building_material_profile_001.json').read_text())
          profile['_profile_path']=str(Path('.materials-donor/lookdev/building_material_profile_001.json'))
          cases=[]
          bad=copy.deepcopy(parent); bad['receiving_head']='drifted'; cases.append(('parent head drift',bad,profile,m.SOURCE_HEAD,m.MATERIAL_HEAD))
          bad=copy.deepcopy(parent); bad['states'][0]['scene']['environment_building_material_receiving']['vertices_source_xyz_m'][0][0]+=0.001; cases.append(('current Building placement drift',bad,profile,m.SOURCE_HEAD,m.MATERIAL_HEAD))
          bad_profile=copy.deepcopy(profile); bad_profile['successor_representation_materials']['emitted_component_materials'].pop('front-header::segment-1'); cases.append(('missing explicit segment material binding',parent,bad_profile,m.SOURCE_HEAD,m.MATERIAL_HEAD))
          cases.append(('source head drift',parent,profile,'drifted',m.MATERIAL_HEAD))
          for label,environment,material,source_head,material_head in cases:
              try:
                  m.build(environment,'.building-donor',material,source_head,material_head,'NEGATIVE')
              except ValueError:
                  print('PASS_NEGATIVE_CONTROL',label)
              else:
                  raise AssertionError(label)
          PY

      - name: Install exact inherited Weather-width observer into proof host
        run: |
          set -euo pipefail
          cp .vfx-width-donor/environment-proof/atmosphere_current_world_weather_width_observe.gd environment-proof/atmosphere_current_world_weather_width_observe.gd
          test -f environment-proof/atmosphere_current_world_building_infill_weather_width_observe.gd
          test -f environment-proof/atmosphere_current_world_object_readability_dressing_observe.gd
          test -f environment-proof/atmosphere_current_world_building_header_segmentation_observe.gd

      - name: Download pinned Godot 4.7.2
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum --check --strict
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Install virtual display when needed
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Observe exact segmented Building in real Godot current world
        run: |
          set -euo pipefail
          out=evidence/environment_building_header_segmentation_001
          rm -f environment-proof/atmosphere-width-*.png environment-proof/atmosphere-current-world-weather-width-runtime.json
          set +e
          xvfb-run --auto-servernum --server-args="-screen 0 1200x800x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --path environment-proof \
            --script atmosphere_current_world_building_header_segmentation_observe.gd \
            2>&1 | tee "$out/godot.log"
          status=${PIPESTATUS[0]}
          set -e
          cp environment-proof/atmosphere-current-world-weather-width-runtime.json "$out/runtime.json" 2>/dev/null || true
          exit "$status"

      - name: Verify all-state full-world receiving continuity
        run: |
          set -euo pipefail
          out=evidence/environment_building_header_segmentation_001
          python tools/environment_building_header_segmentation_current_world.py verify \
            --payload "$out/combined_current_world.json" \
            --receipt "$out/runtime.json" \
            --image-root environment-proof \
            --parent-frame-root "$out/parent/rendered" \
            --parent-report "$out/parent/target_host.json" \
            --output "$out/target_host.json"
          python - <<'PY'
          import json
          from pathlib import Path
          target=json.loads(Path('evidence/environment_building_header_segmentation_001/target_host.json').read_text())
          assert target['state']=='PASS_CURRENT_WORLD_BUILDING_HEADER_SEGMENTATION_TARGET_HOST' and all(target['checks'].values()),target
          assert target['measured_width_count']==1224,target
          assert target['pair_counts']=={'elevated_oblique':34,'path_eye':34},target
          assert target['maximum_rgb_channel_delta_lsb']<=1,target
          print(json.dumps({
              'state':target['state'],
              'maximum_projected_width_residual_px':target['maximum_projected_width_residual_px'],
              'changed_pixel_counts':target['changed_pixel_counts'],
              'significant_pixel_counts_gt_1_lsb':target['significant_pixel_counts_gt_1_lsb'],
              'maximum_rgb_channel_delta_lsb':target['maximum_rgb_channel_delta_lsb'],
              'runtime_counter_delta_vs_parent':target['runtime_counter_delta_vs_parent_order_draw_objects_primitives_buffer_texture'],
          },indent=2))
          PY

      - name: Retain exact candidate frames
        if: always()
        run: |
          out=evidence/environment_building_header_segmentation_001
          mkdir -p "$out/rendered"
          cp environment-proof/atmosphere-width-*.png "$out/rendered/" 2>/dev/null || true
          rm -rf "$out/parent" "$out/parent.zip"

      - name: Upload retained Environment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: environment-building-header-segmentation-001-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/environment_building_header_segmentation_001
          if-no-files-found: error
          retention-days: 30
