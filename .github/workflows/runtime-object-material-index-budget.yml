name: Runtime Object material indexed-surface budget evidence

on:
  push:
    branches: [studio/runtime-object-material-index-budget-001]
    paths:
      - "environment-proof/atmosphere_current_world_object_material_index_budget_observe.gd"
      - "tools/runtime_object_material_index_budget.py"
      - "docs/RUNTIME_OBJECT_MATERIAL_INDEX_BUDGET_001.md"
      - ".github/workflows/runtime-object-material-index-budget.yml"
  pull_request:
    paths:
      - "environment-proof/atmosphere_current_world_object_material_index_budget_observe.gd"
      - "tools/runtime_object_material_index_budget.py"
      - "docs/RUNTIME_OBJECT_MATERIAL_INDEX_BUDGET_001.md"
      - ".github/workflows/runtime-object-material-index-budget.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  exact-object-index-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact Runtime lane head with ancestry
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bind exact preferred Object-material world
        run: |
          set -euo pipefail
          git rev-parse HEAD > exact-head.txt
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git cat-file -e 6575cc38db9f0f62b14a82b352d8582edf89856d^{commit}
          git merge-base --is-ancestor 6575cc38db9f0f62b14a82b352d8582edf89856d HEAD
          python -m py_compile tools/runtime_object_material_index_budget.py
          grep -F 'st.index()' environment-proof/atmosphere_current_world_object_material_index_budget_observe.gd

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download exact preferred Object-material Environment evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out=evidence/runtime_object_material_index_budget_001
          mkdir -p "$out/parent" environment-proof/generated
          curl --fail --location --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/10466065113/zip" \
            --output "$out/parent.zip"
          echo "87dd366302e94b5a6f8241e110e9629c2d81a0d7321197b14a52b860642fd519  $out/parent.zip" | sha256sum --check --strict
          unzip -q "$out/parent.zip" -d "$out/parent"
          test "$(cat "$out/parent/exact-head.txt" | tr -d '\n\r')" = 6575cc38db9f0f62b14a82b352d8582edf89856d
          test -f "$out/parent/combined_current_world.json"
          test -f "$out/parent/runtime.json"
          test -f "$out/parent/target_host.json"
          cp "$out/parent/combined_current_world.json" environment-proof/generated/current_world_object_material_family.json

      - name: Verify exact parent acceptance surface
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('evidence/runtime_object_material_index_budget_001/parent')
          p=json.loads((root/'combined_current_world.json').read_text())
          t=json.loads((root/'target_host.json').read_text())
          assert p['receiving_head']=='6575cc38db9f0f62b14a82b352d8582edf89856d',p
          assert p['composition_digest']=='677dfe17afe49bf3f6edc28359c40a8add3dc357cb918529f0015a99f71baf70',p
          assert p['status']=='PASS_CURRENT_WORLD_OBJECT_MATERIAL_FAMILY_STRUCTURE' and all(p['checks'].values()),p
          assert t['state']=='PASS_CURRENT_WORLD_OBJECT_MATERIAL_FAMILY_TARGET_HOST' and all(t['checks'].values()),t
          print('PASS_EXACT_PREFERRED_OBJECT_MATERIAL_PARENT')
          PY

      - name: Install exact inherited Weather-width observer into proof host
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-map-design
          ref: 15a03b7c3ba3aaa7c0475ca1a3091c15581f559b
          path: .vfx-width-donor
          fetch-depth: 1

      - name: Verify proof-host inheritance chain
        run: |
          set -euo pipefail
          test "$(git -C .vfx-width-donor rev-parse HEAD)" = 15a03b7c3ba3aaa7c0475ca1a3091c15581f559b
          cp .vfx-width-donor/environment-proof/atmosphere_current_world_weather_width_observe.gd environment-proof/atmosphere_current_world_weather_width_observe.gd
          test -f environment-proof/atmosphere_current_world_building_infill_weather_width_observe.gd
          test -f environment-proof/atmosphere_current_world_object_readability_dressing_observe.gd
          test -f environment-proof/atmosphere_current_world_building_header_segmentation_observe.gd
          test -f environment-proof/atmosphere_current_world_nature_material_family_observe.gd
          test -f environment-proof/atmosphere_current_world_object_material_family_observe.gd
          test -f environment-proof/atmosphere_current_world_object_material_index_budget_observe.gd

      - name: Download pinned Godot 4.7.2
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum --check --strict
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Install virtual display when needed
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y xvfb; fi

      - name: Observe exact unindexed control
        env:
          AXM_RUNTIME_OBJECT_INDEX_MODE: UNINDEXED_CONTROL
        run: |
          set -euo pipefail
          out=evidence/runtime_object_material_index_budget_001/control
          mkdir -p "$out/rendered"
          rm -f environment-proof/atmosphere-width-*.png environment-proof/atmosphere-current-world-weather-width-runtime.json
          set +e
          xvfb-run --auto-servernum --server-args="-screen 0 1200x800x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 --rendering-method gl_compatibility \
            --path environment-proof --script atmosphere_current_world_object_material_index_budget_observe.gd \
            2>&1 | tee "$out/godot.log"
          status=${PIPESTATUS[0]}; set -e
          cp environment-proof/atmosphere-current-world-weather-width-runtime.json "$out/runtime.json" 2>/dev/null || true
          cp environment-proof/atmosphere-width-*.png "$out/rendered/" 2>/dev/null || true
          exit "$status"

      - name: Observe exact indexed candidate
        env:
          AXM_RUNTIME_OBJECT_INDEX_MODE: INDEXED_CANDIDATE
        run: |
          set -euo pipefail
          out=evidence/runtime_object_material_index_budget_001/candidate
          mkdir -p "$out/rendered"
          rm -f environment-proof/atmosphere-width-*.png environment-proof/atmosphere-current-world-weather-width-runtime.json
          set +e
          xvfb-run --auto-servernum --server-args="-screen 0 1200x800x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 --rendering-method gl_compatibility \
            --path environment-proof --script atmosphere_current_world_object_material_index_budget_observe.gd \
            2>&1 | tee "$out/godot.log"
          status=${PIPESTATUS[0]}; set -e
          cp environment-proof/atmosphere-current-world-weather-width-runtime.json "$out/runtime.json" 2>/dev/null || true
          cp environment-proof/atmosphere-width-*.png "$out/rendered/" 2>/dev/null || true
          exit "$status"

      - name: Verify exact representation A/B
        run: |
          set -euo pipefail
          out=evidence/runtime_object_material_index_budget_001
          python tools/runtime_object_material_index_budget.py \
            --control-receipt "$out/control/runtime.json" \
            --candidate-receipt "$out/candidate/runtime.json" \
            --control-root "$out/control/rendered" \
            --candidate-root "$out/candidate/rendered" \
            --output "$out/report.json"
          cp exact-head.txt "$out/exact-head.txt"

      - name: Exercise fail-closed vertex-reduction control
        run: |
          set -euo pipefail
          out=evidence/runtime_object_material_index_budget_001
          cp "$out/candidate/runtime.json" "$out/candidate/runtime-mutated.json"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('evidence/runtime_object_material_index_budget_001/candidate/runtime-mutated.json')
          data=json.loads(p.read_text())
          row=next(x for x in data['static_source_meshes'] if x.get('asset_id')=='source:object:modular-equipment-case-001')
          d=row['runtime_surface_indexing']
          d['after']['total_vertices']=d['before']['total_vertices']
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
          if python tools/runtime_object_material_index_budget.py \
            --control-receipt "$out/control/runtime.json" \
            --candidate-receipt "$out/candidate/runtime-mutated.json" \
            --control-root "$out/control/rendered" \
            --candidate-root "$out/candidate/rendered" \
            --output "$out/should-not-pass.json"; then
            echo 'negative control unexpectedly passed' >&2
            exit 1
          fi
          echo PASS_FAIL_CLOSED_VERTEX_REDUCTION_CONTROL
          rm -f "$out/should-not-pass.json"

      - name: Remove downloaded parent duplicate before upload
        if: always()
        run: |
          rm -rf evidence/runtime_object_material_index_budget_001/parent
          rm -f evidence/runtime_object_material_index_budget_001/parent.zip

      - name: Upload retained Runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-object-material-index-budget-001-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/runtime_object_material_index_budget_001
          if-no-files-found: error
          retention-days: 30
