name: Environment Building planar-role consumer identity rebind evidence

on:
  push:
    branches: [studio/environment-weather-variant-object-convergence-001]
    paths:
      - "contracts/environment_building_planar_role_consumer_identity.json"
      - "tools/environment_building_planar_role_consumer_identity_rebind.py"
      - "docs/ENVIRONMENT_BUILDING_PLANAR_ROLE_CONSUMER_IDENTITY_REBIND_001.md"
      - ".github/workflows/environment-building-planar-role-consumer-identity-rebind.yml"
  pull_request:
    paths:
      - "contracts/environment_building_planar_role_consumer_identity.json"
      - "tools/environment_building_planar_role_consumer_identity_rebind.py"
      - "docs/ENVIRONMENT_BUILDING_PLANAR_ROLE_CONSUMER_IDENTITY_REBIND_001.md"
      - ".github/workflows/environment-building-planar-role-consumer-identity-rebind.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  consumer-identity-rebind-current-world:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SOURCE_SPLIT_HEAD: 0caa9ac9644f027350935240476bd0bf3bb66e18
      RUNTIME_DONOR_HEAD: 8d5860c308c244d314ede5b79021e46f35c4040d
      UNINDEXED_ENVIRONMENT_HEAD: b758f9ca006ec5885ff1c2c52e2fb09e9ccdd464
      ACTIVE_HEAD: 7713cbe5863c3bc38dabb6236eb4b393401224b6
      WEATHER_WIDTH_OBSERVER_HEAD: 15a03b7c3ba3aaa7c0475ca1a3091c15581f559b
      ACTIVE_RUN: "35174899697"
      ACTIVE_ARTIFACT_NAME: environment-nature-leaf-flutter-current-world-001-7713cbe5863c3bc38dabb6236eb4b393401224b6
      UNINDEXED_RUN: "35182784756"
      UNINDEXED_ARTIFACT_NAME: environment-building-planar-role-current-world-001-b758f9ca006ec5885ff1c2c52e2fb09e9ccdd464
    steps:
      - name: Checkout exact Environment head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bind exact Environment receiver and gate
        run: |
          set -euo pipefail
          git rev-parse HEAD > exact-head.txt
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git cat-file -e "$RUNTIME_DONOR_HEAD^{commit}"
          git cat-file -e "$UNINDEXED_ENVIRONMENT_HEAD^{commit}"
          git merge-base --is-ancestor "$UNINDEXED_ENVIRONMENT_HEAD" HEAD
          git merge-base --is-ancestor "$RUNTIME_DONOR_HEAD" HEAD
          python -m py_compile tools/runtime_building_planar_role_surface_index_budget.py
          python -m py_compile tools/environment_building_planar_role_consumer_identity_rebind.py
          grep -F 'map-consumer:service-pavilion-001:planar-role-post-normal-indexed-001' contracts/environment_building_planar_role_consumer_identity.json
          grep -F 'st.index()' environment-proof/atmosphere_current_world_building_planar_role_surface_index_observe.gd

      - name: Rebuild exact Building source-owner split evidence
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-building-design
          ref: ${{ env.SOURCE_SPLIT_HEAD }}
          path: .building-source-owner
          fetch-depth: 1

      - name: Verify exact Building source-owner split domain
        run: |
          set -euo pipefail
          test "$(git -C .building-source-owner rev-parse HEAD)" = "$SOURCE_SPLIT_HEAD"
          mkdir -p evidence/environment_building_planar_role_consumer_identity_rebind_001/source-owner
          python .building-source-owner/tools/verify_service_pavilion_planar_role_render_split_policy.py \
            --exact-head "$SOURCE_SPLIT_HEAD" \
            --output-dir evidence/environment_building_planar_role_consumer_identity_rebind_001/source-owner
          python - <<'PY'
          import json
          p=json.load(open('evidence/environment_building_planar_role_consumer_identity_rebind_001/source-owner/render-split-evidence.json'))
          assert p['result']=='PASS_SOURCE_OWNED_PLANAR_ROLE_RENDER_SPLIT_INTENT',p
          assert p['source_intent']['triangle_corner_count']==1008,p
          assert p['source_intent']['equivalence_group_count']==604,p
          print('PASS_EXACT_604_GROUP_SOURCE_OWNER_SPLIT_DOMAIN')
          PY

      - name: Download exact active segmented current-world evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ACTIVE_ARTIFACT_NAME }}
          path: evidence/environment_building_planar_role_consumer_identity_rebind_001/active
          github-token: ${{ github.token }}
          run-id: ${{ env.ACTIVE_RUN }}

      - name: Download exact unindexed planar-role Environment evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.UNINDEXED_ARTIFACT_NAME }}
          path: evidence/environment_building_planar_role_consumer_identity_rebind_001/unindexed
          github-token: ${{ github.token }}
          run-id: ${{ env.UNINDEXED_RUN }}

      - name: Verify retained parents and install exact current-world payload
        run: |
          set -euo pipefail
          out=evidence/environment_building_planar_role_consumer_identity_rebind_001
          test "$(tr -d '\n\r' < "$out/active/exact-head.txt")" = "$ACTIVE_HEAD"
          test "$(tr -d '\n\r' < "$out/unindexed/exact-head.txt")" = "$UNINDEXED_ENVIRONMENT_HEAD"
          test -f "$out/active/candidate/runtime.json"
          test -f "$out/unindexed/candidate/runtime.json"
          test -f "$out/unindexed/combined_current_world.json"
          test "$(find "$out/active/candidate/rendered" -maxdepth 1 -type f -name 'atmosphere-width-*.png' | wc -l | tr -d ' ')" = 68
          test "$(find "$out/unindexed/candidate/rendered" -maxdepth 1 -type f -name 'atmosphere-width-*.png' | wc -l | tr -d ' ')" = 68
          mkdir -p environment-proof/generated
          cp "$out/unindexed/combined_current_world.json" environment-proof/generated/current_world_nature_winding_migration.json

      - name: Checkout exact inherited Weather-width observer donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-map-design
          ref: ${{ env.WEATHER_WIDTH_OBSERVER_HEAD }}
          path: .vfx-width-donor
          fetch-depth: 1

      - name: Restore exact observer-chain setup
        run: |
          set -euo pipefail
          test "$(git -C .vfx-width-donor rev-parse HEAD)" = "$WEATHER_WIDTH_OBSERVER_HEAD"
          cp .vfx-width-donor/environment-proof/atmosphere_current_world_weather_width_observe.gd environment-proof/atmosphere_current_world_weather_width_observe.gd
          test -f environment-proof/atmosphere_current_world_building_header_segmentation_observe.gd
          test -f environment-proof/atmosphere_current_world_nature_winding_migration_observe.gd
          test -f environment-proof/atmosphere_current_world_building_current_policy_observe.gd
          test -f environment-proof/atmosphere_current_world_nature_split_surface_culling_observe.gd
          test -f environment-proof/atmosphere_current_world_nature_leaf_flutter_observe.gd
          test -f environment-proof/atmosphere_current_world_building_planar_role_observe.gd
          test -f environment-proof/atmosphere_current_world_building_planar_role_surface_index_observe.gd

      - name: Download pinned Godot 4.7.2
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum --check --strict
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Install proof dependencies and virtual display
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow
          if ! command -v xvfb-run >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y xvfb; fi

      - name: Observe exact 312-vertex consumer in current world
        env:
          AXM_OBJECT_FOOTPRINT_REVIEW_MODE: CANDIDATE_VISIBLE
        run: |
          set -euo pipefail
          out=evidence/environment_building_planar_role_consumer_identity_rebind_001/indexed
          mkdir -p "$out/rendered"
          rm -f environment-proof/atmosphere-width-*.png environment-proof/atmosphere-current-world-weather-width-runtime.json
          set +e
          xvfb-run --auto-servernum --server-args="-screen 0 1200x800x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 --rendering-method gl_compatibility \
            --path environment-proof --script atmosphere_current_world_building_planar_role_surface_index_observe.gd \
            2>&1 | tee "$out/godot.log"
          status=${PIPESTATUS[0]}; set -e
          cp environment-proof/atmosphere-current-world-weather-width-runtime.json "$out/runtime.json" 2>/dev/null || true
          cp environment-proof/atmosphere-width-*.png "$out/rendered/" 2>/dev/null || true
          exit "$status"

      - name: Reprove current Runtime trade space and raster boundary
        run: |
          set -euo pipefail
          out=evidence/environment_building_planar_role_consumer_identity_rebind_001
          test -f "$out/indexed/runtime.json"
          test "$(find "$out/indexed/rendered" -maxdepth 1 -type f -name 'atmosphere-width-*.png' | wc -l | tr -d ' ')" = 68
          python tools/runtime_building_planar_role_surface_index_budget.py \
            --active-root "$out/active" \
            --unindexed-root "$out/unindexed" \
            --indexed-root "$out/indexed" \
            --exact-head "$(cat exact-head.txt)" \
            --output "$out/runtime-report.json"

      - name: Gate explicit source-intent versus consumer identity
        run: |
          set -euo pipefail
          out=evidence/environment_building_planar_role_consumer_identity_rebind_001
          python tools/environment_building_planar_role_consumer_identity_rebind.py \
            --contract contracts/environment_building_planar_role_consumer_identity.json \
            --source-evidence "$out/source-owner/render-split-evidence.json" \
            --runtime-report "$out/runtime-report.json" \
            --indexed-runtime "$out/indexed/runtime.json" \
            --exact-head "$(cat exact-head.txt)" \
            --output "$out/environment-report.json"
          cp exact-head.txt "$out/exact-head.txt"
          python - <<'PY'
          import json
          p=json.load(open('evidence/environment_building_planar_role_consumer_identity_rebind_001/environment-report.json'))
          assert p['state']=='PASS_CURRENT_WORLD_BUILDING_CONSUMER_IDENTITY_REBOUND_TO_SOURCE_SPLIT_POLICY',p
          assert p['source_intent']['equivalence_groups']==604,p
          assert p['consumer_identity']['stored_vertices']==312,p
          assert p['identity_delta']['source_intent_groups_minus_consumer_vertices']==292,p
          assert p['environment_adoption'] is False,p
          assert p['world_observations']['indexed_vs_active_buffer_bytes']==-8304,p
          assert p['world_observations']['indexed_vs_active_primitives']==180,p
          print(json.dumps(p,indent=2,sort_keys=True))
          PY

      - name: Deliberate fail-closed source/consumer identity collapse mutation
        run: |
          set -euo pipefail
          out=evidence/environment_building_planar_role_consumer_identity_rebind_001
          cp contracts/environment_building_planar_role_consumer_identity.json "$out/mutated-contract.json"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('evidence/environment_building_planar_role_consumer_identity_rebind_001/mutated-contract.json')
          d=json.loads(p.read_text())
          d['source_representation']['source_cardinal_hard_normal_equivalence_is_consumer_identity']=True
          d['consumer_derivation']['source_owner_equivalence_identity_claimed']=True
          p.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
          if python tools/environment_building_planar_role_consumer_identity_rebind.py \
            --contract "$out/mutated-contract.json" \
            --source-evidence "$out/source-owner/render-split-evidence.json" \
            --runtime-report "$out/runtime-report.json" \
            --indexed-runtime "$out/indexed/runtime.json" \
            --exact-head "$(cat exact-head.txt)" \
            --output "$out/mutated-environment-report.json"; then
            echo "ERROR: Environment gate accepted collapsed source/consumer identity" >&2
            exit 1
          fi
          echo PASS_FAIL_CLOSED_SOURCE_CONSUMER_IDENTITY_COLLAPSE

      - name: Upload exact Environment evidence
        uses: actions/upload-artifact@v4
        with:
          name: environment-building-planar-role-consumer-identity-rebind-001-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            evidence/environment_building_planar_role_consumer_identity_rebind_001/exact-head.txt
            evidence/environment_building_planar_role_consumer_identity_rebind_001/source-owner/render-split-policy.json
            evidence/environment_building_planar_role_consumer_identity_rebind_001/source-owner/render-split-evidence.json
            evidence/environment_building_planar_role_consumer_identity_rebind_001/runtime-report.json
            evidence/environment_building_planar_role_consumer_identity_rebind_001/environment-report.json
            evidence/environment_building_planar_role_consumer_identity_rebind_001/indexed/runtime.json
            evidence/environment_building_planar_role_consumer_identity_rebind_001/indexed/godot.log
            evidence/environment_building_planar_role_consumer_identity_rebind_001/indexed/rendered/*.png
          if-no-files-found: error
          retention-days: 30
