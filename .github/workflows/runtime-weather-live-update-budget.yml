name: Runtime Weather live-update budget evidence

on:
  push:
    branches: [studio/runtime-weather-live-update-budget-001]
    paths:
      - "environment-proof/weather_dynamic_budget_observe.gd"
      - "tools/environment_weather_dynamic_runtime.py"
      - "tests/test_environment_weather_dynamic_runtime.py"
      - "docs/ENVIRONMENT_WEATHER_DYNAMIC_RUNTIME_001.md"
      - ".github/workflows/runtime-weather-live-update-budget.yml"
      - "tools/environment_weather_sequence.py"
      - "tools/environment_eye_level.py"
      - "tools/environment_real_slice.py"
      - "examples/environment_real_slice_001.json"
  pull_request:
    paths:
      - "environment-proof/weather_dynamic_budget_observe.gd"
      - "tools/environment_weather_dynamic_runtime.py"
      - "tests/test_environment_weather_dynamic_runtime.py"
      - "docs/ENVIRONMENT_WEATHER_DYNAMIC_RUNTIME_001.md"
      - ".github/workflows/runtime-weather-live-update-budget.yml"
      - "tools/environment_weather_sequence.py"
      - "tools/environment_eye_level.py"
      - "tools/environment_real_slice.py"
      - "examples/environment_real_slice_001.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-weather-live-update-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Runtime receiving lane
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Checkout exact Nature source
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-nature-design
          ref: fbc202449981f2bac153951c561ed0ed6120c936
          path: .nature

      - name: Checkout exact Weather source
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-weather-design
          ref: ca2eaba519e8449835b0ea6ef944b7080c3caa6a
          path: .weather

      - name: Verify dependency heads
        run: |
          set -euo pipefail
          test "$(git -C .nature rev-parse HEAD)" = "fbc202449981f2bac153951c561ed0ed6120c936"
          test "$(git -C .weather rev-parse HEAD)" = "ca2eaba519e8449835b0ea6ef944b7080c3caa6a"

      - name: Compile and test Runtime comparison contract
        run: |
          python -m compileall -q tools tests
          python -m unittest tests.test_environment_weather_dynamic_runtime -v

      - name: Rebuild exact nine-state Weather receiving sequence
        env:
          AXM_RECEIVING_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python tools/environment_weather_sequence.py \
            --nature-root .nature \
            --weather-root .weather \
            --output evidence/environment_weather_dynamic_runtime_001/sequence
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('evidence/environment_weather_dynamic_runtime_001/sequence/weather_sequence.json')
          seq=json.loads(p.read_text())
          assert seq['status']=='PASS',seq
          assert all(seq['checks'].values()),seq
          assert len(seq['states'])==9,seq
          assert seq['weather_source']['head']=='ca2eaba519e8449835b0ea6ef944b7080c3caa6a',seq
          assert seq['weather_source']['semantics']=='VISUAL_DIRECTION_ONLY_NOT_PHYSICAL_WIND_SPEED',seq
          print(json.dumps({k:seq[k] for k in ('status','sequence_digest','receiving_head')},indent=2))
          PY

      - name: Download pinned Godot 4.7.2
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum --check --strict
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Install virtual display when needed
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Observe synthetic rebuild control in one live process
        run: |
          set -euo pipefail
          mkdir -p environment-proof/generated evidence/environment_weather_dynamic_runtime_001/runtime
          cp evidence/environment_weather_dynamic_runtime_001/sequence/weather_sequence.json environment-proof/generated/weather_sequence.json
          rm -f environment-proof/weather-dynamic-runtime-rebuild_control.json
          xvfb-run --auto-servernum --server-args="-screen 0 1200x800x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --path environment-proof \
            --script weather_dynamic_budget_observe.gd -- rebuild_control
          cp environment-proof/weather-dynamic-runtime-rebuild_control.json evidence/environment_weather_dynamic_runtime_001/runtime/rebuild_control.json

      - name: Observe persistent single-mesh candidate in one live process
        run: |
          set -euo pipefail
          rm -f environment-proof/weather-dynamic-runtime-reuse_single_mesh.json
          xvfb-run --auto-servernum --server-args="-screen 0 1200x800x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --path environment-proof \
            --script weather_dynamic_budget_observe.gd -- reuse_single_mesh
          cp environment-proof/weather-dynamic-runtime-reuse_single_mesh.json evidence/environment_weather_dynamic_runtime_001/runtime/reuse_single_mesh.json

      - name: Compare before/control and after/candidate evidence
        run: |
          python tools/environment_weather_dynamic_runtime.py \
            --control evidence/environment_weather_dynamic_runtime_001/runtime/rebuild_control.json \
            --candidate evidence/environment_weather_dynamic_runtime_001/runtime/reuse_single_mesh.json \
            --image-root environment-proof \
            --output evidence/environment_weather_dynamic_runtime_001/comparison.json

      - name: Validate bounded final Runtime gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('evidence/environment_weather_dynamic_runtime_001/comparison.json')
          report=json.loads(p.read_text())
          assert report['state']=='PASS_REUSE_SINGLE_MESH_RESOURCE_CHURN_CONTRACT',report
          assert all(report['checks'].values()),report
          assert report['visual_tradeoff']=='NONE_OBSERVED_IN_EXACT_RETAINED_PROOF_FRAMES',report
          print(json.dumps({
              'state':report['state'],
              'checks':report['checks'],
              'resource_creation_delta':report['observations']['resource_creation_delta'],
              'cpu_side_submission':report['observations']['cpu_side_submission'],
              'stress_memory':report['observations']['stress_memory'],
              'visual_tradeoff':report['visual_tradeoff'],
          },indent=2))
          PY

      - name: Collect retained exact images
        if: always()
        run: |
          mkdir -p evidence/environment_weather_dynamic_runtime_001/images
          cp environment-proof/weather-dynamic-*.png evidence/environment_weather_dynamic_runtime_001/images/ 2>/dev/null || true

      - name: Upload exact Weather live-update Runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: environment-weather-dynamic-runtime-001-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            evidence/environment_weather_dynamic_runtime_001/sequence/weather_sequence.json
            evidence/environment_weather_dynamic_runtime_001/runtime/*.json
            evidence/environment_weather_dynamic_runtime_001/comparison.json
            evidence/environment_weather_dynamic_runtime_001/images/*.png
          if-no-files-found: warn
          retention-days: 30
