name: Technical Art Object rigid current-world observer repair

on:
  push:
    branches: [studio/technical-art-object-rigid-current-world-bridge-001]
    paths:
      - "tools/technical_art_exact_rgba_frame_compare.py"
      - ".github/workflows/technical-art-object-rigid-current-world-observer-repair.yml"
  pull_request:
    paths:
      - "tools/technical_art_exact_rgba_frame_compare.py"
      - ".github/workflows/technical-art-object-rigid-current-world-observer-repair.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  retained-real-godot-observer-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install observer dependency
        run: python -m pip install --disable-pip-version-check --no-input pillow

      - name: Bind exact repair source and predecessor lineage
        run: |
          set -euo pipefail
          git rev-parse HEAD > exact-head.txt
          python -m py_compile tools/technical_art_exact_rgba_frame_compare.py
          git cat-file -e 187bb64241ca2d21b2c0e1e416437435cd584707^{commit}
          git merge-base --is-ancestor 187bb64241ca2d21b2c0e1e416437435cd584707 HEAD

      - name: Download exact retained real-Godot predecessor and parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root=evidence/technical_art_object_rigid_observer_repair_001
          mkdir -p "$root/predecessor" "$root/parent"
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/mike-axiom-mir/axm-map-design/actions/artifacts/10519104958/zip" \
            --output "$root/predecessor.zip"
          echo "33dfcc094c7bcf8bd9ad78397280ab9bb2697434c1f238260c5a99d3b09a6f5f  $root/predecessor.zip" | sha256sum --check --strict
          unzip -q "$root/predecessor.zip" -d "$root/predecessor"
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/mike-axiom-mir/axm-map-design/actions/artifacts/10516853353/zip" \
            --output "$root/parent.zip"
          echo "f879277d1e4b3c37b9a7fc491d992e520345a8642f56d0ae17abfcd9957444c0  $root/parent.zip" | sha256sum --check --strict
          unzip -q "$root/parent.zip" -d "$root/parent"

      - name: Require predecessor main path to be the exact green real-Godot proof
        run: |
          set -euo pipefail
          root=evidence/technical_art_object_rigid_observer_repair_001
          python - <<'PY'
          import json
          p=json.load(open('evidence/technical_art_object_rigid_observer_repair_001/predecessor/report.json'))
          assert p['state']=='PASS_CURRENT_WORLD_OBJECT_RIGID_COMPONENT_BOUNDARY_NEUTRAL_EQUIVALENCE__ANIMATION_VFX_ADOPTION_HELD',p
          assert p['environment_head']=='187bb64241ca2d21b2c0e1e416437435cd584707',p
          assert p['technical_art_donor_head']=='965fb2f24dbd0b0cbb748d9f8b8712d62966315f',p
          assert p['object_source_sha256']=='49b1f9ed9865893d6de6f1ec8f069576732df694853fde4e3fcff366de32644a',p
          assert p['tested_uc_head']=='6dc465987e01362264f88b7cef4213609ae50763',p
          assert p['inspected_current_uc_head']=='e9eed3d9eb66392992cc18c8884bfade0d3b8efd',p
          assert p['component_map']['component_count']==31 and p['component_map']['triangles']==812,p
          assert p['receiver_observation']['component_surface_instances']==33,p
          assert p['real_world_neutral_equivalence']=={'states':17,'frames':68,'changed_frames':0,'changed_pixels':0,'pixel_exact':True},p
          assert p['animation_adoption'] is False and p['vfx_adoption'] is False,p
          assert p['runtime_acceptance'] is False and p['environment_adoption'] is False,p
          print('PASS_EXACT_PREDECESSOR_REAL_GODOT_MAIN_PATH')
          PY
          test "$(find "$root/predecessor/candidate/rendered" -maxdepth 1 -type f -name 'atmosphere-width-*.png' | wc -l | tr -d ' ')" = 68
          test "$(find "$root/parent/candidate/rendered" -maxdepth 1 -type f -name 'atmosphere-width-*.png' | wc -l | tr -d ' ')" = 68

      - name: Re-observe all 68 retained real-Godot frames with exact RGBA tuples
        run: |
          set -euo pipefail
          root=evidence/technical_art_object_rigid_observer_repair_001
          python tools/technical_art_exact_rgba_frame_compare.py \
            --control-dir "$root/parent/candidate/rendered" \
            --candidate-dir "$root/predecessor/candidate/rendered" \
            --expected-count 68 \
            --output "$root/exact-rgba-report.json" \
            | tee "$root/exact-rgba.log"
          python - <<'PY'
          import json
          p=json.load(open('evidence/technical_art_object_rigid_observer_repair_001/exact-rgba-report.json'))
          assert p['result']=='PASS_EXACT_RGBA_FRAME_SET_EQUAL',p
          assert p['frame_count']==68 and p['changed_frames']==0 and p['changed_pixels']==0,p
          assert p['pixel_exact'] is True,p
          print(p['result'])
          PY

      - name: Negative control detects one RGB-channel delta with unchanged alpha
        run: |
          set -euo pipefail
          root=evidence/technical_art_object_rigid_observer_repair_001
          mkdir -p "$root/negative"
          cp -a "$root/predecessor/candidate/rendered/." "$root/negative/"
          python - <<'PY'
          from PIL import Image
          p='evidence/technical_art_object_rigid_observer_repair_001/negative/atmosphere-width-candidate-path_eye-00.png'
          im=Image.open(p).convert('RGBA')
          before=im.getpixel((0,0))
          after=((before[0]+1)%256,before[1],before[2],before[3])
          assert before[3]==after[3]
          im.putpixel((0,0),after)
          im.save(p)
          print({'before':before,'after':after})
          PY
          set +e
          python tools/technical_art_exact_rgba_frame_compare.py \
            --control-dir "$root/parent/candidate/rendered" \
            --candidate-dir "$root/negative" \
            --expected-count 68 \
            --output "$root/negative-report.json" \
            > "$root/negative.log" 2>&1
          code=$?
          set -e
          test "$code" -eq 2
          python - <<'PY'
          import json
          p=json.load(open('evidence/technical_art_object_rigid_observer_repair_001/negative-report.json'))
          assert p['result']=='FAIL_RGBA_FRAME_SET_CHANGED',p
          assert p['changed_frames']==1 and p['changed_pixels']==1,p
          assert p['first_changes'][0]['bbox']==[0,0,1,1],p
          print('PASS_REJECTED_ONE_RGB_DELTA_WITH_UNCHANGED_ALPHA')
          PY

      - name: Retain observer repair evidence
        if: always()
        run: |
          set -euo pipefail
          root=evidence/technical_art_object_rigid_observer_repair_001
          out="$root/retained"
          mkdir -p "$out"
          cp exact-head.txt "$out/" 2>/dev/null || true
          cp tools/technical_art_exact_rgba_frame_compare.py "$out/" 2>/dev/null || true
          cp "$root/predecessor/report.json" "$out/predecessor-real-godot-report.json" 2>/dev/null || true
          cp "$root/exact-rgba-report.json" "$out/" 2>/dev/null || true
          cp "$root/exact-rgba.log" "$out/" 2>/dev/null || true
          cp "$root/negative-report.json" "$out/" 2>/dev/null || true
          cp "$root/negative.log" "$out/" 2>/dev/null || true
          printf '%s\n' \
            'Truth boundary: predecessor run 35273691188 already completed its real Godot render and main 17-state/68-frame verification successfully; only its Pillow RGBA getbbox negative-control observer failed to detect an RGB-only delta with unchanged alpha. This retained follow-up repairs that observer with direct RGBA tuple comparison, re-observes the exact retained real-Godot outputs, and proves a one-pixel RGB mutation is rejected without changing any production threshold or receiver content.' \
            > "$out/TRUTH_BOUNDARY.txt"

      - name: Upload exact observer repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: technical-art-object-rigid-observer-repair-001-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/technical_art_object_rigid_observer_repair_001/retained
          if-no-files-found: error
          retention-days: 30
