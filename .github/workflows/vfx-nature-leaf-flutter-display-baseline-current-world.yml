name: VFX Nature leaf flutter visible-display baseline current-world evidence

on:
  push:
    branches: [studio/vfx-nature-leaf-flutter-wall-clock-current-world-001]
    paths:
      - "environment-proof/atmosphere_current_world_nature_leaf_flutter_wall_clock_external_observe.gd"
      - "docs/VFX_NATURE_LEAF_FLUTTER_DISPLAY_BASELINE_CURRENT_WORLD_001.md"
      - ".github/workflows/vfx-nature-leaf-flutter-display-baseline-current-world.yml"
  pull_request:
    paths:
      - "environment-proof/atmosphere_current_world_nature_leaf_flutter_wall_clock_external_observe.gd"
      - "docs/VFX_NATURE_LEAF_FLUTTER_DISPLAY_BASELINE_CURRENT_WORLD_001.md"
      - ".github/workflows/vfx-nature-leaf-flutter-display-baseline-current-world.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  visible-display-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact VFX head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bind exact source receiver and isolation contract
        run: |
          set -euo pipefail
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          printf '%s\n' "$EXPECTED" > exact-head.txt
          git cat-file -e 7713cbe5863c3bc38dabb6236eb4b393401224b6^{commit}
          git cat-file -e 795d9e8862e895e506c756b9ea01cd6228fa7ab7^{commit}
          git merge-base --is-ancestor 7713cbe5863c3bc38dabb6236eb4b393401224b6 HEAD
          grep -F 'EXACT_VFX_EFFECT_HEAD := "ecade64227ba1d3d1faf029ca7188ea63c2560ec"' environment-proof/atmosphere_current_world_nature_leaf_flutter_wall_clock_observe.gd
          grep -F 'EXTERNAL_CAPTURE_MODE := "EXTERNAL_X11GRAB_FFV1_NO_IN_PROCESS_VIEWPORT_READBACK"' environment-proof/atmosphere_current_world_nature_leaf_flutter_wall_clock_external_observe.gd
          grep -F 'LOW_INTRUSION_MIN_PRESENTED_TOTAL := 90' environment-proof/atmosphere_current_world_nature_leaf_flutter_wall_clock_external_observe.gd
          grep -F 'LOW_INTRUSION_MAX_CADENCE_RATIO := 1.10' environment-proof/atmosphere_current_world_nature_leaf_flutter_wall_clock_external_observe.gd
          if grep -F 'get_image(' environment-proof/atmosphere_current_world_nature_leaf_flutter_wall_clock_external_observe.gd; then
            echo 'in-process viewport readback forbidden in display baseline observer' >&2
            exit 1
          fi
          if grep -F 'save_png' environment-proof/atmosphere_current_world_nature_leaf_flutter_wall_clock_external_observe.gd; then
            echo 'in-process PNG encoding forbidden in display baseline observer' >&2
            exit 1
          fi

      - name: Download exact accepted current-world leaf-flutter receiver evidence
        uses: actions/download-artifact@v4
        with:
          name: environment-nature-leaf-flutter-current-world-001-7713cbe5863c3bc38dabb6236eb4b393401224b6
          path: evidence/vfx_nature_leaf_flutter_display_baseline_current_world_001/environment-parent
          github-token: ${{ github.token }}
          run-id: 35174899697

      - name: Verify and install exact current-world payload
        run: |
          set -euo pipefail
          root=evidence/vfx_nature_leaf_flutter_display_baseline_current_world_001
          parent="$root/environment-parent"
          test "$(tr -d '\n\r' < "$parent/exact-head.txt")" = 7713cbe5863c3bc38dabb6236eb4b393401224b6
          test -f "$parent/combined_current_world.json"
          test -f "$parent/report.json"
          python - <<'PY'
          import json
          from pathlib import Path
          parent=Path('evidence/vfx_nature_leaf_flutter_display_baseline_current_world_001/environment-parent')
          report=json.loads((parent/'report.json').read_text())
          payload=json.loads((parent/'combined_current_world.json').read_text())
          assert report['state']=='PASS_CURRENT_WORLD_NATURE_LEAF_FLUTTER_TARGET_HOST',report
          assert payload['environment_head']=='7713cbe5863c3bc38dabb6236eb4b393401224b6',payload
          assert payload['nature_leaf_flutter_vfx_head']=='ecade64227ba1d3d1faf029ca7188ea63c2560ec',payload
          assert payload['nature_leaf_flutter_structure_result']=='PASS_CURRENT_WORLD_NATURE_LEAF_FLUTTER_STRUCTURE',payload
          assert len(payload['states'])==17,payload
          assert abs(payload['states'][1]['time_s']-0.03125)<=1e-12,payload
          assert abs(payload['states'][16]['time_s']-0.5)<=1e-12,payload
          assert payload['states'][0]['sapling_mesh_digest']==payload['states'][16]['sapling_mesh_digest'],payload
          print('PASS_EXACT_ACCEPTED_CURRENT_WORLD_FLUTTER_PARENT')
          PY
          mkdir -p environment-proof/generated "$root/result"
          cp "$parent/combined_current_world.json" environment-proof/generated/current_world_nature_winding_migration.json
          cp "$parent/report.json" "$root/environment-parent-report.json"
          cp exact-head.txt "$root/exact-head.txt"

      - name: Install exact inherited Weather-width observer into proof host
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-map-design
          ref: 15a03b7c3ba3aaa7c0475ca1a3091c15581f559b
          path: .vfx-width-donor
          fetch-depth: 1

      - name: Verify current-world observer chain
        run: |
          set -euo pipefail
          test "$(git -C .vfx-width-donor rev-parse HEAD)" = 15a03b7c3ba3aaa7c0475ca1a3091c15581f559b
          cp .vfx-width-donor/environment-proof/atmosphere_current_world_weather_width_observe.gd environment-proof/atmosphere_current_world_weather_width_observe.gd
          test -f environment-proof/atmosphere_current_world_weather_variant_observe.gd
          test -f environment-proof/atmosphere_current_world_rebind_observe.gd
          test -f environment-proof/atmosphere_current_world_nature_leaf_flutter_observe.gd
          test -f environment-proof/atmosphere_current_world_nature_leaf_flutter_wall_clock_observe.gd
          test -f environment-proof/atmosphere_current_world_nature_leaf_flutter_wall_clock_external_observe.gd

      - name: Download pinned Godot 4.7.2
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum --check --strict
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Install X11 proof host only
        run: |
          set -euo pipefail
          if ! command -v Xvfb >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          Xvfb -help >/dev/null 2>&1 || true
          if pgrep -x ffmpeg >/dev/null 2>&1; then
            echo 'unexpected ffmpeg process already present before no-recorder baseline' >&2
            exit 1
          fi

      - name: Run visible X11 current-world baseline with no recorder
        env:
          AXM_OBJECT_FOOTPRINT_REVIEW_MODE: CANDIDATE_VISIBLE
        run: |
          set -euo pipefail
          root=evidence/vfx_nature_leaf_flutter_display_baseline_current_world_001
          rm -f environment-proof/vfx-nature-leaf-flutter-wall-clock-external-runtime.json
          rm -f "$root/result/godot.log" "$root/result/xvfb.log"
          Xvfb :99 -screen 0 1120x720x24 -ac -nolisten tcp >"$root/result/xvfb.log" 2>&1 &
          xvfb_pid=$!
          export DISPLAY=:99
          cleanup() {
            if kill -0 "$xvfb_pid" 2>/dev/null; then kill "$xvfb_pid" 2>/dev/null || true; fi
          }
          trap cleanup EXIT
          sleep 1
          if pgrep -x ffmpeg >/dev/null 2>&1; then
            echo 'recorder process appeared before Godot baseline' >&2
            exit 1
          fi
          set +e
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 --rendering-method gl_compatibility \
            --resolution 1120x720 --position 0,0 \
            --path environment-proof --script atmosphere_current_world_nature_leaf_flutter_wall_clock_external_observe.gd \
            2>&1 | tee "$root/result/godot.log"
          godot_status=${PIPESTATUS[0]}
          set -e
          if pgrep -x ffmpeg >/dev/null 2>&1; then
            echo 'recorder process appeared during no-recorder baseline' >&2
            exit 1
          fi
          kill "$xvfb_pid" 2>/dev/null || true
          wait "$xvfb_pid" 2>/dev/null || true
          trap - EXIT
          cp environment-proof/vfx-nature-leaf-flutter-wall-clock-external-runtime.json "$root/result/runtime.json" 2>/dev/null || true
          test -s "$root/result/runtime.json"
          exit "$godot_status"

      - name: Validate display-only timing isolation
        run: |
          set -euo pipefail
          root=evidence/vfx_nature_leaf_flutter_display_baseline_current_world_001
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path('evidence/vfx_nature_leaf_flutter_display_baseline_current_world_001')
          result=root/'result'
          receipt=json.loads((result/'runtime.json').read_text())

          assert receipt['schema']=='axm.vfx-current-world-nature-leaf-flutter-external-capture/v0.1',receipt
          assert receipt['environment_parent_head']=='7713cbe5863c3bc38dabb6236eb4b393401224b6',receipt
          assert receipt['vfx_effect_head']=='ecade64227ba1d3d1faf029ca7188ea63c2560ec',receipt
          assert receipt['presentation_mode']=='PHASE_LOCKED_LATEST_DUE_DIRECT_SOURCE_STATE_NO_RETIME',receipt
          assert receipt['weather_policy']=='FIXED_AT_SOURCE_PHASE_00_SOURCE_WIDTH_PRESENTATION',receipt
          assert receipt['source_phase_step_s']==0.03125 and receipt['source_unique_phase_count']==16,receipt
          flags=receipt['truth_flags']
          assert flags['in_process_viewport_readback_used'] is False,flags
          assert flags['in_process_png_encoding_used'] is False,flags
          assert flags['interpolation_used'] is False and flags['retiming_used'] is False,flags
          assert set(receipt['contexts'])=={'path_eye','elevated_oblique'},receipt

          clean={
              'path_eye':32.0634565,
              'elevated_oblique':33.7925909,
          }
          contexts={}
          total_presented=0
          total_skipped=0
          for name in ('path_eye','elevated_oblique'):
              c=receipt['contexts'][name]
              assert c['scheduled_slot_count']==48,c
              assert c['presented_slot_count']+c['skipped_slot_count']==48,c
              assert c['fixed_weather_update']['state']=='PASS_SOURCE_WIDTH_PX_CAMERA_PROJECTED_RIBBONS',c
              assert c['fixed_weather_update']['maximum_projected_width_residual_px']<=0.05,c
              records=c['records']
              assert len(records)==c['presented_slot_count'],c
              for row in records:
                  slot=int(row['absolute_slot'])
                  phase=int(row['source_phase_index'])
                  assert 0<=slot<48 and phase==slot%16,row
                  assert int(row['sapling_update']['leaf_flutter_phase_index'])==phase,row
              mean_ms=float(c['post_draw_interval_ms']['mean'])
              ratio=mean_ms/clean[name]
              contexts[name]={
                  'scheduled_slot_count':48,
                  'presented_slot_count':int(c['presented_slot_count']),
                  'skipped_slot_count':int(c['skipped_slot_count']),
                  'skipped_slots':c['skipped_slots'],
                  'mean_post_draw_ms':mean_ms,
                  'clean_reference_mean_post_draw_ms':clean[name],
                  'cadence_ratio_vs_clean':ratio,
                  'mean_apply_duration_ms':float(c['apply_duration_ms']['mean']),
              }
              total_presented+=int(c['presented_slot_count'])
              total_skipped+=int(c['skipped_slot_count'])

          comparable=(
              total_presented>=90
              and all(v['cadence_ratio_vs_clean']<=1.10 for v in contexts.values())
          )
          state=(
              'PASS_VISIBLE_X11_DISPLAY_TELEMETRY_BASELINE_COMPARABLE_TO_CLEAN_REFERENCE'
              if comparable else
              'HOLD_VISIBLE_X11_DISPLAY_TELEMETRY_BASELINE_PERTURBS_CLEAN_REFERENCE'
          )
          report={
              'schema':'axm.vfx-current-world-nature-leaf-flutter-display-baseline/v0.1',
              'state':state,
              'observation_layer':'VISIBLE_X11_SURFACE_PLUS_TELEMETRY_NO_RECORDER',
              'recorder_started':False,
              'video_grabber_started':False,
              'video_encoder_started':False,
              'in_process_viewport_readback_used':False,
              'in_process_png_encoding_used':False,
              'environment_parent_head':'7713cbe5863c3bc38dabb6236eb4b393401224b6',
              'vfx_effect_head':'ecade64227ba1d3d1faf029ca7188ea63c2560ec',
              'clean_reference_head':'795d9e8862e895e506c756b9ea01cd6228fa7ab7',
              'clean_reference_workflow':35179504496,
              'presentation_mode':receipt['presentation_mode'],
              'weather_policy':receipt['weather_policy'],
              'scheduled_total':96,
              'presented_total':total_presented,
              'skipped_total':total_skipped,
              'minimum_presented_total_gate':90,
              'maximum_cadence_ratio_gate':1.10,
              'contexts':contexts,
              'truth_boundary':(
                  'This report isolates the visible X11/display-composition plus telemetry path only. '
                  'No recorder/grabber/encoder was started. It is timing-instrumentation evidence, not '
                  'perceptual naturalness, display scanout, target-device performance, physical wind, '
                  'gameplay, CANON or production-readiness evidence.'
              ),
          }
          (result/'display-baseline-report.json').write_text(json.dumps(report,indent=2)+'\n')

          # Fail-closed verifier control: claiming that a recorder ran is incompatible
          # with the declared display-only evidence class.
          def verify_display_only(candidate):
              assert candidate['recorder_started'] is False
              assert candidate['video_grabber_started'] is False
              assert candidate['video_encoder_started'] is False
              assert candidate['in_process_viewport_readback_used'] is False
              assert candidate['in_process_png_encoding_used'] is False
              assert candidate['scheduled_total']==96
              assert candidate['presented_total']+candidate['skipped_total']==96
              assert candidate['state'] in {
                  'PASS_VISIBLE_X11_DISPLAY_TELEMETRY_BASELINE_COMPARABLE_TO_CLEAN_REFERENCE',
                  'HOLD_VISIBLE_X11_DISPLAY_TELEMETRY_BASELINE_PERTURBS_CLEAN_REFERENCE',
              }
          verify_display_only(report)
          mutation=dict(report)
          mutation['recorder_started']=True
          try:
              verify_display_only(mutation)
          except AssertionError:
              pass
          else:
              raise AssertionError('display-only negative control failed open')

          print(state)
          print(json.dumps(report,indent=2))
          PY
          test -s "$root/result/display-baseline-report.json"

      - name: Retain exact visible-display baseline evidence
        uses: actions/upload-artifact@v4
        with:
          name: vfx-nature-leaf-flutter-display-baseline-current-world-001-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            evidence/vfx_nature_leaf_flutter_display_baseline_current_world_001/exact-head.txt
            evidence/vfx_nature_leaf_flutter_display_baseline_current_world_001/environment-parent-report.json
            evidence/vfx_nature_leaf_flutter_display_baseline_current_world_001/result/runtime.json
            evidence/vfx_nature_leaf_flutter_display_baseline_current_world_001/result/display-baseline-report.json
            evidence/vfx_nature_leaf_flutter_display_baseline_current_world_001/result/godot.log
            evidence/vfx_nature_leaf_flutter_display_baseline_current_world_001/result/xvfb.log
          if-no-files-found: error
          retention-days: 30
