name: Environment Object selected roughness receiver readiness

on:
  push:
    branches: [studio/environment-weather-variant-object-convergence-001]
    paths:
      - "contracts/environment_object_selected_roughness_receiver_readiness.json"
      - "tools/environment_object_selected_roughness_receiver_readiness.py"
      - "environment-proof/atmosphere_current_world_object_selected_roughness_readiness_observe.gd"
      - "docs/ENVIRONMENT_OBJECT_SELECTED_ROUGHNESS_RECEIVER_READINESS_001.md"
      - ".github/workflows/environment-object-selected-roughness-receiver-readiness.yml"
  pull_request:
    paths:
      - "contracts/environment_object_selected_roughness_receiver_readiness.json"
      - "tools/environment_object_selected_roughness_receiver_readiness.py"
      - "environment-proof/atmosphere_current_world_object_selected_roughness_readiness_observe.gd"
      - "docs/ENVIRONMENT_OBJECT_SELECTED_ROUGHNESS_RECEIVER_READINESS_001.md"
      - ".github/workflows/environment-object-selected-roughness-receiver-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  exact-current-world-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact Environment head with ancestry
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bind exact Environment lineage and unchanged receiver implementation
        run: |
          set -euo pipefail
          git rev-parse HEAD > exact-head.txt
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git cat-file -e a543fdd30b0b846a56f09f17c3b5680a9fa73997^{commit}
          git merge-base --is-ancestor a543fdd30b0b846a56f09f17c3b5680a9fa73997 HEAD
          test "$(git hash-object environment-proof/atmosphere_current_world_object_material_family_observe.gd)" = c78c3af80d2066afc104eefd676cf06e40fb8b31
          test "$(git hash-object environment-proof/atmosphere_current_world_object_indexed_footprint_observe.gd)" = 0d54b3242cd87262c8e38dc59efcfbc75f4ac3ed
          test "$(git hash-object environment-proof/atmosphere_current_world_nature_leaf_flutter_observe.gd)" = ba5e2be5f66a70e1abe584ab4d6db2a091613689
          python -m py_compile tools/environment_object_selected_roughness_receiver_readiness.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Checkout exact selected Materials authority
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-object-design
          ref: 0515a2d5ad2c7a1eb545f2b7b327b7367530dfca
          path: .object-materials
          fetch-depth: 1

      - name: Verify exact selected Materials contract identity
        run: |
          set -euo pipefail
          test "$(git -C .object-materials rev-parse HEAD)" = 0515a2d5ad2c7a1eb545f2b7b327b7367530dfca
          test "$(git -C .object-materials hash-object lookdev/service_dark_roughness_selected_field_001.json)" = 16ab4ea07c41273e58b72f970d6bed383bbbfe33
          python - <<'PY'
          import json
          p=json.load(open('.object-materials/lookdev/service_dark_roughness_selected_field_001.json'))
          s=p['selected_field']
          assert p['material_id']=='service_dark',p
          assert s['semantic_encoding']=='BASE_LEVEL_R8_SCALAR_VALUES_ROW_MAJOR',s
          assert [s['width_px'],s['height_px']]==[512,512],s
          assert s['scalar_r8_sha256']=='b8d13c07f9b71278042b0d42d44b84579a3f327c6adf6723cae4c8c8f06dd38e',s
          assert [s['observed_r8_min'],s['observed_r8_max'],s['observed_unique_r8_values']]==[153,183,31],s
          print('PASS_EXACT_SELECTED_MATERIALS_AUTHORITY')
          PY

      - name: Download exact accepted Technical Art semantic transport evidence
        uses: actions/download-artifact@v4
        with:
          name: object-service-dark-selected-roughness-semantic-uc-transport-1bcdbae786e02f3ca46a89e4e0ff608d74f364b4
          path: evidence/environment_object_selected_roughness_receiver_readiness_001/technical-art
          github-token: ${{ github.token }}
          repository: mike-axiom-mir/axm-object-design
          run-id: 35207912100

      - name: Verify exact Technical Art evidence surface
        run: |
          set -euo pipefail
          ta=evidence/environment_object_selected_roughness_receiver_readiness_001/technical-art
          test "$(cat "$ta/technical-art-proof/technical-art-head.txt" | tr -d '\n\r')" = 1bcdbae786e02f3ca46a89e4e0ff608d74f364b4
          test -f "$ta/creations/technical-art-proof/selected-roughness-generated/technical-art-selected-roughness-uc-transport-receipt.json"
          test -f "$ta/creations/technical-art-proof/selected-roughness-generated/service-dark-selected-roughness-two-surface.glb"
          test -f "$ta/creations/technical-art-proof/selected-roughness-godot-front-view-proof/technical-art-uc-godot-front-view-receipt.json"
          echo "9327291569a04bcb22016dc2ac4292499531b141a19e4bfceb291122e20ac3f4  $ta/creations/technical-art-proof/selected-roughness-generated/service-dark-selected-roughness-two-surface.glb" | sha256sum --check --strict

      - name: Download exact accepted real current-world evidence
        uses: actions/download-artifact@v4
        with:
          name: environment-nature-leaf-flutter-current-world-001-7713cbe5863c3bc38dabb6236eb4b393401224b6
          path: evidence/environment_object_selected_roughness_receiver_readiness_001/parent
          github-token: ${{ github.token }}
          run-id: 35174899697

      - name: Verify exact accepted real-scene parent and install payload
        run: |
          set -euo pipefail
          root=evidence/environment_object_selected_roughness_receiver_readiness_001
          test "$(cat "$root/parent/exact-head.txt" | tr -d '\n\r')" = 7713cbe5863c3bc38dabb6236eb4b393401224b6
          test -f "$root/parent/combined_current_world.json"
          test -f "$root/parent/report.json"
          test -f "$root/parent/candidate/runtime.json"
          test "$(find "$root/parent/candidate/rendered" -maxdepth 1 -type f -name 'atmosphere-width-*.png' | wc -l | tr -d ' ')" = 68
          python - <<'PY'
          import json
          r=json.load(open('evidence/environment_object_selected_roughness_receiver_readiness_001/parent/report.json'))
          assert r['state']=='PASS_CURRENT_WORLD_NATURE_LEAF_FLUTTER_TARGET_HOST',r
          assert r['matched_frames']==68 and r['weather_width_measurements']==1224,r
          print('PASS_EXACT_ACCEPTED_REAL_SCENE_PARENT')
          PY
          mkdir -p environment-proof/generated
          cp "$root/parent/combined_current_world.json" environment-proof/generated/current_world_nature_winding_migration.json

      - name: Install exact inherited Weather-width observer into proof host
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-map-design
          ref: 15a03b7c3ba3aaa7c0475ca1a3091c15581f559b
          path: .vfx-width-donor
          fetch-depth: 1

      - name: Verify inherited observer donor and copy exact base observer
        run: |
          set -euo pipefail
          test "$(git -C .vfx-width-donor rev-parse HEAD)" = 15a03b7c3ba3aaa7c0475ca1a3091c15581f559b
          cp .vfx-width-donor/environment-proof/atmosphere_current_world_weather_width_observe.gd environment-proof/atmosphere_current_world_weather_width_observe.gd
          test -f environment-proof/atmosphere_current_world_object_selected_roughness_readiness_observe.gd

      - name: Download pinned Godot 4.7.2
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum --check --strict
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Install virtual display when needed
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Observe exact current world and receiver UV readiness in real Godot
        env:
          AXM_OBJECT_FOOTPRINT_REVIEW_MODE: CANDIDATE_VISIBLE
        run: |
          set -euo pipefail
          root=evidence/environment_object_selected_roughness_receiver_readiness_001
          out="$root/candidate"
          mkdir -p "$out/rendered"
          rm -f environment-proof/atmosphere-width-*.png environment-proof/atmosphere-current-world-weather-width-runtime.json
          set +e
          xvfb-run --auto-servernum --server-args="-screen 0 1200x800x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 --rendering-method gl_compatibility \
            --path environment-proof --script atmosphere_current_world_object_selected_roughness_readiness_observe.gd \
            2>&1 | tee "$out/godot.log"
          status=${PIPESTATUS[0]}; set -e
          cp environment-proof/atmosphere-current-world-weather-width-runtime.json "$out/runtime.json" 2>/dev/null || true
          cp environment-proof/atmosphere-width-*.png "$out/rendered/" 2>/dev/null || true
          exit "$status"

      - name: Verify exact selected-roughness receiving HOLD and real-scene continuity
        run: |
          set -euo pipefail
          root=evidence/environment_object_selected_roughness_receiver_readiness_001
          ta="$root/technical-art"
          python tools/environment_object_selected_roughness_receiver_readiness.py verify \
            --contract contracts/environment_object_selected_roughness_receiver_readiness.json \
            --materials-contract .object-materials/lookdev/service_dark_roughness_selected_field_001.json \
            --technical-art-receipt "$ta/creations/technical-art-proof/selected-roughness-generated/technical-art-selected-roughness-uc-transport-receipt.json" \
            --technical-art-target "$ta/creations/technical-art-proof/selected-roughness-godot-front-view-proof/technical-art-uc-godot-front-view-receipt.json" \
            --technical-art-glb "$ta/creations/technical-art-proof/selected-roughness-generated/service-dark-selected-roughness-two-surface.glb" \
            --parent-report "$root/parent/report.json" \
            --parent-rendered "$root/parent/candidate/rendered" \
            --runtime "$root/candidate/runtime.json" \
            --candidate-rendered "$root/candidate/rendered" \
            --environment-head "$(cat exact-head.txt)" \
            --output "$root/readiness-report.json" \
            | tee "$root/verify.log"
          cp exact-head.txt "$root/exact-head.txt"
          python - <<'PY'
          import json
          p=json.load(open('evidence/environment_object_selected_roughness_receiver_readiness_001/readiness-report.json'))
          assert p['state']=='HOLD_CURRENT_WORLD_OBJECT_SELECTED_ROUGHNESS_RECEIVER__EXACT_UV0_BINDING_NOT_PRESENT',p
          assert p['environment_adoption'] is False,p
          assert p['receiver_uv0']['total_uv0_count']==0,p
          assert p['real_scene_frame_continuity']['byte_identical_frames']==68,p
          assert p['weather_width_continuity']['measurements']==1224,p
          assert p['weather_width_continuity']['maximum_projected_width_residual_px']<=0.05,p
          assert all(p['checks'].values()),p
          print(json.dumps(p,indent=2))
          PY

      - name: Negative control rejects silent adoption without UV0
        run: |
          set -euo pipefail
          root=evidence/environment_object_selected_roughness_receiver_readiness_001
          cp "$root/candidate/runtime.json" "$root/negative-runtime.json"
          python - <<'PY'
          import json
          p='evidence/environment_object_selected_roughness_receiver_readiness_001/negative-runtime.json'
          r=json.load(open(p))
          for rows in [r['static_source_meshes']] + [s['static_source_meshes'] for s in r['samples']]:
              for row in rows:
                  if row.get('asset_id')=='source:object:modular-equipment-case-001':
                      row['environment_object_selected_roughness_receiver_readiness']['selected_roughness_adopted']=True
          open(p,'w').write(json.dumps(r))
          PY
          set +e
          ta="$root/technical-art"
          python tools/environment_object_selected_roughness_receiver_readiness.py verify \
            --contract contracts/environment_object_selected_roughness_receiver_readiness.json \
            --materials-contract .object-materials/lookdev/service_dark_roughness_selected_field_001.json \
            --technical-art-receipt "$ta/creations/technical-art-proof/selected-roughness-generated/technical-art-selected-roughness-uc-transport-receipt.json" \
            --technical-art-target "$ta/creations/technical-art-proof/selected-roughness-godot-front-view-proof/technical-art-uc-godot-front-view-receipt.json" \
            --technical-art-glb "$ta/creations/technical-art-proof/selected-roughness-generated/service-dark-selected-roughness-two-surface.glb" \
            --parent-report "$root/parent/report.json" \
            --parent-rendered "$root/parent/candidate/rendered" \
            --runtime "$root/negative-runtime.json" \
            --candidate-rendered "$root/candidate/rendered" \
            --environment-head "$(cat exact-head.txt)" \
            --output "$root/negative-report.json" \
            > "$root/negative.log" 2>&1
          code=$?
          set -e
          test "$code" -ne 0
          grep -q "receiver adoption must remain false while UV0 identity is absent" "$root/negative.log"
          echo "PASS_REJECTED_SILENT_SELECTED_ROUGHNESS_ADOPTION_WITHOUT_UV0"

      - name: Retain compact donor receipts and remove downloaded donor bulk
        if: always()
        run: |
          set -euo pipefail
          root=evidence/environment_object_selected_roughness_receiver_readiness_001
          mkdir -p "$root/donor-receipts"
          cp .object-materials/lookdev/service_dark_roughness_selected_field_001.json "$root/donor-receipts/" 2>/dev/null || true
          cp "$root/technical-art/technical-art-proof/technical-art-head.txt" "$root/donor-receipts/technical-art-head.txt" 2>/dev/null || true
          cp "$root/technical-art/creations/technical-art-proof/selected-roughness-generated/technical-art-selected-roughness-uc-transport-receipt.json" "$root/donor-receipts/" 2>/dev/null || true
          cp "$root/technical-art/creations/technical-art-proof/selected-roughness-godot-front-view-proof/technical-art-uc-godot-front-view-receipt.json" "$root/donor-receipts/" 2>/dev/null || true
          if test -f "$root/technical-art/creations/technical-art-proof/selected-roughness-generated/service-dark-selected-roughness-two-surface.glb"; then
            sha256sum "$root/technical-art/creations/technical-art-proof/selected-roughness-generated/service-dark-selected-roughness-two-surface.glb" > "$root/donor-receipts/technical-art-glb-sha256.txt"
          fi
          rm -rf "$root/technical-art" "$root/parent" "$root/negative-runtime.json" "$root/negative-report.json"

      - name: Upload exact Environment receiver-readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: environment-object-selected-roughness-receiver-readiness-001-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/environment_object_selected_roughness_receiver_readiness_001
          if-no-files-found: error
          retention-days: 30
