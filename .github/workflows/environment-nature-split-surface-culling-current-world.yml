name: Environment Nature split surface-culling current-world evidence

on:
  push:
    branches: [studio/environment-weather-variant-object-convergence-001]
    paths:
      - "tools/environment_nature_split_surface_culling_current_world.py"
      - "environment-proof/atmosphere_current_world_nature_split_surface_culling_observe.gd"
      - "docs/ENVIRONMENT_NATURE_SPLIT_SURFACE_CULLING_CURRENT_WORLD_001.md"
      - ".github/workflows/environment-nature-split-surface-culling-current-world.yml"
  pull_request:
    paths:
      - "tools/environment_nature_split_surface_culling_current_world.py"
      - "environment-proof/atmosphere_current_world_nature_split_surface_culling_observe.gd"
      - "docs/ENVIRONMENT_NATURE_SPLIT_SURFACE_CULLING_CURRENT_WORLD_001.md"
      - ".github/workflows/environment-nature-split-surface-culling-current-world.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  exact-current-world-nature-split-culling:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact Environment head with ancestry
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bind exact current-world parent and verifier
        run: |
          set -euo pipefail
          git rev-parse HEAD > exact-head.txt
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git cat-file -e b0fa28733d77cad79d78f29e7ef76ccb9ab0b399^{commit}
          git merge-base --is-ancestor b0fa28733d77cad79d78f29e7ef76ccb9ab0b399 HEAD
          python -m py_compile tools/environment_nature_split_surface_culling_current_world.py
          grep -F 'NATURE_SPLIT_CULLING_POLICY_ID := "source-woody-back__source-foliage-two-sided-001"' environment-proof/atmosphere_current_world_nature_split_surface_culling_observe.gd

      - name: Checkout exact Nature VFX review owner
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-nature-design
          ref: 4e5211d14286f9c292e769a78971f24d59194141
          path: .nature-vfx
          fetch-depth: 1

      - name: Verify exact Nature VFX and Geometry review context
        run: |
          set -euo pipefail
          test "$(git -C .nature-vfx rev-parse HEAD)" = 4e5211d14286f9c292e769a78971f24d59194141
          grep -F 'GEOMETRY_LEAF_HEAD = "da3adbef4de8cddb8f3ebe841d39bb31a8936f5f"' .nature-vfx/tools/build_sapling_wind_leaf_backface_dynamic.py
          grep -F 'EXPECTED_LEAF_CANDIDATE_DIGEST = "e0b423bd4ff20251a960655441f97e36277da2f5b88a832ecfc5ccfe404bbbea"' .nature-vfx/tools/build_sapling_wind_leaf_backface_dynamic.py

      - name: Download exact current-world parent evidence
        uses: actions/download-artifact@v4
        with:
          name: environment-building-current-source-policy-rebind-001-b0fa28733d77cad79d78f29e7ef76ccb9ab0b399
          path: evidence/environment_nature_split_surface_culling_current_world_001/parent
          github-token: ${{ github.token }}
          run-id: 35167196419

      - name: Verify exact current-world parent evidence identity
        run: |
          set -euo pipefail
          out=evidence/environment_nature_split_surface_culling_current_world_001
          test "$(cat "$out/parent/exact-head.txt" | tr -d '\n\r')" = b0fa28733d77cad79d78f29e7ef76ccb9ab0b399
          test -f "$out/parent/combined_current_world.json"
          test -f "$out/parent/candidate/runtime.json"
          test -d "$out/parent/candidate/rendered"
          test "$(find "$out/parent/candidate/rendered" -maxdepth 1 -type f -name 'atmosphere-width-*.png' | wc -l | tr -d ' ')" = 68
          python - <<'PY'
          import json
          p=json.load(open('evidence/environment_nature_split_surface_culling_current_world_001/parent/combined_current_world.json'))
          assert p['environment_head']=='b0fa28733d77cad79d78f29e7ef76ccb9ab0b399',p
          assert p['composition_digest']=='6a7c4fa18d24d739b879d0fa8ecf76eb9ec8103ada0e771b65d401afe375adfb',p
          assert p['building_current_source_policy_rebind_result']=='PASS_CURRENT_WORLD_BUILDING_CURRENT_SOURCE_POLICY_REBIND_STRUCTURE',p
          assert len(p['states'])==17,p
          print('PASS_EXACT_CURRENT_WORLD_PARENT_ARTIFACT_IDENTITY')
          PY

      - name: Build exact split surface-culling receiving payload
        run: |
          set -euo pipefail
          out=evidence/environment_nature_split_surface_culling_current_world_001
          mkdir -p environment-proof/generated
          python tools/environment_nature_split_surface_culling_current_world.py build \
            --parent "$out/parent/combined_current_world.json" \
            --environment-head "$(cat exact-head.txt)" \
            --output environment-proof/generated/current_world_nature_winding_migration.json
          cp environment-proof/generated/current_world_nature_winding_migration.json "$out/combined_current_world.json"
          python - <<'PY'
          import json
          p=json.load(open('environment-proof/generated/current_world_nature_winding_migration.json'))
          assert p['nature_surface_culling_structure_result']=='PASS_CURRENT_WORLD_NATURE_SPLIT_SURFACE_CULLING_STRUCTURE',p
          q=p['nature_surface_culling_policy']
          assert q['policy_id']=='source-woody-back__source-foliage-two-sided-001',q
          assert q['woody_surface_cull']=='CULL_BACK',q
          assert q['foliage_surface_cull']=='CULL_DISABLED',q
          assert q['explicit_leaf_backface_geometry_adopted'] is False,q
          assert all(p['checks'].values()),p
          print('PASS_CURRENT_WORLD_NATURE_SPLIT_SURFACE_CULLING_STRUCTURE')
          PY

      - name: Install exact inherited Weather-width observer into proof host
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-map-design
          ref: 15a03b7c3ba3aaa7c0475ca1a3091c15581f559b
          path: .vfx-width-donor
          fetch-depth: 1

      - name: Verify inherited current-world observer chain
        run: |
          set -euo pipefail
          test "$(git -C .vfx-width-donor rev-parse HEAD)" = 15a03b7c3ba3aaa7c0475ca1a3091c15581f559b
          cp .vfx-width-donor/environment-proof/atmosphere_current_world_weather_width_observe.gd environment-proof/atmosphere_current_world_weather_width_observe.gd
          test -f environment-proof/atmosphere_current_world_building_header_segmentation_observe.gd
          test -f environment-proof/atmosphere_current_world_nature_material_family_observe.gd
          test -f environment-proof/atmosphere_current_world_object_material_family_observe.gd
          test -f environment-proof/atmosphere_current_world_object_footprint_material_review.gd
          test -f environment-proof/atmosphere_current_world_object_indexed_footprint_observe.gd
          test -f environment-proof/atmosphere_current_world_nature_winding_migration_observe.gd
          test -f environment-proof/atmosphere_current_world_building_current_policy_observe.gd
          test -f environment-proof/atmosphere_current_world_nature_split_surface_culling_observe.gd

      - name: Download pinned Godot 4.7.2
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum --check --strict
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Install proof dependencies and virtual display
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow
          if ! command -v xvfb-run >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y xvfb; fi

      - name: Observe exact current world with split Nature surface culling
        env:
          AXM_OBJECT_FOOTPRINT_REVIEW_MODE: CANDIDATE_VISIBLE
        run: |
          set -euo pipefail
          out=evidence/environment_nature_split_surface_culling_current_world_001/candidate
          mkdir -p "$out/rendered"
          rm -f environment-proof/atmosphere-width-*.png environment-proof/atmosphere-current-world-weather-width-runtime.json
          set +e
          xvfb-run --auto-servernum --server-args="-screen 0 1200x800x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 --rendering-method gl_compatibility \
            --path environment-proof --script atmosphere_current_world_nature_split_surface_culling_observe.gd \
            2>&1 | tee "$out/godot.log"
          status=${PIPESTATUS[0]}; set -e
          cp environment-proof/atmosphere-current-world-weather-width-runtime.json "$out/runtime.json" 2>/dev/null || true
          cp environment-proof/atmosphere-width-*.png "$out/rendered/" 2>/dev/null || true
          exit "$status"

      - name: Verify exact multi-asset split-culling receiving result
        run: |
          set -euo pipefail
          out=evidence/environment_nature_split_surface_culling_current_world_001
          python tools/environment_nature_split_surface_culling_current_world.py verify \
            --payload "$out/combined_current_world.json" \
            --parent-root "$out/parent/candidate" \
            --candidate-root "$out/candidate" \
            --environment-head "$(cat exact-head.txt)" \
            --output "$out/report.json"
          cp exact-head.txt "$out/exact-head.txt"
          python - <<'PY'
          import json
          p=json.load(open('evidence/environment_nature_split_surface_culling_current_world_001/report.json'))
          assert p['state']=='PASS_CURRENT_WORLD_NATURE_SPLIT_SURFACE_CULLING_TARGET_HOST',p
          assert p['matched_frames']==68 and p['changed_frames']>0,p
          assert p['weather_width_measurements']==1224,p
          assert p['maximum_weather_width_residual_px'] <= 0.05,p
          assert all(v==0 for v in p['runtime_counter_deltas'].values()),p
          assert all(p['checks'].values()),p
          print(json.dumps(p,indent=2))
          PY

      - name: Remove downloaded parent before upload
        if: always()
        run: |
          rm -rf evidence/environment_nature_split_surface_culling_current_world_001/parent

      - name: Upload retained Environment Nature split-culling evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: environment-nature-split-surface-culling-001-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/environment_nature_split_surface_culling_current_world_001
          if-no-files-found: error
          retention-days: 30
