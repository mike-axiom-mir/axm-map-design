name: Runtime synchronized sapling resource evidence

on:
  push:
    branches: [studio/runtime-synchronized-sapling-reuse-001]
    paths:
      - "environment-proof/atmosphere_dynamic_budget_observe.gd"
      - "tools/environment_atmosphere_dynamic_runtime.py"
      - "docs/ENVIRONMENT_ATMOSPHERE_DYNAMIC_RUNTIME_001.md"
      - ".github/workflows/runtime-atmosphere-dynamic-sapling.yml"
      - "tools/environment_atmosphere_sync.py"
      - "environment-proof/**"
  pull_request:
    paths:
      - "environment-proof/atmosphere_dynamic_budget_observe.gd"
      - "tools/environment_atmosphere_dynamic_runtime.py"
      - "docs/ENVIRONMENT_ATMOSPHERE_DYNAMIC_RUNTIME_001.md"
      - ".github/workflows/runtime-atmosphere-dynamic-sapling.yml"
      - "tools/environment_atmosphere_sync.py"
      - "environment-proof/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-synchronized-sapling-runtime-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact Runtime head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pin exact Runtime and VFX ancestry
        run: |
          set -euo pipefail
          git rev-parse HEAD > exact-head.txt
          test "$(git rev-parse HEAD^)" = "d476cf7c11de74c53397cb21e6f40f90a51c0356" || {
            echo "Runtime proof must remain a direct one-commit structural stack on exact VFX head until evidence is accepted." >&2
            exit 1
          }

      - name: Checkout exact accepted Nature visual response
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-nature-design
          ref: cee14f5b3feea78b0adcd044bad2ea3c97657fc6
          path: .nature

      - name: Checkout exact Weather source
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-weather-design
          ref: ca2eaba519e8449835b0ea6ef944b7080c3caa6a
          path: .weather

      - name: Verify exact dependency heads and Python contract
        run: |
          set -euo pipefail
          test "$(git -C .nature rev-parse HEAD)" = "cee14f5b3feea78b0adcd044bad2ea3c97657fc6"
          test "$(git -C .weather rev-parse HEAD)" = "ca2eaba519e8449835b0ea6ef944b7080c3caa6a"
          python -m py_compile tools/environment_atmosphere_sync.py tools/environment_atmosphere_dynamic_runtime.py

      - name: Rebuild exact VFX synchronized prerequisite
        env:
          AXM_RECEIVING_HEAD: d476cf7c11de74c53397cb21e6f40f90a51c0356
        run: |
          set -euo pipefail
          mkdir -p evidence/environment_atmosphere_dynamic_runtime_001/sync
          python tools/environment_atmosphere_sync.py \
            --nature-root .nature \
            --weather-root .weather \
            --nature-response-head cee14f5b3feea78b0adcd044bad2ea3c97657fc6 \
            --output evidence/environment_atmosphere_dynamic_runtime_001/sync
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('evidence/environment_atmosphere_dynamic_runtime_001/sync/atmosphere_sync.json')
          data=json.loads(p.read_text())
          assert data['status']=='PASS_SYNCHRONIZED_VISUAL_ATMOSPHERE_SEQUENCE', data
          assert data['receiving_head']=='d476cf7c11de74c53397cb21e6f40f90a51c0356', data
          assert data['shared_relationship']=='SHARED_EVIDENCE_CLOCK_AND_EXACT_VISUAL_DIRECTION_NOT_PHYSICAL_COUPLING', data
          assert len(data['states'])==9, data
          assert all(len(row['candidate_scene']['weather_lines'])==36 for row in data['states']), data
          assert all(len(row['candidate_scene']['sapling']['vertices_source_xyz_m'])==390 for row in data['states']), data
          assert all(len(row['candidate_scene']['sapling']['triangles'])==570 for row in data['states']), data
          PY
          mkdir -p environment-proof/generated
          cp evidence/environment_atmosphere_dynamic_runtime_001/sync/atmosphere_sync.json environment-proof/generated/atmosphere_sync.json

      - name: Download pinned Godot 4.7.2
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum --check --strict
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Install virtual display when needed
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Run synthetic sapling-rebuild control in one live process
        run: |
          set -euo pipefail
          xvfb-run --auto-servernum --server-args="-screen 0 1200x800x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --path environment-proof \
            --script atmosphere_dynamic_budget_observe.gd -- rebuild_sapling_control

      - name: Run stable sapling-resource candidate in one live process
        run: |
          set -euo pipefail
          xvfb-run --auto-servernum --server-args="-screen 0 1200x800x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --path environment-proof \
            --script atmosphere_dynamic_budget_observe.gd -- reuse_sapling_mesh

      - name: Compare exact before and after evidence
        run: |
          set -euo pipefail
          out=evidence/environment_atmosphere_dynamic_runtime_001
          cp environment-proof/atmosphere-dynamic-runtime-rebuild_sapling_control.json "$out/control.json"
          cp environment-proof/atmosphere-dynamic-runtime-reuse_sapling_mesh.json "$out/candidate.json"
          python tools/environment_atmosphere_dynamic_runtime.py \
            --control "$out/control.json" \
            --candidate "$out/candidate.json" \
            --image-root environment-proof \
            --runtime-head "$(cat exact-head.txt)" \
            --output "$out/comparison.json"
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('evidence/environment_atmosphere_dynamic_runtime_001/comparison.json').read_text())
          assert data['state']=='PASS_REUSE_SINGLE_SAPLING_ARRAYMESH_RESOURCE_CHURN_CONTRACT', data
          assert all(data['checks'].values()), data
          assert data['visual_tradeoff_for_art_director']=='NONE_OBSERVED_IN_EXACT_RETAINED_PROOF_FRAMES', data
          print(json.dumps({'state':data['state'],'measurements':data['measurements'],'visual_tradeoff_for_art_director':data['visual_tradeoff_for_art_director']}, indent=2))
          PY

      - name: Retain exact control and candidate frames
        if: always()
        run: |
          mkdir -p evidence/environment_atmosphere_dynamic_runtime_001/rendered
          cp environment-proof/atmosphere-dynamic-*.png evidence/environment_atmosphere_dynamic_runtime_001/rendered/ 2>/dev/null || true

      - name: Upload exact synchronized sapling Runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: environment-atmosphere-dynamic-runtime-001-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            exact-head.txt
            evidence/environment_atmosphere_dynamic_runtime_001/sync/atmosphere_sync.json
            evidence/environment_atmosphere_dynamic_runtime_001/control.json
            evidence/environment_atmosphere_dynamic_runtime_001/candidate.json
            evidence/environment_atmosphere_dynamic_runtime_001/comparison.json
            evidence/environment_atmosphere_dynamic_runtime_001/rendered/*.png
          if-no-files-found: warn
          retention-days: 30
