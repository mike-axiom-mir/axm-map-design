name: Runtime multi-source Nature material sharing evidence

on:
  push:
    branches: [studio/runtime-nature-material-sharing-001]
    paths:
      - "environment-proof/nature_material_runtime_observe.gd"
      - "tools/verify_environment_nature_material_runtime.py"
      - "docs/ENVIRONMENT_NATURE_MATERIAL_RUNTIME_001.md"
      - ".github/workflows/runtime-nature-material-sharing.yml"
      - "tools/environment_rear_tree_source_replacement.py"
      - "environment-proof/project.godot"
  pull_request:
    paths:
      - "environment-proof/nature_material_runtime_observe.gd"
      - "tools/verify_environment_nature_material_runtime.py"
      - "docs/ENVIRONMENT_NATURE_MATERIAL_RUNTIME_001.md"
      - ".github/workflows/runtime-nature-material-sharing.yml"
      - "tools/environment_rear_tree_source_replacement.py"
      - "environment-proof/project.godot"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-nature-material-sharing:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact Runtime head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind exact receiving head
        run: |
          set -euo pipefail
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          OBSERVED="$(git rev-parse HEAD)"
          test "$OBSERVED" = "$EXPECTED"
          printf '%s\n' "$OBSERVED" > exact-head.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Checkout exact west Nature source
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-nature-design
          ref: fbc202449981f2bac153951c561ed0ed6120c936
          path: .nature-base

      - name: Checkout exact compact Nature source
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-nature-design
          ref: 64116d63fc76daa1623b5fd5046a4e6074100bda
          path: .nature-east

      - name: Checkout exact rear Nature source
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-nature-design
          ref: a4e5ee011e1d87f47866a7e6c6f4e66f57b6af12
          path: .nature-rear

      - name: Checkout exact Weather source
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-weather-design
          ref: ca2eaba519e8449835b0ea6ef944b7080c3caa6a
          path: .weather

      - name: Checkout exact Building source
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-building-design
          ref: 4faa769b406bf3ad0ba9489a77141c27f122ce51
          path: .building

      - name: Compile verifier and rerun Environment structural prerequisite
        env:
          AXM_BASE_NATURE_ROOT: ${{ github.workspace }}/.nature-base
          AXM_COMPACT_NATURE_ROOT: ${{ github.workspace }}/.nature-east
          AXM_REAR_NATURE_ROOT: ${{ github.workspace }}/.nature-rear
          AXM_WEATHER_ROOT: ${{ github.workspace }}/.weather
          AXM_BUILDING_ROOT: ${{ github.workspace }}/.building
          AXM_BUILDING_HEAD: 4faa769b406bf3ad0ba9489a77141c27f122ce51
          AXM_REAR_NATURE_HEAD: a4e5ee011e1d87f47866a7e6c6f4e66f57b6af12
        run: |
          python -m py_compile tools/verify_environment_nature_material_runtime.py
          python -m unittest tests.test_environment_rear_tree_source_replacement -v

      - name: Rebuild exact three-source Nature receiving scene
        env:
          AXM_RECEIVING_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          AXM_BUILDING_HEAD: 4faa769b406bf3ad0ba9489a77141c27f122ce51
          AXM_REAR_NATURE_HEAD: a4e5ee011e1d87f47866a7e6c6f4e66f57b6af12
        run: |
          set -euo pipefail
          python tools/environment_rear_tree_source_replacement.py \
            --base-nature-root .nature-base \
            --compact-nature-root .nature-east \
            --weather-root .weather \
            --building-root .building \
            --rear-nature-root .nature-rear \
            --output evidence/environment_nature_material_runtime_001/source
          cp exact-head.txt evidence/environment_nature_material_runtime_001/exact-head.txt
          mkdir -p environment-proof/generated
          cp evidence/environment_nature_material_runtime_001/source/candidate_scene_runtime.json environment-proof/generated/scene_runtime.json

      - name: Validate exact scene prerequisite
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('evidence/environment_nature_material_runtime_001')
          scene=json.loads((root/'source/candidate_scene_runtime.json').read_text())
          evidence=json.loads((root/'source/replacement_evidence.json').read_text())
          exact=(root/'exact-head.txt').read_text().strip()
          assert evidence['status']=='PASS_REAR_RIGHT_NATURE_SOURCE_REPLACEMENT_STRUCTURE',evidence
          assert all(evidence['checks'].values()),evidence
          assert scene['receiving_head']==evidence['receiving_head']==exact,(scene,evidence,exact)
          nature=[scene['sapling']]+[row for row in scene.get('additional_source_meshes',[]) if row.get('kind')=='nature-source']
          assert len(nature)==3,nature
          assert any(row.get('asset_id')=='source:nature:compact-east-tree-neutral-001' for row in nature),nature
          assert any(row.get('asset_id')=='source:nature:east-rear-tree-neutral-001' for row in nature),nature
          assert any(row.get('asset_id')=='source:building:service-pavilion-001' for row in scene.get('additional_source_meshes',[])),scene
          print(json.dumps({'scene_digest':scene['scene_digest'],'nature_source_meshes':[row.get('asset_id') for row in nature]},indent=2))
          PY

      - name: Download pinned Godot 4.7.2
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum --check --strict
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Install virtual display when needed
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Observe per-mesh material control
        run: |
          set -euo pipefail
          rm -f environment-proof/nature-material-runtime-per_mesh_material_control.json
          rm -f environment-proof/nature-material-per_mesh_material_control-path_eye.png environment-proof/nature-material-per_mesh_material_control-elevated_oblique.png
          xvfb-run --auto-servernum --server-args="-screen 0 1200x800x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --path environment-proof \
            --script nature_material_runtime_observe.gd \
            -- per_mesh_material_control
          cp environment-proof/nature-material-runtime-per_mesh_material_control.json evidence/environment_nature_material_runtime_001/control_receipt.json
          cp environment-proof/nature-material-per_mesh_material_control-path_eye.png evidence/environment_nature_material_runtime_001/control_path_eye.png
          cp environment-proof/nature-material-per_mesh_material_control-elevated_oblique.png evidence/environment_nature_material_runtime_001/control_elevated_oblique.png

      - name: Observe shared Nature material candidate
        run: |
          set -euo pipefail
          rm -f environment-proof/nature-material-runtime-shared_nature_material.json
          rm -f environment-proof/nature-material-shared_nature_material-path_eye.png environment-proof/nature-material-shared_nature_material-elevated_oblique.png
          xvfb-run --auto-servernum --server-args="-screen 0 1200x800x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --path environment-proof \
            --script nature_material_runtime_observe.gd \
            -- shared_nature_material
          cp environment-proof/nature-material-runtime-shared_nature_material.json evidence/environment_nature_material_runtime_001/candidate_receipt.json
          cp environment-proof/nature-material-shared_nature_material-path_eye.png evidence/environment_nature_material_runtime_001/candidate_path_eye.png
          cp environment-proof/nature-material-shared_nature_material-elevated_oblique.png evidence/environment_nature_material_runtime_001/candidate_elevated_oblique.png

      - name: Verify exact before and after evidence
        run: |
          set -euo pipefail
          python tools/verify_environment_nature_material_runtime.py \
            --control evidence/environment_nature_material_runtime_001/control_receipt.json \
            --candidate evidence/environment_nature_material_runtime_001/candidate_receipt.json \
            --artifact-root evidence/environment_nature_material_runtime_001 \
            --output evidence/environment_nature_material_runtime_001/runtime_evidence.json \
            --expected-nature-meshes 3

      - name: Upload exact Nature material sharing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: environment-nature-material-runtime-001-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            evidence/environment_nature_material_runtime_001/exact-head.txt
            evidence/environment_nature_material_runtime_001/source/replacement_evidence.json
            evidence/environment_nature_material_runtime_001/source/candidate_scene_runtime.json
            evidence/environment_nature_material_runtime_001/control_receipt.json
            evidence/environment_nature_material_runtime_001/candidate_receipt.json
            evidence/environment_nature_material_runtime_001/runtime_evidence.json
            evidence/environment_nature_material_runtime_001/control_path_eye.png
            evidence/environment_nature_material_runtime_001/candidate_path_eye.png
            evidence/environment_nature_material_runtime_001/control_elevated_oblique.png
            evidence/environment_nature_material_runtime_001/candidate_elevated_oblique.png
          if-no-files-found: warn
          retention-days: 30
