name: Environment Object articulated service clearance

on:
  push:
    branches: [studio/environment-object-articulated-service-clearance-001]
    paths:
      - "contracts/environment_object_articulated_service_clearance.json"
      - "tools/environment_object_articulated_service_clearance.py"
      - "docs/ENVIRONMENT_OBJECT_ARTICULATED_SERVICE_CLEARANCE_001.md"
      - ".github/workflows/environment-object-articulated-service-clearance.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  articulated-service-clearance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact Environment head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Environment proof sources
        run: |
          set -euo pipefail
          python -m py_compile tools/environment_object_articulated_service_clearance.py
          python -m json.tool contracts/environment_object_articulated_service_clearance.json >/dev/null
          git merge-base --is-ancestor fc567fd6dd061ccb5e8232bd17ee0af3d2e064b7 HEAD
          python - <<'PY'
          import json, subprocess
          expected={
            '.github/workflows/environment-object-articulated-service-clearance.yml',
            'contracts/environment_object_articulated_service_clearance.json',
            'docs/ENVIRONMENT_OBJECT_ARTICULATED_SERVICE_CLEARANCE_001.md',
            'tools/environment_object_articulated_service_clearance.py',
          }
          changed=set(subprocess.check_output(['git','diff','--name-only','fc567fd6dd061ccb5e8232bd17ee0af3d2e064b7','HEAD'],text=True).splitlines())
          assert changed==expected,(sorted(changed),sorted(expected))
          d=json.load(open('contracts/environment_object_articulated_service_clearance.json'))
          assert d['technical_art_parent_head']=='fc567fd6dd061ccb5e8232bd17ee0af3d2e064b7',d
          assert d['animation_head']=='86bdbe9771bf9eb1bc92bd4160442941763fab1d',d
          assert d['object_technical_art_head']=='b9848c62b2adde84e9e0afc219088113216799d6',d
          assert d['technical_art_parent_artifact']['id']==10596947383,d
          assert d['technical_art_parent_artifact']['sha256']=='ccffa0dcf90df584caf86f5c3b85f0c90bc306851a99da75dcbb1c28e11724ac',d
          assert d['historical_technical_art_parent_head']=='e085437f6cc958bbf7c5c6464578923d542962b0',d
          assert d['historical_receipts_reused_as_current_evidence'] is False,d
          print('PASS_CURRENT_TA_ENVIRONMENT_CORE_ONLY_DELTA')
          PY
          git rev-parse HEAD > exact-head.txt

      - name: Download exact Technical Art motion and retained combined-world evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root=evidence/environment_object_articulated_service_clearance
          mkdir -p "$root/ta" "$root/world"

          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/mike-axiom-mir/axm-map-design/actions/artifacts/10596947383/zip" \
            -o "$root/ta.zip"
          echo "ccffa0dcf90df584caf86f5c3b85f0c90bc306851a99da75dcbb1c28e11724ac  $root/ta.zip" | sha256sum --check --strict
          unzip -q "$root/ta.zip" -d "$root/ta"

          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/mike-axiom-mir/axm-map-design/actions/artifacts/10509037278/zip" \
            -o "$root/world.zip"
          echo "8f2f8aa4bb11e2f868a6ce36dd381933ba1ea6c59be7b82ed00d1dfe5402ee97  $root/world.zip" | sha256sum --check --strict
          unzip -q "$root/world.zip" -d "$root/world"

          test -f "$root/ta/object-rigid-component-map.json"
          test -f "$root/ta/object-motion-receiver-plan.json"
          test -f "$root/ta/final-receipt.json"
          python - <<'PY'
          import json
          d=json.load(open('evidence/environment_object_articulated_service_clearance/ta/final-receipt.json'))
          assert d['exact_head']=='fc567fd6dd061ccb5e8232bd17ee0af3d2e064b7',d
          assert d['animation_head']=='86bdbe9771bf9eb1bc92bd4160442941763fab1d',d
          assert d['object_technical_art_head']=='b9848c62b2adde84e9e0afc219088113216799d6',d
          assert d['result']=='PASS_CURRENT_WORLD_OBJECT_ANIMATION_OWNER_SAMPLES_THROUGH_RIGID_RECEIVER__VFX_RUNTIME_ENV_ADOPTION_HELD',d
          assert d['environment_adoption'] is False and d['runtime_acceptance'] is False,d
          PY
          for sample in 0 10 50 100; do test -f "$root/ta/runtime-$sample.json"; done
          test -f "$root/world/combined_current_world.json"

      - name: Prove full 101-sample articulated service envelope and bounded successor
        run: |
          set -euo pipefail
          root=evidence/environment_object_articulated_service_clearance
          python tools/environment_object_articulated_service_clearance.py \
            --contract contracts/environment_object_articulated_service_clearance.json \
            --component-map "$root/ta/object-rigid-component-map.json" \
            --motion-plan "$root/ta/object-motion-receiver-plan.json" \
            --runtime "$root/ta/runtime-0.json" \
            --runtime "$root/ta/runtime-10.json" \
            --runtime "$root/ta/runtime-50.json" \
            --runtime "$root/ta/runtime-100.json" \
            --final-receipt "$root/ta/final-receipt.json" \
            --combined-world "$root/world/combined_current_world.json" \
            --output "$root/report.json"

      - name: Negative rejects insufficient 10 mm rear expansion
        run: |
          set -euo pipefail
          root=evidence/environment_object_articulated_service_clearance
          python - <<'PY'
          import json
          p='contracts/environment_object_articulated_service_clearance.json'
          d=json.load(open(p))
          d['candidate']['rear_outer_edge_expansion_m']=0.01
          open(f'{p}.negative','w').write(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
          set +e
          python tools/environment_object_articulated_service_clearance.py \
            --contract contracts/environment_object_articulated_service_clearance.json.negative \
            --component-map "$root/ta/object-rigid-component-map.json" \
            --motion-plan "$root/ta/object-motion-receiver-plan.json" \
            --runtime "$root/ta/runtime-0.json" \
            --runtime "$root/ta/runtime-10.json" \
            --runtime "$root/ta/runtime-50.json" \
            --runtime "$root/ta/runtime-100.json" \
            --final-receipt "$root/ta/final-receipt.json" \
            --combined-world "$root/world/combined_current_world.json" \
            --rear-expansion-m 0.01 \
            --output "$root/negative-report.json" > "$root/negative.log" 2>&1
          code=$?
          set -e
          test "$code" -ne 0
          grep -q "does not restore 60 mm articulated clearance" "$root/negative.log"
          echo PASS_REJECTED_INSUFFICIENT_10MM_SERVICE_FRAME_EXPANSION

      - name: Retain exact Environment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: environment-object-articulated-service-clearance-${{ github.sha }}
          path: |
            exact-head.txt
            contracts/environment_object_articulated_service_clearance.json
            docs/ENVIRONMENT_OBJECT_ARTICULATED_SERVICE_CLEARANCE_001.md
            evidence/environment_object_articulated_service_clearance/report.json
            evidence/environment_object_articulated_service_clearance/negative.log
            evidence/environment_object_articulated_service_clearance/ta/final-receipt.json
            evidence/environment_object_articulated_service_clearance/ta/object-rigid-component-map.json
            evidence/environment_object_articulated_service_clearance/ta/object-motion-receiver-plan.json
          if-no-files-found: warn
