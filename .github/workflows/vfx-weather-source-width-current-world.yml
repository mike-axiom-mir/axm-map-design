name: VFX current-world Weather source-width target-host evidence

on:
  push:
    branches: [studio/vfx-weather-source-width-current-world-001]
    paths:
      - "tools/environment_weather_width_current_world.py"
      - "environment-proof/atmosphere_current_world_weather_width_observe.gd"
      - ".github/workflows/vfx-weather-source-width-current-world.yml"
      - "docs/ENVIRONMENT_WEATHER_SOURCE_WIDTH_CURRENT_WORLD_001.md"
  pull_request:
    paths:
      - "tools/environment_weather_width_current_world.py"
      - "environment-proof/atmosphere_current_world_weather_width_observe.gd"
      - ".github/workflows/vfx-weather-source-width-current-world.yml"
      - "docs/ENVIRONMENT_WEATHER_SOURCE_WIDTH_CURRENT_WORLD_001.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-current-world-weather-source-width:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact VFX width receiving head with ancestry
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bind exact receiving and parent Weather-variant identity
        run: |
          set -euo pipefail
          git rev-parse HEAD > exact-head.txt
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git cat-file -e e482d003853e52fc835f1797ddfb6506a50083ef^{commit}
          git merge-base --is-ancestor e482d003853e52fc835f1797ddfb6506a50083ef HEAD

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Checkout exact parent Weather-variant receiving implementation
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-map-design
          ref: e482d003853e52fc835f1797ddfb6506a50083ef
          path: .variant-parent
          fetch-depth: 1

      - name: Checkout exact dense VFX donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-map-design
          ref: 6e386d513c0b2e821a89fb066b2e3ab58a0d6868
          path: .vfx-donor
          fetch-depth: 1

      - name: Checkout exact baseline Nature source
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-nature-design
          ref: fbc202449981f2bac153951c561ed0ed6120c936
          path: .nature-base

      - name: Checkout exact compact Nature source
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-nature-design
          ref: 64116d63fc76daa1623b5fd5046a4e6074100bda
          path: .nature-east

      - name: Checkout exact accepted Nature visual response
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-nature-design
          ref: cee14f5b3feea78b0adcd044bad2ea3c97657fc6
          path: .nature-response

      - name: Checkout exact historical rear Nature source
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-nature-design
          ref: a4e5ee011e1d87f47866a7e6c6f4e66f57b6af12
          path: .nature-rear-historical

      - name: Checkout exact migrated rear Nature source
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-nature-design
          ref: 4ddbe66e5c02d22407ef773d5346a2fe6f349a2d
          path: .nature-rear-migrated

      - name: Checkout exact baseline Weather source
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-weather-design
          ref: ca2eaba519e8449835b0ea6ef944b7080c3caa6a
          path: .weather-base

      - name: Checkout exact Weather variation family
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-weather-design
          ref: 05b26c4e82bbe0a4de0ee7bee34179efc58b9719
          path: .weather-variant

      - name: Checkout exact Building source
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-building-design
          ref: 4faa769b406bf3ad0ba9489a77141c27f122ce51
          path: .building

      - name: Verify exact donor heads and compile receiving tooling
        run: |
          set -euo pipefail
          test "$(git -C .variant-parent rev-parse HEAD)" = "e482d003853e52fc835f1797ddfb6506a50083ef"
          test "$(git -C .vfx-donor rev-parse HEAD)" = "6e386d513c0b2e821a89fb066b2e3ab58a0d6868"
          test "$(git -C .weather-base rev-parse HEAD)" = "ca2eaba519e8449835b0ea6ef944b7080c3caa6a"
          test "$(git -C .weather-variant rev-parse HEAD)" = "05b26c4e82bbe0a4de0ee7bee34179efc58b9719"
          python -m py_compile tools/environment_weather_width_current_world.py

      - name: Rebuild exact parent Weather variant at exact parent head
        env:
          AXM_RECEIVING_HEAD: e482d003853e52fc835f1797ddfb6506a50083ef
          AXM_BUILDING_HEAD: 4faa769b406bf3ad0ba9489a77141c27f122ce51
          AXM_REAR_NATURE_HEAD: a4e5ee011e1d87f47866a7e6c6f4e66f57b6af12
          AXM_MIGRATED_REAR_NATURE_HEAD: 4ddbe66e5c02d22407ef773d5346a2fe6f349a2d
        run: |
          set -euo pipefail
          mkdir -p evidence/environment_weather_source_width_current_world_001 environment-proof/generated
          python .variant-parent/tools/environment_weather_variant_current_world.py build \
            --vfx-donor-root .vfx-donor \
            --base-nature-root .nature-base \
            --compact-nature-root .nature-east \
            --nature-response-root .nature-response \
            --weather-base-root .weather-base \
            --weather-variant-root .weather-variant \
            --building-root .building \
            --historical-rear-root .nature-rear-historical \
            --migrated-rear-root .nature-rear-migrated \
            --output evidence/environment_weather_source_width_current_world_001/parent_variant.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('evidence/environment_weather_source_width_current_world_001/parent_variant.json').read_text())
          assert data['status']=='PASS_CURRENT_WORLD_WEATHER_VARIANT_REBIND_STRUCTURE', data
          assert all(data['checks'].values()), data
          assert data['receiving_head']=='e482d003853e52fc835f1797ddfb6506a50083ef', data['receiving_head']
          PY

      - name: Bind exact source-authored Weather width profile into all 17 states
        env:
          AXM_RECEIVING_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          out=evidence/environment_weather_source_width_current_world_001
          python tools/environment_weather_width_current_world.py build \
            --parent "$out/parent_variant.json" \
            --weather-variant-root .weather-variant \
            --output "$out/current_world_weather_width.json"
          cp exact-head.txt "$out/exact-head.txt"
          cp "$out/current_world_weather_width.json" environment-proof/generated/current_world_weather_width.json
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('evidence/environment_weather_source_width_current_world_001')
          data=json.loads((root/'current_world_weather_width.json').read_text())
          exact=(root/'exact-head.txt').read_text().strip()
          assert data['status']=='PASS_CURRENT_WORLD_WEATHER_SOURCE_WIDTH_STRUCTURE', data
          assert all(data['checks'].values()), data
          assert data['receiving_head']==exact, (data['receiving_head'], exact)
          assert data['source_width_summary']['count']==36, data
          assert 1.0 <= data['source_width_summary']['minimum_px'] <= data['source_width_summary']['maximum_px'] <= 2.4, data
          assert len(data['states'])==17, data
          print(json.dumps({'status':data['status'],'source_width_summary':data['source_width_summary'],'binding_digest':data['weather_width_binding_digest']},indent=2))
          PY

      - name: Exercise fail-closed parent identity control
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, tempfile
          from pathlib import Path
          import tools.environment_weather_width_current_world as width
          source=Path('evidence/environment_weather_source_width_current_world_001/parent_variant.json')
          data=json.loads(source.read_text())
          data['receiving_head']='drifted-parent'
          with tempfile.TemporaryDirectory() as td:
              path=Path(td)/'drift.json'
              path.write_text(json.dumps(data))
              try:
                  width.build_payload(path,'.weather-variant')
              except ValueError as exc:
                  assert 'exact-head drift' in str(exc), exc
              else:
                  raise AssertionError('parent identity drift must fail closed')
          PY

      - name: Download pinned Godot 4.7.2
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum --check --strict
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Install virtual display when needed
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Run exact control and source-width candidate through all 17 states and both fixed cameras
        run: |
          set -euo pipefail
          xvfb-run --auto-servernum --server-args="-screen 0 1200x800x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --path environment-proof \
            --script atmosphere_current_world_weather_width_observe.gd

      - name: Verify exact source-width target-host evidence
        run: |
          set -euo pipefail
          out=evidence/environment_weather_source_width_current_world_001
          cp environment-proof/atmosphere-current-world-weather-width-runtime.json "$out/runtime.json"
          python tools/environment_weather_width_current_world.py verify \
            --payload "$out/current_world_weather_width.json" \
            --receipt "$out/runtime.json" \
            --image-root environment-proof \
            --output "$out/target_host.json"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('evidence/environment_weather_source_width_current_world_001')
          target=json.loads((root/'target_host.json').read_text())
          assert target['state']=='PASS_CURRENT_WORLD_WEATHER_SOURCE_WIDTH_LIVE_TARGET_HOST', target
          assert all(target['checks'].values()), target
          print(json.dumps({
              'state':target['state'],
              'maximum_projected_width_residual_px':target['maximum_projected_width_residual_px'],
              'control_runtime_counter_sets':target['control_runtime_counter_sets'],
              'candidate_runtime_counter_sets':target['candidate_runtime_counter_sets'],
          },indent=2))
          PY

      - name: Retain exact source-width A/B frames
        if: always()
        run: |
          mkdir -p evidence/environment_weather_source_width_current_world_001/rendered
          cp environment-proof/atmosphere-width-*.png evidence/environment_weather_source_width_current_world_001/rendered/ 2>/dev/null || true

      - name: Upload exact current-world Weather source-width evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: environment-weather-source-width-current-world-001-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            evidence/environment_weather_source_width_current_world_001/exact-head.txt
            evidence/environment_weather_source_width_current_world_001/parent_variant.json
            evidence/environment_weather_source_width_current_world_001/current_world_weather_width.json
            evidence/environment_weather_source_width_current_world_001/runtime.json
            evidence/environment_weather_source_width_current_world_001/target_host.json
            evidence/environment_weather_source_width_current_world_001/rendered/*.png
          if-no-files-found: warn
          retention-days: 30
