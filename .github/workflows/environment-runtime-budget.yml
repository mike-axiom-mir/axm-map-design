name: Environment runtime budget evidence

on:
  push:
    branches: [studio/runtime-environment-budget-001]
    paths:
      - "tools/environment_runtime_budget.py"
      - "tests/test_environment_runtime_budget.py"
      - "environment-proof/runtime_budget_observe.gd"
      - "docs/ENVIRONMENT_RUNTIME_BUDGET_001.md"
      - ".github/workflows/environment-runtime-budget.yml"
      - "tools/environment_eye_level.py"
      - "tools/environment_real_slice.py"
      - "examples/environment_real_slice_001.json"
  pull_request:
    paths:
      - "tools/environment_runtime_budget.py"
      - "tests/test_environment_runtime_budget.py"
      - "environment-proof/runtime_budget_observe.gd"
      - "docs/ENVIRONMENT_RUNTIME_BUDGET_001.md"
      - ".github/workflows/environment-runtime-budget.yml"
      - "tools/environment_eye_level.py"
      - "tools/environment_real_slice.py"
      - "examples/environment_real_slice_001.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-runtime-budget-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Runtime lane
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Checkout exact Nature source
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-nature-design
          ref: fbc202449981f2bac153951c561ed0ed6120c936
          path: .nature

      - name: Checkout exact Weather source
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-weather-design
          ref: ca2eaba519e8449835b0ea6ef944b7080c3caa6a
          path: .weather

      - name: Compile and run repository tests
        run: |
          python -m compileall -q tools tests
          python -m unittest discover -s tests -v

      - name: Build exact comparative runtime payload
        env:
          AXM_RECEIVING_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python tools/environment_runtime_budget.py prepare \
            --nature-root .nature \
            --weather-root .weather \
            --output evidence/environment_runtime_budget_001

      - name: Validate prepared payload
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('evidence/environment_runtime_budget_001')
          evidence=json.loads((root/'runtime_budget_prepare_evidence.json').read_text())
          payload=json.loads((root/'runtime_budget_scene.json').read_text())
          assert evidence['status']=='PASS', evidence
          assert all(evidence['checks'].values()), evidence
          assert payload['base_variant']['seed']==29, payload
          assert len(payload['scene']['sapling']['triangles'])==570, payload
          assert len(payload['scene']['weather_lines'])==36, payload
          print(json.dumps(evidence,indent=2))
          PY

      - name: Stage exact payload into proof host
        run: |
          rm -rf environment-proof/generated
          mkdir -p environment-proof/generated
          cp evidence/environment_runtime_budget_001/runtime_budget_scene.json environment-proof/generated/

      - name: Download pinned Godot 4.7.2
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum --check --strict
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Install virtual display when needed
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Measure three exact scene states in fresh proof-host processes
        run: |
          set -euo pipefail
          rm -f environment-proof/runtime-budget-*.json environment-proof/runtime-budget-*.png
          for variant in proxy_baseline source_sapling_only source_sapling_weather; do
            xvfb-run --auto-servernum --server-args="-screen 0 1200x800x24" \
              .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
              --display-driver x11 \
              --rendering-method gl_compatibility \
              --path environment-proof \
              --script runtime_budget_observe.gd \
              -- "$variant"
          done

      - name: Aggregate comparative runtime evidence
        run: |
          python tools/environment_runtime_budget.py aggregate \
            --payload evidence/environment_runtime_budget_001/runtime_budget_scene.json \
            --runtime-dir environment-proof \
            --output evidence/environment_runtime_budget_001/runtime_budget_evidence.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('evidence/environment_runtime_budget_001/runtime_budget_evidence.json')
          row=json.loads(p.read_text())
          assert row['status']=='PASS', row
          assert row['state']=='PASS_SCOPED_FIRST_ENVIRONMENT_RUNTIME_BASELINE', row
          assert row['weather_batch_gate']=='PASS_EXACT_ONE_DRAW_CALL_36_PRIMITIVES_BOTH_CAMERAS', row
          print(json.dumps(row,indent=2))
          PY

      - name: Upload exact comparative runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: environment-runtime-budget-001-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            evidence/environment_runtime_budget_001/runtime_budget_scene.json
            evidence/environment_runtime_budget_001/runtime_budget_prepare_evidence.json
            evidence/environment_runtime_budget_001/runtime_budget_evidence.json
            environment-proof/runtime-budget-*.json
            environment-proof/runtime-budget-*.png
          if-no-files-found: warn
          retention-days: 30
